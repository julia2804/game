  /* ------------------------------------------------------------
     导出 / 导入的实际动作
     ------------------------------------------------------------ */

  /**
   * 导出。
   * 关键：download() 必须在这次点击的同一个调用栈里执行，
   * 中间不能 await 异步操作，否则 iOS 认为不是用户手势，会拦掉下载。
   */
  function doExport() {
    try {
      var blob = S.exportBlob();
      var name = S.exportFileName();
      S.download(blob, name);
      toast("已导出，去「文件」App 里找 " + name, 3200);
    } catch (e) {
      toast("导出失败：" + (e && e.message ? e.message : "未知错误"), 3000);
    }
  }

  /**
   * 导入。
   * 用 <input type="file"> 选文件，再用 FileReader 读成文本。
   *
   * 为什么不用 fetch / XMLHttpRequest 读本地文件：
   *   file:// 协议下浏览器会以跨域为由直接拒绝，
   *   而 <input type="file"> + FileReader 是用户主动授权选择文件，
   *   不受同源策略限制，双击打开本地 HTML 时也能用。
   */
  function doImport() {
    var input = document.createElement("input");
    input.type = "file";
    // accept 只是给选择器一个筛选提示，用户仍可切到「所有文件」
    input.accept = ".json,application/json";
    input.style.display = "none";
    document.body.appendChild(input);

    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (f) {
        var reader = new FileReader();
        reader.onload = function () {
          var text = String(reader.result || "");
          // 先干跑一次校验，确认这个文件能用，再让用户确认覆盖
          var probe = safeParseWrap(text);
          if (!probe.ok) {
            dialog({
              title: "这个文件不能用",
              text: probe.msg,
              okText: "知道了",
              cancelText: null,
            });
            return;
          }
          dialog({
            title: "导入进度？",
            text:
              "文件来自 " +
              (probe.exportedAt || "未知时间") +
              "，包含 " +
              probe.users +
              " 个使用者。\n\n当前进度会被整个替换掉。导入前会自动备份一次，万一导错了可以在设置里恢复。",
            okText: "导入并覆盖",
            danger: true,
          }).then(function (ok) {
            if (!ok) return;
            var r = S.importText(text);
            if (r.ok) {
              toast("导入成功" + (r.saved ? "" : "（写入失败，请立即导出备份）"), 3000);
              go("home");
            } else {
              toast("导入失败");
            }
          });
        };
        reader.onerror = function () {
          toast("读取文件失败");
        };
        reader.readAsText(f, "utf-8");
      }
      if (input.parentNode) input.parentNode.removeChild(input);
    });

    input.click();
  }

  /** 只校验不写入，用于导入前的预览确认 */
  function safeParseWrap(text) {
    var w;
    try {
      w = JSON.parse(text);
    } catch (e) {
      return { ok: false, msg: "文件内容不是有效的 JSON，可能选错了文件，或者文件被改坏了。" };
    }
    if (!w || w._app !== "背单词") {
      return { ok: false, msg: "这不是背单词导出的进度文件。" };
    }
    if (typeof w._schema === "number" && w._schema > 1) {
      return { ok: false, msg: "这个文件来自更新版本的游戏，当前版本读不了。" };
    }
    if (!w.payload || !Array.isArray(w.payload.users)) {
      return { ok: false, msg: "文件结构不完整，可能导出时出错了。" };
    }
    return {
      ok: true,
      users: w.payload.users.length,
      exportedAt: w._exportedAt || "",
    };
  }

  /* ------------------------------------------------------------
     启动入口
     ------------------------------------------------------------ */

  function start() {
    viewEl = document.getElementById("view");
    barEl = document.getElementById("bar");

    barEl.addEventListener("click", function (e) {
      var b = e.target.closest("[data-bar]");
      if (!b) return;
      var a = b.getAttribute("data-bar");
      if (a === "back") {
        // 返回逻辑不走历史栈，按视图层级手动指定
        if (cur.name === "settings") go("home");
        else if (cur.name === "pack") goBackFromPack(cur.params.packId);
        else if (cur.name === "level") go("home");
        // 四种玩法和结算页都回到所属词包。
        // 结算页的 packId 是玩法传进来的，所以能用同一条规则。
        else if (PLAY_VIEWS.indexOf(cur.name) >= 0 || cur.name === "result") {
          go("pack", { packId: cur.params.packId });
        } else go("home");
      } else if (a === "who") {
        go("pick-user");
      } else if (a === "settings") {
        go("settings");
      }
    });

    // 多人共用：≥2 人时先选人，避免把同事的答题记到自己头上
    if (S.users().length >= 2) go("pick-user");
    else go("home");
  }

  // 四种玩法的视图名。顶栏返回、结算页都要用它判断「该回哪个词包」。
  var PLAY_VIEWS = ["match", "match-result", "fill", "cross", "scene"];

  function goBackFromPack(packId) {
    var p = App.data.getPack(packId);
    if (p && App.data.packsOf(p.level).length > 1) go("level", { lv: p.level });
    else go("home");
  }

  // 顶栏标题。函数形式的会在切换时用当前参数求值。
  setTitles({
    home: "背单词",
    "pick-user": "选择使用者",
    level: function (p) {
      var lv = App.data.levelOf(p.lv);
      return lv ? lv.name : "选词包";
    },
    pack: function (p) {
      var pk = App.data.getPack(p.packId);
      return pk ? pk.name : "词包";
    },
    settings: "设置",
    // 玩法页的标题写死玩法名就够了，不用再带上包名 ——
    // 顶栏还要放使用者标签和设置按钮，太长会挤
    match: "英中匹配",
    "match-result": "本局结果",
    fill: "单词填空",
    cross: "英文填字",
    scene: "场景选词",
    result: "本局结果",
  });

  App.ui = {
    start: start,
    go: go,
    render: render,
    register: register,
    setTitles: setTitles,
    toast: toast,
    dialog: dialog,
    esc: esc,
    current: function () {
      return cur;
    },
  };
})();


/* ===== 35-shared.js ===== */
/* ============================================================
   35-shared.js —— 三种玩法共用的两件东西
   ------------------------------------------------------------
   1. 自建字母键盘（单词填空、英文填字都要用）
   2. 通用结算页（避免每种玩法各写一份几乎一样的结算代码）

   为什么单独一个文件：
     它要用 App.ui.register / App.ui.esc，所以必须排在 30-ui.js 之后；
     又要被 40/50/60/70 各玩法用到，所以排在它们之前。
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});
  var esc = function (s) {
    return App.ui.esc(s);
  };

  /* ============================================================
     一、字母键盘
     ------------------------------------------------------------
     为什么不用系统键盘：
       系统键盘会弹出、会挡住半个屏幕、会带输入法和联想词，
       还会让 iOS 的「表单辅助栏」跳出来。背单词这种要连续输
       十几个词的场景，键盘一上一下非常难受。自建键盘固定在
       页面底部，页面不用滚动，视线不用来回跳。

     为什么布局是 QWERTY：
       用户在电脑/手机上已经形成肌肉记忆，换成 ABCDE 顺序反而
       找不到字母。iPad 横屏宽度足够放 10 个键一行。

     按键尺寸：iPad 横屏 1080px 宽，10 个键 + 间距，每键约
     92px 宽、52px 高，远超 44pt 的最小热区要求。
     ============================================================ */

  // 三行布局。每行的键数不同是仿照真实键盘的错位感，
  // 也让每行的键宽接近，手指不用横向大幅移动。
  var ROWS = [
    "QWERTYUIOP".split(""),
    "ASDFGHJKL".split(""),
    ["back"].concat("ZXCVBNM".split(""), ["dash", "space"]),
  ];

  var KEY_LABEL = { back: "⌫", dash: "-", space: "空格" };

  /**
   * 生成键盘 HTML。
   * @param {object} opt
   *   opt.hideSpace  不显示空格键（填字游戏用不到，因为只填纯单词）
   *   opt.submit     是否显示「确定」键（填空用自动判定，填字也不用）
   */
  function renderKeys(opt) {
    opt = opt || {};
    var html = '<div class="kb">';
    ROWS.forEach(function (row) {
      html += '<div class="krow">';
      row.forEach(function (k) {
        if (k === "space" && opt.hideSpace) return;
        var cls = "key" + (k.length > 1 ? " key-fn" : "");
        if (k === "space") cls += " key-space";
        html +=
          '<div class="' +
          cls +
          '" role="button" data-k="' +
          esc(k) +
          '">' +
          esc(KEY_LABEL[k] || k) +
          "</div>";
      });
      html += "</div>";
    });
    return html + "</div>";
  }

  /**
   * 绑定键盘事件。
   * @param {Element} root      容器（事件委托挂在这里）
   * @param {object}  h         回调 { onChar, onBack, onSpace, onDash }
   *
   * 用事件委托而不是给每个键单独绑：
   *   键盘每次重新渲染都会重建 DOM，逐个绑会产生几十个闭包；
   *   委托只需一个监听器，重建时旧节点连监听一起回收。
   */
  function bindKeys(root, h) {
    root.addEventListener("click", function (e) {
      var el = e.target.closest("[data-k]");
      if (!el) return;
      var k = el.getAttribute("data-k");
      if (k === "back") {
        if (h.onBack) h.onBack();
      } else if (k === "space") {
        if (h.onSpace) h.onSpace();
      } else if (k === "dash") {
        if (h.onDash) h.onDash();
      } else {
        if (h.onChar) h.onChar(k.toLowerCase());
      }
    });
  }

  /* ============================================================
     二、通用结算页
     ------------------------------------------------------------
     四种玩法的结算页结构完全一样：一个大数字 + 三个小格子 +
     错词回顾 + 两个按钮。与其复制四遍，不如统一成一个视图，
     各玩法只负责算好数字传进来。
     ============================================================ */

  App.ui.register("result", {
    render: function (p) {
      var rows = (p.rows || [])
        .map(function (r) {
          return '<div class="r-cell"><b>' + esc(r.v) + "</b><span>" + esc(r.l) + "</span></div>";
        })
        .join("");

      // 错词回顾。答错的词列出来，是这一局唯一值得带走的东西 ——
      // 答对的词不需要再看，答错的词不回顾等于白错。
      var wrong = "";
      var list = p.wrong || [];
      if (list.length) {
        wrong =
          '<div class="review"><div class="section-title">这几个再看看</div>' +
          list
            .map(function (it) {
              return (
                '<div class="review-item"><div class="rw-en">' +
                esc(it.w) +
                '</div><div class="rw-zh">' +
                esc(it.z || "") +
                "</div></div>"
              );
            })
            .join("") +
          "</div>";
      }

      return (
        '<div class="card result">' +
        '<div class="r-big">' +
        esc(p.big) +
        "</div>" +
        '<div class="r-label">' +
        esc(p.bigLabel || "") +
        "</div>" +
        '<div class="r-rows">' +
        rows +
        "</div>" +
        (p.note ? '<div class="hint" style="margin-top:10px">' + esc(p.note) + "</div>" : "") +
        "</div>" +
        wrong +
        '<div class="actions">' +
        '<button class="btn primary block" data-act="again">' +
        esc(p.againLabel || "再来一局") +
        "</button>" +
        '<button class="btn block" data-act="back-pack">返回词包</button>' +
        "</div>"
      );
    },

    mount: function (el, p) {
      el.addEventListener("click", function (e) {
        var b = e.target.closest("[data-act]");
        if (!b) return;
        var a = b.getAttribute("data-act");
        if (a === "again") {
          // 重新进入玩法视图。玩法内部靠 finished 标记判断要不要重开一局，
          // 所以这里只是把视图切回去。
          App.ui.go(p.again.name, p.again.params);
        } else if (a === "back-pack") {
          App.ui.go("pack", { packId: p.packId });
        }
      });
    },
  });

  /**
   * 各玩法调用它进结算页。
   * @param {object} p  { big, bigLabel, rows, wrong, note, again:{name,params}, packId }
   */
  function showResult(p) {
    App.ui.go("result", p);
  }

  /* ============================================================
     三、两处小工具
     ============================================================ */

  /**
   * 字符串哈希 → 确定性伪随机。
   *
   * 用在挖空位置上：同一个词每次挖掉的字母位置必须一样。
   * 如果每次随机，用户第二次遇到同一个词会发现「上次是 ap_ple，
   * 这次变成 a_ple」，以为是 bug。固定下来才有熟悉感。
   *
   * 用 LCG（线性同余）而不是 Math.random，因为要可复现。
   */
  function seededRand(seed) {
    var s = seed >>> 0 || 1;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h >>> 0;
  }

  App.keys = { render: renderKeys, bind: bindKeys };
  App.result = { show: showResult };
  App.util = { seededRand: seededRand, hashStr: hashStr };
})();


/* ===== 40-match.js ===== */
/* ============================================================
   40-match.js —— 英中匹配（玩法一：练再认）
   ------------------------------------------------------------
   规则：
     · 一局 6 对，左列英文、右列中文，两列各自独立打乱
     · 点一个英文 + 一个中文即判定
     · 配对正确：两格变绿锁定，该词熟练度 +1
     · 配对错误：两格抖动 + 红边，锁 0.6 秒，连击清零，
                 涉及的两个词熟练度归零并进错词本
     · 没有倒计时。练的是记忆不是手速。
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});
  var S = App.store;

  var PAIRS = 6; // 一局几对。iPad 横屏 6 对一屏放得下；手机竖屏也够。

  /* ------------------------------------------------------------
     局面状态
     ------------------------------------------------------------
     这些变量在 begin() 里重建。放在闭包里而不是挂在 DOM 上，
     是因为 mount/unmount 可能被调用多次（切视图再回来），
     状态必须干净重来，不能残留上一局。
     ------------------------------------------------------------ */
  var st = null;
  var timer = null; // 配错后复位用的定时器，unmount 时必须清掉
  var finishTimer = null; // 全部配对后切结算页的定时器

  function begin(packId) {
    var pack = App.data.getPack(packId);
    if (!pack) return null;

    var items = App.data.pickSession(pack, PAIRS);

    st = {
      packId: packId,
      packName: pack.name,
      items: items, // 这一局的 6 个词条（原始顺序）
      en: App.data.shuffle(items.slice()), // 左列顺序
      zh: App.data.shuffle(items.slice()), // 右列顺序（独立打乱，否则位置一一对应）
      selEn: -1,
      selZh: -1,
      doneEn: {}, // 已配对完成的左列下标
      doneZh: {},
      matched: 0,
      miss: 0, // 配错次数
      streak: 0,
      bestStreak: 0,
      wrongWords: {}, // 本局出错的词（结算页回顾用）
      locked: false,
      finished: false, // 打完标记：从结算页返回后再进，必须重新组题
      t0: Date.now(),
    };
    return st;
  }

  function elapsed() {
    return st ? Math.round((Date.now() - st.t0) / 1000) : 0;
  }

  /* ------------------------------------------------------------
     渲染
     ------------------------------------------------------------ */

  function renderTiles() {
    var enHtml = st.en
      .map(function (it, i) {
        return (
          '<button class="tile en" data-side="en" data-i="' +
          i +
          '">' +
          App.ui.esc(it.w) +
          "</button>"
        );
      })
      .join("");

    var zhHtml = st.zh
      .map(function (it, i) {
        return (
          '<button class="tile zh" data-side="zh" data-i="' +
          i +
          '">' +
          App.ui.esc(it.z) +
          "</button>"
        );
      })
      .join("");

    return (
      '<div class="match-head">' +
      '<span class="progress" id="m-progress">已配对 ' +
      st.matched +
      " / " +
      st.items.length +
      "</span>" +
      '<span id="m-streak">' +
      (st.streak > 1 ? "连击 " + st.streak : "") +
      "</span>" +
      "</div>" +
      '<div class="match-grid" id="m-grid">' +
      '<div class="match-col" data-col="en">' +
      enHtml +
      "</div>" +
      '<div class="match-col" data-col="zh">' +
      zhHtml +
      "</div>" +
      "</div>" +
      '<div class="hint" style="text-align:center;margin-top:16px">' +
      "点一个英文，再点它对应的中文" +
      "</div>"
    );
  }

  function paint() {
    var grid = document.getElementById("m-grid");
    if (!grid) return;

    // 选中态
    var sels = grid.querySelectorAll(".tile.sel");
    for (var i = 0; i < sels.length; i++) sels[i].classList.remove("sel");

    if (st.selEn >= 0) {
      var e1 = grid.querySelector('[data-side="en"][data-i="' + st.selEn + '"]');
      if (e1) e1.classList.add("sel");
    }
    if (st.selZh >= 0) {
      var z1 = grid.querySelector('[data-side="zh"][data-i="' + st.selZh + '"]');
      if (z1) z1.classList.add("sel");
    }
  }

  function updateHead() {
    var p = document.getElementById("m-progress");
    if (p) p.textContent = "已配对 " + st.matched + " / " + st.items.length;
    var s = document.getElementById("m-streak");
    if (s) s.textContent = st.streak > 1 ? "连击 " + st.streak : "";
  }

  function tile(side, i) {
    var grid = document.getElementById("m-grid");
    return grid ? grid.querySelector('[data-side="' + side + '"][data-i="' + i + '"]') : null;
  }

  /* ------------------------------------------------------------
     判定
     ------------------------------------------------------------ */

  function onPick(side, i) {
    if (!st || st.locked) return;

    var isDone = side === "en" ? st.doneEn[i] : st.doneZh[i];
    if (isDone) return; // 已配对成功的格子点不动

    var key = side === "en" ? "selEn" : "selZh";

    // 再点一次已选中的格子 = 取消选择
    if (st[key] === i) {
      st[key] = -1;
      paint();
      return;
    }

    st[key] = i;
    paint();

    if (st.selEn >= 0 && st.selZh >= 0) judge();
  }

  function judge() {
    var eItem = st.en[st.selEn];
    var zItem = st.zh[st.selZh];
    var eIdx = st.selEn;
    var zIdx = st.selZh;
    var ok = eItem.w === zItem.w;

    if (ok) {
      st.doneEn[eIdx] = 1;
      st.doneZh[zIdx] = 1;
      st.matched++;
      st.streak++;
      if (st.streak > st.bestStreak) st.bestStreak = st.streak;

      var te = tile("en", eIdx);
      var tz = tile("zh", zIdx);
      if (te) {
        te.classList.remove("sel");
        te.classList.add("done");
      }
      if (tz) {
        tz.classList.remove("sel");
        tz.classList.add("done");
      }

      // 记一次正确。匹配是「再认」，权重 1（填空/填字是回忆，权重 2）
      S.recordAnswer(eItem.w, true, 1);

      st.selEn = -1;
      st.selZh = -1;
      updateHead();

      if (st.matched >= st.items.length) {
        finish();
      }
      return;
    }

    // ---- 配错 ----
    st.miss++;
    st.streak = 0;
    st.locked = true;

    // 两个词都算错：英文卡说明「没认出这个英文」，
    // 中文卡说明「以为这个中文是这个英文的意思」，是双向混淆。
    // 套 batch 是为了两次记账只写一次盘。
    S.batch(function () {
      S.recordAnswer(eItem.w, false, 1);
      S.recordAnswer(zItem.w, false, 1);
    });
    st.wrongWords[eItem.w] = eItem;
    st.wrongWords[zItem.w] = zItem;

    var a = tile("en", eIdx);
    var b = tile("zh", zIdx);
    if (a) {
      a.classList.remove("sel");
      a.classList.add("bad");
    }
    if (b) {
      b.classList.remove("sel");
      b.classList.add("bad");
    }

    updateHead();

    // 锁 0.6 秒。时间要够看清两边分别是什么词 —— 这是纠错机会，
    // 一闪而过等于没纠正。
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      if (a) a.classList.remove("bad");
      if (b) b.classList.remove("bad");
      st.selEn = -1;
      st.selZh = -1;
      st.locked = false;
    }, 600);
  }

  function finish() {
    var packId = st.packId;
    var payload = {
      packId: packId,
      total: st.items.length,
      miss: st.miss,
      best: st.bestStreak,
      sec: elapsed(),
      wrong: Object.keys(st.wrongWords).map(function (k) {
        return st.wrongWords[k];
      }),
    };
    st.finished = true; // 标记这一局已结束，下次进来会重新组题

    // 交给结算视图。不用 setTimeout 立刻切，最后一格的绿色动画靠 CSS 自己跑完，
    // 立刻切换会让用户看不到「全绿」这个正反馈，所以给 380ms。
    finishTimer = setTimeout(function () {
      finishTimer = null;
      App.ui.go("match-result", payload);
    }, 380);
  }

  /* ------------------------------------------------------------
     注册视图
     ------------------------------------------------------------ */

  App.ui.register("match", {
    render: function (p) {
      // 三种情况要重新组题：还没有局面 / 换了词包 / 上一局已经打完
      if (!st || st.packId !== p.packId || st.finished) {
        if (!begin(p.packId)) return '<div class="empty">词包不存在</div>';
      }
      return renderTiles();
    },
    mount: function (el) {
      el.addEventListener("click", function (e) {
        var t = e.target.closest(".tile");
        if (!t) return;
        onPick(t.getAttribute("data-side"), parseInt(t.getAttribute("data-i"), 10));
      });
    },
    unmount: function () {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      if (finishTimer) {
        clearTimeout(finishTimer);
        finishTimer = null;
      }
    },
  });

  /* ------------------------------------------------------------
     结算页
     ------------------------------------------------------------ */
  App.ui.register("match-result", {
    render: function (p) {
      // 正确率按「配对次数」算：配对成功 total 次，配错 miss 次
      var tries = p.total + p.miss;
      var acc = tries > 0 ? Math.round((p.total / tries) * 100) : 0;

      var rows =
        '<div class="r-rows">' +
        '<div class="r-cell"><b>' +
        p.total +
        "</b><span>配对成功</span></div>" +
        '<div class="r-cell"><b>' +
        p.miss +
        "</b><span>配错次数</span></div>" +
        '<div class="r-cell"><b>' +
        p.sec +
        "</b><span>用时（秒）</span></div>" +
        "</div>";

      var review = "";
      if (p.wrong && p.wrong.length) {
        review =
          '<div class="review"><div class="section-title" style="margin:0 0 8px">这一局没认出来的</div>' +
          p.wrong
            .map(function (it) {
              return (
                '<div class="review-item"><span class="rw">' +
                App.ui.esc(it.w) +
                '</span><span class="rz">' +
                App.ui.esc(it.z) +
                "</span></div>"
              );
            })
            .join("") +
          '<div class="hint">这些词的熟练度已归零，下一局会优先出现。</div></div>';
      } else {
        review = '<div class="hint" style="text-align:center">这一局全部一次配对成功。</div>';
      }

      return (
        '<div class="card result">' +
        '<div class="r-big">' +
        acc +
        "%</div>" +
        '<div class="r-label">本局正确率</div>' +
        rows +
        review +
        '<div class="actions">' +
        '<button class="btn" data-r="back">返回</button>' +
        '<button class="btn primary" data-r="again">再来一局</button>' +
        "</div></div>" +
        (p.best > 1
          ? '<div class="hint" style="text-align:center;margin-top:14px">最高连击 ' + p.best + "</div>"
          : "")
      );
    },
    mount: function (el, p) {
      el.addEventListener("click", function (e) {
        var b = e.target.closest("[data-r]");
        if (!b) return;
        if (b.getAttribute("data-r") === "again") {
          // 强制重开：清掉旧局面，让 render 重新组题
          st = null;
          App.ui.go("match", { packId: p.packId });
        } else {
          App.ui.go("pack", { packId: p.packId });
        }
      });
    },
  });

  App.ui.setTitles({ match: "英中匹配", "match-result": "本局结果" });
})();


/* ===== 50-fill.js ===== */
/* ============================================================
   50-fill.js —— 单词填空
   ------------------------------------------------------------
   一句话：看到中文释义，把挖掉字母的英文补完整。

   和「英中匹配」的区别：
     匹配是「再认」——给你选项，认出来就行；
     填空是「回忆」——没有任何提示，得自己从脑子里把拼写掏出来。
     难度上差一个档次，所以熟练度权重是 2（匹配是 1）。

   挖空按等级递进（这是设计里定死的）：
     L1 挖元音     —— 留下辅音骨架，靠读音就能拼出来
     L2 挖 30~40%  —— 要真记住拼写
     L3 给首字母   —— 最难，几乎全靠回忆
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});
  var S = App.store;
  var esc = function (s) {
    return App.ui.esc(s);
  };

  var COUNT = 8; // 一局几题

  // L3 保留字母的比例。
  // 设计原文是「只给首字母」，但 L3 里有 notwithstanding、reconciliation
  // 这种 14~15 字母的词，只给一个首字母 + 中文，几乎不可能拼出来，
  // 一局 8 题全军覆没只会让人放弃。这里放宽到「首字母必留 + 再留 20%」，
  // 仍然是最难的一档，但做得下去。想更狠就把这个数调成 0。
  var L3_KEEP_RATIO = 0.2;

  var st = null;
  var timer = null; // 答对后切下一题的延时，unmount 必须清掉
  var shakeTimer = null; // 答错抖动的复位定时器

  /* ------------------------------------------------------------
     一、挖哪些字母
     ------------------------------------------------------------
     @returns { hide:{idx:1}, slots:[idx] }
       hide   需要用户填的位置（对象当集合用）
       slots  这些位置按下标升序排好，输入时按顺序走

     关键：位置由英文原词哈希决定，不是每次随机。
       同一个词第二次遇到，挖空位置必须一样，否则用户会以为
       上次记错了。见 35-shared.js 的 seededRand。
     ------------------------------------------------------------ */
  function makeMask(item, level) {
    var w = item.w;
    var ch = w.split("");

    // 空格、连字符这类分隔符永远显示出来，不参与挖空 ——
    // 挖掉一个空格只会让人猜不出这是几个词，不是考拼写
    var alphaIdx = [];
    for (var i = 0; i < ch.length; i++) {
      if (/[a-zA-Z]/.test(ch[i])) alphaIdx.push(i);
    }

    var hide = {};
    var rnd = App.util.seededRand(App.util.hashStr(w.toLowerCase()));

    if (level === "L1") {
      // 挖元音：留下 ppl 这种骨架，读一遍就能拼
      alphaIdx.forEach(function (i) {
        if ("aeiou".indexOf(ch[i].toLowerCase()) >= 0) hide[i] = 1;
      });
      // 保底：至少留 2 个字母，否则 _e_e_ 这种没法下手
      var shown = alphaIdx.filter(function (i) {
        return !hide[i];
      });
      if (shown.length < 2) {
        var pool = alphaIdx.filter(function (i) {
          return hide[i];
        });
        var need = Math.min(2 - shown.length, pool.length);
        for (var k = 0; k < need; k++) {
          var j = Math.floor(rnd() * pool.length);
          delete hide[pool[j]];
          pool.splice(j, 1);
        }
      }
    } else if (level === "L3") {
      // 全挖，然后留首字母 + 额外若干个
      alphaIdx.forEach(function (i) {
        hide[i] = 1;
      });
      delete hide[alphaIdx[0]];
      var extra = Math.max(0, Math.round(alphaIdx.length * L3_KEEP_RATIO) - 1);
      var rest = alphaIdx.slice(1);
      for (var m = 0; m < extra && rest.length; m++) {
        var jj = Math.floor(rnd() * rest.length);
        delete hide[rest[jj]];
        rest.splice(jj, 1);
      }
    } else {
      // L2：挖 30~40%
      var ratio = 0.3 + rnd() * 0.1;
      var target = Math.max(1, Math.round(alphaIdx.length * ratio));
      var bag = alphaIdx.slice();
      for (var a = bag.length - 1; a > 0; a--) {
        var b = Math.floor(rnd() * (a + 1));
        var t = bag[a];
        bag[a] = bag[b];
        bag[b] = t;
      }
      bag.slice(0, target).forEach(function (i) {
        hide[i] = 1;
      });
    }

    var slots = alphaIdx.filter(function (i) {
      return hide[i];
    });
    slots.sort(function (x, y) {
      return x - y;
    });
    return { hide: hide, slots: slots };
  }

  /* ------------------------------------------------------------
     二、开局
     ------------------------------------------------------------ */
  function begin(packId) {
    var pack = App.data.getPack(packId);
    if (!pack) return null;

    var items = App.data.pickSession(pack, COUNT);
    if (!items.length) return null;

    st = {
      packId: packId,
      packName: pack.name,
      level: pack.level,
      items: items,
      idx: 0,
      right: 0,
      miss: 0,
      wrongList: {}, // 用对象去重：同一个词错两次只回顾一次
      t0: Date.now(),
      finished: false,
      q: null, // 当前题目
    };
    nextQuestion();
    return st;
  }

  /** 装填第 idx 题。 */
  function nextQuestion() {
    var item = st.items[st.idx];
    var mk = makeMask(item, st.level);
    st.q = {
      item: item,
      hide: mk.hide,
      slots: mk.slots, // 需要填的位置（升序）
      vals: [], // 与 slots 一一对应的用户输入
      cursor: 0, // 当前填到第几个 slot
      phase: "input", // input | redo
      shake: false,
      ok: false,
    };
  }

  /* ------------------------------------------------------------
     三、输入
     ------------------------------------------------------------ */
  function currentWord() {
    // 把用户填的内容拼回完整单词，用来比对
    var q = st.q;
    var ch = q.item.w.split("");
    for (var i = 0; i < q.slots.length; i++) {
      ch[q.slots[i]] = q.vals[i] || "";
    }
    return ch.join("");
  }

  function putChar(c) {
    var q = st.q;
    if (!q || q.cursor >= q.slots.length) return;
    q.vals[q.cursor] = c;
    // 按位置顺序往前走，不跳着填 —— 跳着填用户会搞不清填到哪了
    q.cursor++;
    // 填满了才判定。没填满只重画，让光标往前挪
    if (q.cursor >= q.slots.length) check();
    else render();
  }

  function back() {
    var q = st.q;
    if (!q || q.cursor <= 0) return;
    q.cursor--;
    q.vals[q.cursor] = "";
    render();
  }

  /* ------------------------------------------------------------
     四、判定
     ------------------------------------------------------------
     两条规则：
     1. 答错必须把正确拼写重打一遍。只「看到」正确答案没有记忆
        效果，手指打一遍才有用。所以进入 redo 阶段，答案摆在
        上面照着打，打对才放行。
     2. 第一次答错就已经记了一次错（熟练度归零、进错词本）。
        redo 阶段打对不再加分 —— 否则「错一次 + 补打一遍」的
        收益和一次答对一样，规则就失去意义了。
     ------------------------------------------------------------ */
  function check() {
    var q = st.q;
    var w = q.item.w;

    if (currentWord().toLowerCase() === w.toLowerCase()) {
      if (q.phase === "input") {
        // 第一次就打对
        S.recordAnswer(w, true, 2);
        st.right++;
      }
      // redo 阶段打对：不加分，只放行
      q.ok = true;
      render(); // 先把整词变绿，让人看见「我拼对了」
      // 立刻切下一题的话，绿色一闪而过等于没给正反馈
      timer = setTimeout(function () {
        timer = null;
        advance();
      }, 340);
      return;
    }

    // 打错了
    if (q.phase === "input") {
      S.recordAnswer(w, false, 2); // 归零 + 进错词本
      st.miss++;
      st.wrongList[w] = q.item;
      q.phase = "redo";
    }
    // 重来：清空输入，答案摆在上方照着打
    q.vals = [];
    q.cursor = 0;
    q.shake = true;
    render();
    shakeTimer = setTimeout(function () {
      shakeTimer = null;
      if (st && st.q === q) {
        q.shake = false;
        render();
      }
    }, 400);
  }

  /** 过一题：最后一题则进结算。 */
  function advance() {
    st.idx++;
    if (st.idx >= st.items.length) {
      finish();
      return;
    }
    nextQuestion();
    render();
  }

  function finish() {
    var sec = Math.round((Date.now() - st.t0) / 1000);
    var tries = st.right + st.miss;
    var acc = tries > 0 ? Math.round((st.right / tries) * 100) : 0;
    var wrong = Object.keys(st.wrongList).map(function (k) {
      return st.wrongList[k];
    });

    st.finished = true;

    App.result.show({
      big: acc + "%",
      bigLabel: "本局正确率",
      rows: [
        { v: st.right, l: "一次答对" },
        { v: st.miss, l: "需要补打" },
        { v: sec, l: "用时（秒）" },
      ],
      wrong: wrong,
      note: st.miss ? "答错的词已经退回最不熟，明天还会再见到它们。" : "全对。这几个词明天还会再考一次。",
      again: { name: "fill", params: { packId: st.packId } },
      packId: st.packId,
    });
  }

  /* ------------------------------------------------------------
     五、渲染
     ------------------------------------------------------------ */
  function render() {
    // 直接重画整个 view-inner：填空的 DOM 很小（8 个格子 + 30 个键），
    // 重画比逐个改 className 简单，也不会漏状态
    App.ui.render();
  }

  function slotsHtml() {
    var q = st.q;
    var w = q.item.w;
    var ch = w.split("");
    var html = "";
    var si = 0; // 第几个 slot

    for (var i = 0; i < ch.length; i++) {
      var c = ch[i];
      if (!/[a-zA-Z]/.test(c)) {
        // 空格、连字符：直接显示，当成词与词之间的分隔
        html += '<span class="slot-sep">' + (c === " " ? "&nbsp;" : esc(c)) + "</span>";
        continue;
      }
      if (q.hide[i]) {
        var v = q.vals[si] || "";
        var cls = "slot";
        if (si === q.cursor) cls += " on";
        if (q.ok) cls += " good";
        html +=
          '<span class="' +
          cls +
          '" data-slot="' +
          si +
          '">' +
          (v ? esc(v) : "") +
          "</span>";
        si++;
      } else {
        html += '<span class="slot given">' + esc(c) + "</span>";
      }
    }
    return '<div class="slots' + (q.shake ? " shake" : "") + '">' + html + "</div>";
  }

  function view() {
    var q = st.q;
    var it = q.item;

    // 例句/场景：L3 有挖空句，L2 有文档原句，L1 没有
    var ex = "";
    if (it.e) {
      ex = '<div class="q-ex">' + esc(it.e) + "</div>";
      if (it.ez) ex += '<div class="q-ex-zh">' + esc(it.ez) + "</div>";
    }

    var tip = "";
    if (q.phase === "redo") {
      tip =
        '<div class="redo-box"><div class="redo-word">' +
        esc(it.w) +
        '</div><div class="hint">照着打一遍，打完自动继续</div></div>';
    }

    return (
      '<div class="q-head">' +
      '<span class="q-idx">' +
      (st.idx + 1) +
      " / " +
      st.items.length +
      "</span>" +
      '<div class="q-zh">' +
      esc(it.z) +
      "</div>" +
      (it.p ? '<div class="q-pos">' + esc(it.p) + "</div>" : "") +
      "</div>" +
      '<div class="card q-card">' +
      slotsHtml() +
      tip +
      ex +
      "</div>" +
      App.keys.render({})
    );
  }

  /* ------------------------------------------------------------
     六、注册视图
     ------------------------------------------------------------ */
  App.ui.register("fill", {
    render: function (p) {
      if (!st || st.packId !== p.packId || st.finished) {
        if (!begin(p.packId)) return '<div class="empty">这个词包暂时没法出题</div>';
      }
      return view();
    },

    mount: function (el) {
      // 键盘事件
      App.keys.bind(el, {
        onChar: function (c) {
          putChar(c);
        },
        onBack: back,
        onSpace: function () {
          putChar(" ");
        },
        onDash: function () {
          putChar("-");
        },
      });

      // 点格子：把光标挪过去（iPad 上手指点比按退格快）
      el.addEventListener("click", function (e) {
        var s = e.target.closest("[data-slot]");
        if (!s) return;
        var i = parseInt(s.getAttribute("data-slot"), 10);
        if (!isNaN(i)) {
          st.q.cursor = i;
          render();
        }
      });
    },

    unmount: function () {
      // 两个定时器都要清：不清的话，离开这屏之后计时器还会触发
      // advance()，把一个已经不存在的局面推进到下一题
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      if (shakeTimer) {
        clearTimeout(shakeTimer);
        shakeTimer = null;
      }
    },
  });
})();


/* ===== 60-cross.js ===== */
/* ============================================================
   60-cross.js —— 英文填字
   ------------------------------------------------------------
   一句话：横竖交叉填词，练精确拼写。

   和「单词填空」的区别：
     填空只考一个词的拼写；
     填字同时考拼写和「交叉字母要对得上」——横着的第 3 个字母
     就是竖着的第 2 个字母，两边拼错一个都会露馅。

   为什么只吃纯单词（t === 'word'）：
     词组带空格，缩写带点号，塞进网格里要么放不下要么没法读。
     L2 的 30 条短语、以及缩写类词条全部排除。
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});
  var S = App.store;
  var esc = function (s) {
    return App.ui.esc(s);
  };

  // 网格与出题参数
  var WANT = 10; // 目标词数
  var MIN_OK = 5; // 少于这个数就降级重来
  var MIN_ANY = 3; // 少于这个数就放弃，说明这个词包不适合填字
  var STEP_LIMIT = 5000; // 步数硬上限，防止 iPad 上卡死
  var LEN_MAX = 9;
  var SIZE_MIN = 9;
  var SIZE_MAX = 11;

  var st = null;

  /* ============================================================
     一、生成网格
     ------------------------------------------------------------
     算法：贪心 + 有限回溯。

     1. 最长的一个词横放在正中
     2. 之后每个词：遍历所有已放置词的每个字母，找当前词里
        有没有相同的字母；有就算出一个候选起点，随机顺序试放
     3. 放不下就跳过这个词，继续下一个
     4. 总步数超过 5000 立刻停

     为什么不用「完整回溯求最优解」：
       完整回溯对 10 个词 11×11 的规模，最坏情况要试几百万次，
       iPad 2019 的 A10 会明显卡顿甚至卡死。贪心已经能生成
       可玩的网格，代价只是偶尔交叉点少一点，不值得换性能。

     整个过程只操作两个一维数组，一次都不碰 DOM ——
     生成完了才渲染，这样最坏情况也只是多等几十毫秒。
     ============================================================ */

  /**
   * 判断一个词能不能放在 (r,c)，方向 dir。
   * @returns {number} -1 放不下，否则返回交叉点个数（>=1 才算有效）
   *
   * 规则（标准填字规则，任意一条不满足都会产生难看的网格）：
   *   a. 不能越界
   *   b. 已有字母必须相同
   *   c. 不能和同方向的词重叠（会连成一个长串）
   *   d. 空格子的两侧（垂直方向）必须为空，否则会出现两个贴着的平行词
   *   e. 词首前一格、词尾后一格必须为空，否则会和别的词首尾相接
   *
   * 注意这里【不能】加「空格子沿词方向的前后也必须为空」这条：
   *   交叉点的前一格（沿新词方向）本来就是空的，但它的后一格就是
   *   交叉点本身（非空），加了这条会导致每一个交叉都被判失败，
   *   最后网格里只剩第一个词。第一版就是这么写错的，实测 0 个词
   *   放得进去。同方向首尾相接由规则 e 拦住，够了。
   */
  function canPlace(g, word, r, c, dir) {
    var n = g.size;
    var dr = dir ? 1 : 0;
    var dc = dir ? 0 : 1;
    var L = word.length;

    if (r < 0 || c < 0) return -1;
    if (dir === 0 && c + L > n) return -1;
    if (dir === 1 && r + L > n) return -1;

    var cross = 0;
    for (var i = 0; i < L; i++) {
      var rr = r + dr * i;
      var cc = c + dc * i;
      var p = rr * n + cc;
      var cur = g.cell[p];

      if (cur !== null) {
        if (cur !== word[i]) return -1; // b
        if (g.dirAt[p] === dir) return -1; // c
        cross++;
        continue;
      }

      // d：垂直方向两侧必须为空
      var vr = dir ? 0 : 1;
      var vc = dir ? 1 : 0;
      var ar = rr - vr,
        ac = cc - vc;
      var br = rr + vr,
        bc = cc + vc;
      if (ar >= 0 && ac >= 0 && ar < n && ac < n && g.cell[ar * n + ac] !== null) return -1;
      if (br >= 0 && bc >= 0 && br < n && bc < n && g.cell[br * n + bc] !== null) return -1;
    }

    // e：首尾外侧
    var sr = r - dr,
      sc = c - dc;
    if (sr >= 0 && sc >= 0 && sr < n && sc < n && g.cell[sr * n + sc] !== null) return -1;
    var er = r + dr * L,
      ec = c + dc * L;
    if (er >= 0 && ec >= 0 && er < n && ec < n && g.cell[er * n + ec] !== null) return -1;

    return cross;
  }

  function put(g, item, r, c, dir) {
    var word = item.w.toUpperCase();
    var n = g.size;
    var dr = dir ? 1 : 0;
    var dc = dir ? 0 : 1;
    var cells = [];
    for (var i = 0; i < word.length; i++) {
      var p = (r + dr * i) * n + (c + dc * i);
      g.cell[p] = word[i];
      g.dirAt[p] = dir;
      cells.push(p);
    }
    g.words.push({ item: item, w: word, r: r, c: c, dir: dir, cells: cells, num: 0 });
  }

  /** 给每个词分配左上角编号（同一格起横竖两个词共用一个号）。 */
  function numberWords(g) {
    var starts = {};
    g.words.forEach(function (wd) {
      starts[wd.r * g.size + wd.c] = 1;
    });
    var keys = Object.keys(starts).map(Number);
    keys.sort(function (a, b) {
      var ra = Math.floor(a / g.size),
        ca = a % g.size;
      var rb = Math.floor(b / g.size),
        cb = b % g.size;
      return ra - rb || ca - cb;
    });
    var numOf = {};
    keys.forEach(function (p, i) {
      numOf[p] = i + 1;
    });
    g.words.forEach(function (wd) {
      wd.num = numOf[wd.r * g.size + wd.c];
    });
  }

  /**
   * 试一局生成。
   * @param {Array} items  候选词条（已按长度降序）
   * @param {number} size  网格边长
   * @returns {object|null} { size, words, cell, dirAt, steps }
   */
  function tryBuild(items, size) {
    var g = {
      size: size,
      cell: new Array(size * size),
      dirAt: new Array(size * size),
      words: [],
      steps: 0,
    };
    for (var i = 0; i < size * size; i++) {
      g.cell[i] = null;
      g.dirAt[i] = null;
    }

    if (!items.length) return null;

    // 第一个词：横放，居中
    var first = items[0];
    var r0 = Math.floor(size / 2);
    var c0 = Math.floor((size - first.w.length) / 2);
    put(g, first, r0, c0, 0);

    for (var k = 1; k < items.length; k++) {
      if (g.steps > STEP_LIMIT) break;
      placeOne(g, items[k]);
    }

    numberWords(g);
    return g;
  }

  /** 为单个词寻找一个能交叉的位置并放下。 */
  function placeOne(g, item) {
    var word = item.w.toUpperCase();
    var cands = [];

    // 遍历所有已放置词的每个字母 × 当前词的每个相同字母
    for (var a = 0; a < g.words.length; a++) {
      var pw = g.words[a];
      for (var i = 0; i < pw.w.length; i++) {
        for (var j = 0; j < word.length; j++) {
          if (pw.w[i] !== word[j]) continue;
          // 交叉：方向必须垂直
          var r, c, dir;
          if (pw.dir === 0) {
            dir = 1;
            r = pw.r - j;
            c = pw.c + i;
          } else {
            dir = 0;
            r = pw.r + i;
            c = pw.c - j;
          }
          cands.push([r, c, dir]);
        }
      }
    }

    // 随机顺序：每次生成的网格都不一样，重玩不会撞车
    App.data.shuffle(cands);

    for (var m = 0; m < cands.length; m++) {
      g.steps++;
      if (g.steps > STEP_LIMIT) return false;
      var cd = cands[m];
      // 第一个之后的词必须至少有一个交叉点，否则就是孤零零飘在网格里
      if (canPlace(g, word, cd[0], cd[1], cd[2]) >= 1) {
        put(g, item, cd[0], cd[1], cd[2]);
        return true;
      }
    }
    return false;
  }

  /* ------------------------------------------------------------
     选词
     ------------------------------------------------------------
     只收纯字母、长度 3~9 的单词。太长放不进 11×11，太短
     （2 字母）交叉点少、也没什么练的价值。
     按「越不熟越优先」排序后取前 n*3 作为候选池，再随机抽 n 个。
     ------------------------------------------------------------ */
  function pickWords(pack, n, maxLen) {
    var pool = pack.items.filter(function (it) {
      if (it.t && it.t !== "word") return false;
      return /^[a-zA-Z]{3,9}$/.test(it.w) && it.w.length <= maxLen;
    });
    if (!pool.length) return [];

    var scored = pool.map(function (it) {
      return { it: it, sc: App.data.priorityOf(it) };
    });
    scored.sort(function (a, b) {
      return b.sc - a.sc;
    });

    var cand = scored.slice(0, Math.min(scored.length, n * 3)).map(function (x) {
      return x.it;
    });
    App.data.shuffle(cand);

    // 取 n 个，长词排前面（长词先放，网格才撑得开）
    var take = cand.slice(0, n);
    take.sort(function (a, b) {
      return b.w.length - a.w.length;
    });
    return take;
  }

  /**
   * 生成一局。失败会逐级降级，最后返回 null。
   */
  function generate(pack) {
    var maxLen = LEN_MAX;
    var size = Math.max(SIZE_MIN, Math.min(SIZE_MAX, maxLen + 2));

    // 第一轮：10 词、长度 ≤9
    var items = pickWords(pack, WANT, LEN_MAX);
    var g = items.length ? tryBuild(items, size) : null;
    if (g && g.words.length >= MIN_OK) return g;

    // 第二轮：降到 8 词、长度 ≤7，网格小一点更好塞
    items = pickWords(pack, 8, 7);
    size = Math.max(SIZE_MIN, Math.min(SIZE_MAX, 7 + 2));
    g = items.length ? tryBuild(items, size) : null;
    if (g && g.words.length >= MIN_ANY) return g;

    // 第三轮：6 词、长度 ≤6
    items = pickWords(pack, 6, 6);
    g = items.length ? tryBuild(items, SIZE_MIN) : null;
    if (g && g.words.length >= MIN_ANY) return g;

    return null;
  }

  /* ============================================================
     二、局面状态
     ============================================================ */
  function begin(packId) {
    var pack = App.data.getPack(packId);
    if (!pack) return null;

    var g = generate(pack);
    if (!g) return null;

    // 每格属于哪些词：位置 -> [{wi, idx}]，最多两个（一横一竖）
    var owner = {};
    g.words.forEach(function (wd, wi) {
      wd.cells.forEach(function (p, idx) {
        (owner[p] = owner[p] || []).push({ wi: wi, idx: idx });
      });
    });

    st = {
      packId: packId,
      packName: pack.name,
      g: g,
      owner: owner,
      input: {}, // 位置 -> 用户填的字母
      locked: {}, // wi -> true，这个词已经判定通过
      solved: {}, // wi -> true，玩家主动看了答案
      sel: null, // { wi, idx } 当前光标
      miss: 0,
      right: 0,
      wrongList: {},
      t0: Date.now(),
      finished: false,
    };

    // 默认选中第一个未锁定的词
    selectWord(0);
    return st;
  }

  function selectWord(wi) {
    var wd = st.g.words[wi];
    if (!wd) return;
    /*
      光标固定落在这个词的【第一个字母】，不是「第一个空格子」。

      第一版写的是「第一个空格子」，看着贴心（跳过交叉处已经填好的字母），
      实际是个坑：交叉点的字母来自另一个词，它可能在词的中间。
      用户点一行之后是从记忆里敲【整个单词】的，
      光标却停在中间，敲进去的字母整体错位，这一行必然判错。

      改成从第一个字母开始：用户照着敲整个词，交叉处被覆盖成同一个字母，
      等于没变。这也是主流填字 App 的做法。

      例外是手动点某一格的时候（下面的 mount），那时光标就落在点的那一格，
      因为用户是在指定「我要改这个位置」。
    */
    st.sel = { wi: wi, idx: 0 };
  }

  /* ------------------------------------------------------------
     三、输入与判定
     ------------------------------------------------------------ */
  function putChar(c) {
    if (!st.sel) return;
    var wd = st.g.words[st.sel.wi];
    if (!wd || st.locked[st.sel.wi]) return;

    var p = wd.cells[st.sel.idx];
    st.input[p] = c.toUpperCase();

    // 光标前进到这个词的下一个格子
    if (st.sel.idx < wd.cells.length - 1) st.sel.idx++;

    checkWord(st.sel.wi);
    render();
    if (allDone()) finishSoon();
  }

  function back() {
    if (!st.sel) return;
    var wd = st.g.words[st.sel.wi];
    if (!wd || st.locked[st.sel.wi]) return;

    var p = wd.cells[st.sel.idx];
    if (st.input[p]) {
      delete st.input[p];
    } else if (st.sel.idx > 0) {
      st.sel.idx--;
      delete st.input[wd.cells[st.sel.idx]];
    }
    render();
  }

  /**
   * 一个词填满了就判定。
   * 对 → 绿色锁定 + 熟练度 +2
   * 错 → 红色边框 + 记一次错（归零），但不锁定，玩家可以继续改
   *      改对了变绿，但不再加分（已经扣过了，规则才立得住）
   */
  function checkWord(wi) {
    var wd = st.g.words[wi];
    if (!wd || st.locked[wi]) return;

    var full = true;
    var s = "";
    for (var i = 0; i < wd.cells.length; i++) {
      var v = st.input[wd.cells[i]];
      if (!v) {
        full = false;
        break;
      }
      s += v;
    }
    if (!full) {
      wd.bad = false;
      return;
    }

    if (s === wd.w) {
      wd.bad = false;
      st.locked[wi] = true;
      // 之前判过错的词，改对了只放行、不加分。
      // 否则「先随便填一遍 → 看到红色 → 改成对的」和一次填对拿一样
      // 的分，试错就没有代价了，规则立不住。
      if (!st.solved[wi] && !wd.missed) {
        S.recordAnswer(wd.item.w, true, 2);
        st.right++;
      }
      // 这个词填完了，自动跳到下一个未完成的词
      for (var k = 0; k < st.g.words.length; k++) {
        if (!st.locked[(wi + 1 + k) % st.g.words.length]) {
          selectWord((wi + 1 + k) % st.g.words.length);
          break;
        }
      }
    } else if (!wd.bad) {
      // 第一次判错才记账，之后玩家反复改不再重复扣
      wd.bad = true;
      wd.missed = true;
      if (!st.solved[wi]) {
        S.recordAnswer(wd.item.w, false, 2);
        st.miss++;
        st.wrongList[wd.item.w] = wd.item;
      }
    }
  }

  /** 全部填完后延迟一点再切结算：最后一格的绿色要让人看见。 */
  function finishSoon() {
    setTimeout(function () {
      if (st && !st.finished && allDone()) finish();
    }, 400);
  }

  /** 看答案：填进去并锁定，但不加分（算错一次）。 */
  function reveal(wi) {
    var wd = st.g.words[wi];
    if (!wd || st.locked[wi]) return;
    for (var i = 0; i < wd.cells.length; i++) {
      st.input[wd.cells[i]] = wd.w[i];
    }
    st.solved[wi] = true;
    wd.bad = false;
    st.locked[wi] = true;
    S.recordAnswer(wd.item.w, false, 2);
    st.miss++;
    st.wrongList[wd.item.w] = wd.item;
    render();
    if (allDone()) finishSoon();
  }

  function allDone() {
    for (var i = 0; i < st.g.words.length; i++) {
      if (!st.locked[i]) return false;
    }
    return true;
  }

  function finish() {
    var sec = Math.round((Date.now() - st.t0) / 1000);
    var total = st.g.words.length;
    var wrong = Object.keys(st.wrongList).map(function (k) {
      return st.wrongList[k];
    });
    var acc = total > 0 ? Math.round((st.right / total) * 100) : 0;

    st.finished = true;

    App.result.show({
      big: acc + "%",
      bigLabel: "一次填对",
      rows: [
        { v: total, l: "本局词数" },
        { v: st.miss, l: "需要看答案" },
        { v: sec, l: "用时（秒）" },
      ],
      wrong: wrong,
      note: "填字考交叉，横竖对不上就是一个字母拼错了。",
      again: { name: "cross", params: { packId: st.packId } },
      packId: st.packId,
    });
  }

  /* ------------------------------------------------------------
     四、渲染
     ------------------------------------------------------------ */
  function render() {
    App.ui.render();
  }

  function gridHtml() {
    var g = st.g;
    var html = '<div class="xw" style="--n:' + g.size + '">';
    for (var p = 0; p < g.size * g.size; p++) {
      var letter = g.cell[p];
      if (letter === null) {
        html += '<div class="xw-cell blank"></div>';
        continue;
      }
      var r = Math.floor(p / g.size);
      var c = p % g.size;

      // 这个格是不是某个词的起点
      var num = "";
      for (var i = 0; i < g.words.length; i++) {
        var wd = g.words[i];
        if (wd.r === r && wd.c === c) {
          num = wd.num;
          break;
        }
      }

      var v = st.input[p] || "";
      var cls = "xw-cell";
      if (st.sel) {
        var sw = g.words[st.sel.wi];
        if (sw && sw.cells[st.sel.idx] === p) cls += " cur";
        else if (sw && sw.cells.indexOf(p) >= 0) cls += " active";
      }
      // 锁定：找这个词是否已锁
      var own = st.owner[p] || [];
      var locked = false;
      var bad = false;
      for (var k = 0; k < own.length; k++) {
        var ow = g.words[own[k].wi];
        if (st.locked[own[k].wi]) locked = true;
        if (ow.bad && !st.locked[own[k].wi]) bad = true;
      }
      if (locked) cls += " good";
      if (bad) cls += " bad";

      html +=
        '<div class="' +
        cls +
        '" data-p="' +
        p +
        '">' +
        (num ? '<i class="xw-num">' + num + "</i>" : "") +
        (v ? esc(v) : "") +
        "</div>";
    }
    return html + "</div>";
  }

  function clueHtml(dir) {
    // 先带上原始下标再筛方向：网格里同一个词可能横竖都有，
    // 直接用 filter 会把 wi 弄丢，后面就没法定位了
    var list = st.g.words
      .map(function (wd, i) {
        return { wd: wd, wi: i };
      })
      .filter(function (x) {
        return x.wd.dir === dir;
      })
      .sort(function (a, b) {
        return a.wd.num - b.wd.num;
      });

    if (!list.length) return "";
    return (
      '<div class="clue-group"><div class="clue-title">' +
      (dir === 0 ? "横向" : "纵向") +
      "</div>" +
      list
        .map(function (x) {
          var wd = x.wd;
          var done = st.locked[x.wi];
          return (
            '<div class="clue' +
            (done ? " done" : "") +
            (st.sel && st.sel.wi === x.wi ? " on" : "") +
            '" data-wi="' +
            x.wi +
            '">' +
            '<span class="c-num">' +
            wd.num +
            "</span>" +
            '<span class="c-txt">' +
            esc(wd.item.z || "") +
            "（" +
            wd.w.length +
            "）</span>" +
            (done ? "" : '<span class="c-help" data-help="' + x.wi + '">答案</span>') +
            "</div>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function view() {
    var done = 0;
    for (var i = 0; i < st.g.words.length; i++) if (st.locked[i]) done++;

    return (
      '<div class="xw-head"><span class="q-idx">已填对 ' +
      done +
      " / " +
      st.g.words.length +
      "</span></div>" +
      /*
        网格和提示词包在 .xw-cols 里：
        宽屏（iPad 横屏）左右分栏 —— 网格在左、提示在右，
        一屏全部可见；窄屏（手机竖屏）由 CSS 退回上下排。
        不分栏的话，11×11 网格加提示词总高约 1000px，
        iPad 横屏可用高只有 730，看提示必须来回滚动。
      */
      '<div class="xw-cols">' +
      '<div class="card xw-card">' +
      gridHtml() +
      "</div>" +
      '<div class="clues">' +
      clueHtml(0) +
      clueHtml(1) +
      "</div>" +
      "</div>" +
      App.keys.render({ hideSpace: true })
    );
  }

  /* ------------------------------------------------------------
     五、注册视图
     ------------------------------------------------------------ */
  App.ui.register("cross", {
    render: function (p) {
      if (!st || st.packId !== p.packId || st.finished) {
        if (!begin(p.packId)) {
          // 这个包里没有适合填字的短单词
          return (
            '<div class="empty">这个词包里没有适合填字的短单词<br>' +
            '<span class="hint">填字只收 3~9 个字母的纯单词，词组和缩写用不了</span></div>' +
            '<div class="actions"><button class="btn block" data-act="back">返回</button></div>'
          );
        }
      }
      return view();
    },

    mount: function (el) {
      App.keys.bind(el, {
        onChar: function (c) {
          putChar(c);
        },
        onBack: back,
      });

      el.addEventListener("click", function (e) {
        var backBtn = e.target.closest("[data-act='back']");
        if (backBtn) {
          App.ui.go("pack", { packId: App.ui.current().params.packId });
          return;
        }

        var help = e.target.closest("[data-help]");
        if (help) {
          reveal(parseInt(help.getAttribute("data-help"), 10));
          return;
        }

        var cl = e.target.closest(".clue[data-wi]");
        if (cl) {
          selectWord(parseInt(cl.getAttribute("data-wi"), 10));
          render();
          return;
        }

        var cell = e.target.closest("[data-p]");
        if (!cell) return;
        var p = parseInt(cell.getAttribute("data-p"), 10);
        var own = st.owner[p] || [];
        if (!own.length) return;

        // 一个格子同时属于横竖两个词时，再点一次切到另一个
        var wi = own[0].wi;
        if (own.length > 1 && st.sel) {
          for (var i = 0; i < own.length; i++) {
            if (own[i].wi === st.sel.wi && i + 1 < own.length) {
              wi = own[i + 1].wi;
              break;
            }
            if (own[i].wi === st.sel.wi) {
              wi = own[0].wi;
              break;
            }
          }
        }
        selectWord(wi);
        // 光标直接落在点的那一格
        var wd = st.g.words[wi];
        var idx = wd.cells.indexOf(p);
        if (idx >= 0) st.sel.idx = idx;
        render();
      });
    },
  });
})();


/* ===== 70-scene.js ===== */
/* ============================================================
   70-scene.js —— 场景选词（仅 L3）
   ------------------------------------------------------------
   一句话：一句真实工作场景的英文，挖掉一个词，四个近义词里挑对的。

   为什么只有 L3 有：
     这个玩法考的是「近义词在工作语境里的区别」，
     比如 requirement / request / demand / specification 中文都
     能译成「需求」，但用在需求评审会上只有一个是对的。
     L1 的日常物品、L2 的文档用词没有这种辨析压力，
     出了就是四选一的猜谜。所以 L1/L2 干脆不开放这个玩法。

   答错时的解释才是重点：
     光告诉你「选错了」没用，得说清楚「为什么不是另外三个」。
     数据里的 df（差异解释）和 tp（人话解释）就是干这个的。
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});
  var S = App.store;
  var esc = function (s) {
    return App.ui.esc(s);
  };

  var COUNT = 6; // 一局几题
  var MAX_OPT = 4; // 正确项 + 3 个干扰项

  var st = null;

  /* ------------------------------------------------------------
     一、开局
     ------------------------------------------------------------
     只挑带干扰项（d 字段）的词条。没有干扰项就没法出这道辨析题，
     硬凑出来的选项会一眼看出谁对谁错。
     ------------------------------------------------------------ */
  function begin(packId) {
    var pack = App.data.getPack(packId);
    if (!pack) return null;

    var pool = pack.items.filter(function (it) {
      return it.d && it.d.length >= 2 && it.e;
    });
    if (pool.length < 2) return null;

    // pickSession 只用到 pack.items，这里把筛好的池子直接传进去，
    // 就能复用「越不熟越优先 + 同子类优先」那套出题逻辑
    var items = App.data.pickSession({ items: pool }, COUNT);
    if (!items.length) return null;

    st = {
      packId: packId,
      packName: pack.name,
      items: items,
      idx: 0,
      right: 0,
      miss: 0,
      wrongList: {},
      t0: Date.now(),
      finished: false,
      q: null,
    };
    nextQuestion();
    return st;
  }

  /**
   * 重画当前题。
   *
   * 直接调 App.ui.render() 整块重画，而不是逐个改 className：
   *   选完一个选项后，四个格子的状态要同时变（选中项变色、其余淡化、
   *   底部多出解释区、多出「下一题」按钮），逐个改容易漏。
   *   这一屏的 DOM 很小（一句场景 + 四个格子），重画的开销可以忽略。
   */
  function render() {
    App.ui.render();
  }

  function nextQuestion() {
    var it = st.items[st.idx];

    // 选项：正确词 + 干扰项，一起打乱
    var opts = [it.w].concat(it.d.slice(0, MAX_OPT - 1));
    App.data.shuffle(opts);

    st.q = {
      item: it,
      opts: opts,
      pick: -1, // 用户选了第几个
      done: false,
    };
  }

  /* ------------------------------------------------------------
     二、判定
     ------------------------------------------------------------ */
  function pick(i) {
    var q = st.q;
    if (!q || q.done) return;

    q.pick = i;
    q.done = true;

    var ok = q.opts[i] === q.item.w;
    if (ok) {
      S.recordAnswer(q.item.w, true, 2);
      st.right++;
    } else {
      S.recordAnswer(q.item.w, false, 2); // 归零 + 进错词本
      st.miss++;
      st.wrongList[q.item.w] = q.item;
    }
    render();
  }

  function next() {
    st.idx++;
    if (st.idx >= st.items.length) {
      finish();
      return;
    }
    nextQuestion();
    render();
  }

  function finish() {
    var sec = Math.round((Date.now() - st.t0) / 1000);
    var tries = st.right + st.miss;
    var acc = tries > 0 ? Math.round((st.right / tries) * 100) : 0;
    var wrong = Object.keys(st.wrongList).map(function (k) {
      return st.wrongList[k];
    });

    st.finished = true;

    App.result.show({
      big: acc + "%",
      bigLabel: "本局正确率",
      rows: [
        { v: st.right, l: "答对" },
        { v: st.miss, l: "答错" },
        { v: sec, l: "用时（秒）" },
      ],
      wrong: wrong,
      note: "选错的词明天的题里会再出现一次。",
      again: { name: "scene", params: { packId: st.packId } },
      packId: st.packId,
    });
  }

  /* ------------------------------------------------------------
     三、渲染
     ------------------------------------------------------------ */

  /** 把例句里的 ____ 换成一个醒目的空框。 */
  function sentenceHtml(e) {
    var parts = String(e).split("____");
    return parts
      .map(esc)
      .join('<span class="blank-box">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  }

  function view() {
    var q = st.q;
    var it = q.item;

    // 四个选项。判定之后：对的变绿、选错的变红，其余置灰
    var opts = q.opts
      .map(function (w, i) {
        var cls = "opt";
        if (q.done) {
          if (w === it.w) cls += " good";
          else if (i === q.pick) cls += " bad";
          else cls += " dim";
        }
        return (
          '<div class="' +
          cls +
          '" role="button"' +
          (q.done ? "" : ' data-opt="' + i + '"') +
          ">" +
          esc(w) +
          "</div>"
        );
      })
      .join("");

    // 判定后才显示的解释区
    var why = "";
    if (q.done) {
      var head = q.opts[q.pick] === it.w ? "选对了" : "选错了";
      why =
        '<div class="why"><div class="why-head ' +
        (q.opts[q.pick] === it.w ? "ok" : "no") +
        '">' +
        head +
        "：这里是 " +
        esc(it.w) +
        "（" +
        esc(it.z) +
        "）</div>" +
        (it.df ? '<div class="why-body">' + esc(it.df) + "</div>" : "") +
        (it.tp ? '<div class="why-tip">' + esc(it.tp) + "</div>" : "") +
        (it.ez ? '<div class="why-zh">' + esc(it.ez) + "</div>" : "") +
        "</div>";
    }

    return (
      '<div class="q-head">' +
      '<span class="q-idx">' +
      (st.idx + 1) +
      " / " +
      st.items.length +
      "</span>" +
      (it.sc ? '<span class="scene-tag">' + esc(it.sc) + "</span>" : "") +
      "</div>" +
      '<div class="card q-card">' +
      '<div class="scene-sent">' +
      sentenceHtml(it.e) +
      "</div>" +
      '<div class="opts">' +
      opts +
      "</div>" +
      why +
      "</div>" +
      (q.done
        ? '<div class="actions"><button class="btn primary block" data-act="next">' +
          (st.idx + 1 >= st.items.length ? "看结果" : "下一题") +
          "</button></div>"
        : "")
    );
  }

  /* ------------------------------------------------------------
     四、注册视图
     ------------------------------------------------------------ */
  App.ui.register("scene", {
    render: function (p) {
      if (!st || st.packId !== p.packId || st.finished) {
        if (!begin(p.packId)) {
          return (
            '<div class="empty">这个词包没有场景辨析题<br>' +
            '<span class="hint">场景选词只在 L3 的三个行业包里开放</span></div>' +
            '<div class="actions"><button class="btn block" data-act="back">返回</button></div>'
          );
        }
      }
      return view();
    },

    mount: function (el) {
      el.addEventListener("click", function (e) {
        var nb = e.target.closest("[data-act='next']");
        if (nb) {
          next();
          return;
        }
        var bb = e.target.closest("[data-act='back']");
        if (bb) {
          App.ui.go("pack", { packId: App.ui.current().params.packId });
          return;
        }
        var o = e.target.closest("[data-opt]");
        if (!o) return;
        pick(parseInt(o.getAttribute("data-opt"), 10));
      });
    },
  });
})();


/* ===== 90-boot.js ===== */
/* ============================================================
   90-boot.js —— 启动、落盘时机、错误兜底
   ------------------------------------------------------------
   这个文件最后执行，负责：
     1. 按正确顺序初始化（词库 → 存储 → 界面）
     2. 补上「页面进入后台时再落盘一次」这道保险
     3. 任何未捕获的异常，显示成可读的提示，而不是白屏
   ============================================================ */

(function () {
  "use strict";

  var App = window.App;

  /* ------------------------------------------------------------
     一、启动
     ------------------------------------------------------------ */

  function boot() {
    try {
      App.store.load(); // 先加载存储（每次启动只读一次盘）
      App.data.init(); // 解析内嵌词库
      App.ui.start(); // 渲染首屏
    } catch (e) {
      showFatal(e);
      return;
    }

    // 首屏起来之后，如果存储不可用，立刻提示一次。
    // 放在首屏之后是为了不挡住界面 —— 但必须提示，
    // 否则用户练完一小时才发现没存，这是最糟的体验。
    if (!App.store.persistent) {
      setTimeout(function () {
        App.ui.toast("本地存储不可用，进度不会保留", 4000);
      }, 800);
    }
  }

  /* ------------------------------------------------------------
     二、落盘时机
     ------------------------------------------------------------
     前面 10-store.js 已经做到「每答一题立即写盘」，正常退出、
     直接按 Home、锁屏都不会丢东西。

     这里再加一道保险，覆盖两种情况：
       a) 上一次写盘刚好失败（比如瞬时配额抖动），进后台时重试
       b) 别处有代码改了数据但没调用 save()（防御性，正常不该发生）

     为什么同时监听 visibilitychange 和 pagehide：
       - iOS Safari 与主屏幕 PWA 上，切到后台/锁屏会触发
         visibilitychange → hidden，这是最可靠的信号。
       - pagehide 在「上滑关闭 PWA」时更早触发，两者都挂不冲突，
         重复写一次的成本是几毫秒，可以忽略。
       - 不监听 beforeunload：iOS 上它经常根本不触发。
     ------------------------------------------------------------ */

  function flush() {
    try {
      App.store.save();
    } catch (e) {
      // 这里不能再抛，否则在后台事件里出错会静默失败
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flush();
  });

  window.addEventListener("pagehide", flush);

  /* ------------------------------------------------------------
     三、错误兜底
     ------------------------------------------------------------
     单文件应用最怕的是「一片空白，什么都不显示」，
     在 iPad 上没有控制台，用户完全无从判断出了什么事。

     所以任何致命错误都要渲染成一段看得懂的话 + 一个重试入口。
     ------------------------------------------------------------ */

  function showFatal(e) {
    var msg = e && e.message ? e.message : String(e);
    var stack = e && e.stack ? String(e.stack).split("\n").slice(0, 4).join("\n") : "";

    // 出错时 App.ui 可能还没建立（比如 30-ui.js 自己就挂了），
    // 所以这里不能直接调 App.ui.esc，要有一个不依赖任何模块的兜底
    function h(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    var host = document.getElementById("view");
    if (host) {
      host.innerHTML =
        '<div class="view-inner"><div class="card" style="padding:24px;margin-top:24px">' +
        '<div style="font-size:18px;font-weight:600;margin-bottom:10px">启动失败</div>' +
        '<div style="font-size:14px;color:#86909c;line-height:1.7;margin-bottom:14px">' +
        "页面没有正常加载。如果是刚更新过文件，请刷新一次；" +
        "如果仍然不行，把下面这段内容截图发我。" +
        "</div>" +
        '<pre style="font-size:12px;background:#f4f5f7;padding:12px;border-radius:8px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#e5484d">' +
        h(msg) +
        (stack ? "\n\n" + h(stack) : "") +
        "</pre>" +
        '<button class="btn primary block" style="margin-top:16px" onclick="location.reload()">重新加载</button>' +
        "</div></div>";
    }
    // 同时打到控制台，桌面调试时方便看完整堆栈
    if (window.console) console.error(e);
  }

  window.addEventListener("error", function (ev) {
    // 只处理脚本错误；资源加载失败（比如图标 404）不弹
    if (ev && ev.message) {
      // 启动阶段的错误已经在 boot 的 try/catch 里处理过，这里只记日志，
      // 避免一次错误弹两次提示
      if (window.console) console.error("[运行时错误]", ev.message, ev.filename, ev.lineno);
    }
  });

  /* ------------------------------------------------------------
     四、入口
     ------------------------------------------------------------ */

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  // 暴露给调试用。iPad 上没法开控制台，桌面调试时可以：
  //   App.debug.db()  看当前存储结构
  //   App.debug.reset() 清库（仅调试）
  App.debug = {
    db: function () {
      return App.store.dump();
    },
    users: function () {
      return App.store.users();
    },
    reset: function () {
      try {
        localStorage.removeItem("wg:v1");
        localStorage.removeItem("wg:v1:bak");
      } catch (e) {}
      location.reload();
    },
  };
})();

</script>
