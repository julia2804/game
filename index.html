t":"word","sc":"需求评审","e":"The main ____ is that we cannot change the core banking table structure.","ez":"主要约束是我们不能改核心银行系统的表结构。","d":["limitation","restriction","dependency"],"df":"constraint 是不能违反的硬条件；limitation 是能力上的不足；restriction 是人为规定的禁止；dependency 是要等别人。","tp":"约束是设计空间的边界，不是抱怨的理由。读需求先把 constraint 挑出来，方案可行范围就清楚了。","n":"认读"},{"w":"dependency","z":"依赖 / 依赖项","c":"需求沟通","t":"word","sc":"需求评审","e":"This task has a hard ____ on the payment gateway upgrade.","ez":"这个任务硬依赖支付网关的升级。","d":["reliance","prerequisite","blocker"],"df":"dependency 是要等它；prerequisite 是必须先做；blocker 是现在就卡住你。dependency 可以还没卡住，blocker 一定已经卡住。","tp":"dependency 是计划层面的（排在谁后面），blocker 是执行层面的（今天干不下去）。汇报时用错，对方会以为你已经停了。","n":"使用"},{"w":"prioritize","z":"排优先级","c":"需求沟通","t":"word","sc":"需求评审","e":"We need to ____ the fixes by customer impact, not by when the ticket was filed.","ez":"要按客户影响排优先级，不是按工单提交时间。","d":["rank","sort","schedule"],"df":"prioritize 是按重要性决定先做哪个；rank 是排序动作，可以按任意维度；sort 是机械排序；schedule 是排时间。","tp":"prioritize 隐含「资源不够，必须放弃一些」。如果什么都能做，就不需要这个词，说「都做」就行。","n":"使用"},{"w":"non-negotiable","z":"不可谈判的 / 硬性要求","c":"需求沟通","t":"word","sc":"需求评审","e":"Data must stay inside the region; that is ____ for the regulator.","ez":"数据必须留在境内，对监管来说这是硬性要求。","d":["mandatory","essential","fixed"],"df":"non-negotiable 是「没有讨论空间」；mandatory 是「强制要求」，但不排除实现方式可以谈；essential 是「必不可少」；fixed 是「已固定，不再改」。","tp":"non-negotiable 是需求沟通里最省时间的词。它明确告诉对方「这一条不用谈了，谈别的」。","n":"使用"},{"w":"feasibility","z":"可行性","c":"需求沟通","t":"word","sc":"需求评审","e":"We need a quick ____ check before committing to the December release.","ez":"在承诺十二月发布之前，要先做一次快速可行性确认。","d":["possibility","viability","capability"],"df":"feasibility 是技术上、资源上做不做得到；viability 是商业上值不值得做；possibility 只是有没有可能；capability 是能力。","tp":"feasibility 回答「能不能做」，不回答「该不该做」。这两个问题经常被混在一句话里，导致结论互相打架。","n":"认读"},{"w":"edge case","z":"边界情况","c":"需求沟通","t":"phrase","sc":"需求评审","e":"What happens if the amount is exactly zero? That is an ____ we have not handled.","ez":"金额正好是零会怎样？这个边界情况我们没处理。","d":["corner case","exception","extreme case"],"df":"edge case 是输入处在允许范围的边界上；corner case 是多个边界条件同时成立；exception 是运行时异常；extreme case 是极端但可能已超范围。","tp":"edge case 仍在合法输入范围内，只是恰好在边界，所以必须被正确处理，不能报「非法输入」了事。","n":"使用"},{"w":"use case","z":"用例 / 使用场景","c":"需求沟通","t":"phrase","sc":"需求评审","e":"The ____ is a teller reversing a transaction after the daily cutoff.","ez":"场景是柜员在日切之后冲正一笔交易。","d":["scenario","user story","case"],"df":"use case 描述谁在什么情况下用系统做什么、得到什么结果；scenario 是一段情形，更口语；user story 是敏捷的需求写法，强调价值；case 太泛。","tp":"说清 use case 要包含四件事：谁、什么条件、做什么、期望结果。缺一个，实现一定跑偏。","n":"认读"},{"w":"deliverable","z":"交付物","c":"需求沟通","t":"word","sc":"需求评审","e":"The ____ for this sprint include the API spec and the migration script.","ez":"本迭代的交付物包括接口文档和迁移脚本。","d":["output","artifact","product"],"df":"deliverable 是承诺交给对方的东西，含验收义务；output 是做出来的东西，不一定交出去；artifact 是构建产物或过程文档；product 是产品整体。","tp":"deliverable 是可以写进承诺的。内部草稿不算，因为没人等着验收它。","n":"认读"},{"w":"milestone","z":"里程碑","c":"需求沟通","t":"word","sc":"需求评审","e":"The UAT ____ is on 15 November; slippage there pushes the whole launch.","ez":"UAT 里程碑是 11 月 15 日，这里一滑整个上线都要推。","d":["deadline","checkpoint","phase"],"df":"milestone 是计划上的关键节点，通常是一个可验收的状态；deadline 是必须完成的最后期限；checkpoint 是中途检查点，可以不过；phase 是一个时间段。","tp":"milestone 是状态，不是日期。写「11 月 15 日 UAT 完成」才是里程碑，只写「11 月 15 日」就只是个日子。","n":"认读"},{"w":"change request","z":"变更请求","c":"需求沟通","t":"phrase","sc":"正式邮件","e":"Please raise a formal ____ if you want to add a field to the settlement report.","ez":"想在结算报表里加字段，请走正式变更申请。","d":["change log","feature request","ticket"],"df":"change request 是针对已确认范围的正式修改申请，要走评估和批准；feature request 是希望有新功能，可以在范围外；change log 是记录已发生变更的文档。","tp":"重点在 request：提出不等于批准。银行项目里没走 CR 就改，验收时很可能不认。","n":"使用"},{"w":"impact analysis","z":"影响分析","c":"需求沟通","t":"phrase","sc":"需求评审","e":"Before we approve the change, we need an ____ covering downstream reports and reconciliation.","ez":"批准变更之前，需要一份覆盖下游报表和对账的影响分析。","d":["risk assessment","gap analysis","root cause analysis"],"df":"impact analysis 回答「改这个会牵连到什么」；risk assessment 回答「有多大可能出问题、多严重」；gap analysis 回答「现状与目标差在哪」；root cause analysis 回答「为什么出问题」。","tp":"影响分析的范围是「被牵连的部分」，不是改动本身。所以它永远在改动之外找东西，漏了下游就是没做。","n":"使用"},{"w":"backlog","z":"需求池 / 待办列表","c":"需求沟通","t":"word","sc":"需求评审","e":"That item has been sitting in the ____ for two quarters; it is unlikely to be picked up.","ez":"那条在需求池里躺了两个季度，估计不会被捡起来。","d":["to-do list","wishlist","queue"],"df":"backlog 是已记录但未排期的工作集合，有优先级但没有承诺；wishlist 是想要但不一定做；queue 是按顺序等着处理，通常有先后保证。","tp":"进了 backlog 只代表「记下来了」，不代表「会做」。这是很多人误判进度的根源。","n":"认读"},{"w":"refinement","z":"需求梳理 / 细化","c":"需求沟通","t":"word","sc":"需求评审","e":"We will run a ____ session on Thursday to split the epic into smaller stories.","ez":"周四开一次梳理会，把这个大需求拆成更小的故事。","d":["review","planning","grooming"],"df":"refinement 是把粗需求拆细、补细节；review 是检查已有产出；planning 是排期；grooming 是 refinement 的旧叫法，现在很多团队弃用。","tp":"梳理会的产出必须是「更小、更清楚、能估时」的条目。开完条目没变细，这个会就等于没开。","n":"认读"},{"w":"user story","z":"用户故事","c":"需求沟通","t":"phrase","sc":"需求评审","e":"The ____ reads: as a teller, I want to see recent transactions so that I can answer questions quickly.","ez":"这条用户故事是：作为柜员，我想看到近期交易，以便快速回答客户问题。","d":["use case","requirement","task"],"df":"user story 是固定句式「作为…我想要…以便…」，强调价值；use case 更完整，含前置条件和流程；requirement 是通用词；task 是实现动作。","tp":"「以便」那半句不能省。省了就退化成「某人要一个功能」，没人知道为什么做，也就没法判断该不该砍。","n":"认读"},{"w":"walk through","z":"逐条过一遍 / 带着讲","c":"需求沟通","t":"phrase","sc":"需求评审","e":"Could you ____ the flow diagram with us before we sign off?","ez":"签字确认之前，能不能带着我们把流程图过一遍？","d":["go over","review","present"],"df":"walk through 是带着对方一步步走、边讲边看；go over 更泛，可以只是快速浏览；review 是检查并给意见；present 是单向宣讲。","tp":"walk through 隐含「你在带路」，所以听的人可以随时打断提问。这是对齐需求最有效的方式，比发文档强。","n":"使用"},{"w":"raise a concern","z":"提出顾虑","c":"需求沟通","t":"phrase","sc":"需求评审","e":"I want to ____ about the retry logic: it may double-charge the customer.","ez":"我想就重试逻辑提个顾虑：可能会重复扣款。","d":["raise a question","raise an issue","complain"],"df":"raise a concern 是「我担心会出问题」，还没定性；raise an issue 是已确认有问题、要登记；raise a question 只是提问；complain 是抱怨，带情绪。","tp":"concern 是「还没有证据，但风险存在」。用它，别人不会觉得你在阻拦；说 issue，事情就正式立项了。","n":"使用"},{"w":"align on","z":"就…达成一致","c":"需求沟通","t":"phrase","sc":"需求评审","e":"Let us ____ the definition of «active user» before building the dashboard.","ez":"做看板之前，先就「活跃用户」的定义达成一致。","d":["agree with","agree on","align to"],"df":"align on 是多方对同一件事形成统一口径；agree with 是「我同意你」；agree on 是「就某事达成一致」，比 align on 轻；align to 是「向某标准看齐」，单向。","tp":"align on 的对象是定义、口径、方案，不是人。说 align on someone 是错的，那会变成「站在某人一边」。","n":"使用"},{"w":"as discussed","z":"如所讨论的","c":"需求沟通","t":"phrase","sc":"正式邮件","e":"____, we will start with the read-only view and add editing in phase two.","ez":"如我们讨论的，先做只读视图，二期再加编辑。","d":["as agreed","as mentioned","as stated"],"df":"as discussed 是「我们聊过」，不一定是结论；as agreed 是「已经谈定」，有承诺含义；as mentioned 是「前面提过」；as stated 是「文件里写着」。","tp":"as discussed 后面可以跟讨论过程，as agreed 后面必须是结论。写邮件用错，等于你替对方做了决定。","n":"使用"},{"w":"gap","z":"缺口 / 差距","c":"需求沟通","t":"word","sc":"需求评审","e":"There is a ____ between what the spec says and what the system actually does.","ez":"规格说明写的和系统实际行为之间有个缺口。","d":["difference","discrepancy","missing"],"df":"gap 是「应该有但没有」的空缺，隐含要补；difference 是中性差异；discrepancy 是两边对不上，含错误意味；missing 是形容词。","tp":"gap 一定有一边是「应有状态」。没有基准的差异不叫 gap，只是不同。","n":"认读"},{"w":"freeze","z":"冻结（范围 / 代码）","c":"需求沟通","t":"word","sc":"需求评审","e":"We agreed to ____ the scope at the end of this week.","ez":"我们同意本周末冻结范围。","d":["lock","close","finalize"],"df":"freeze 是定下来不再改，默认状态；lock 是锁住不让动，可指技术也可指管理；close 是结束；finalize 是定稿。","tp":"freeze 之后要改就得走变更流程。它是「默认不改」，不是「绝对不改」，所以冻结日期要写进会议纪要。","n":"认读"},{"w":"agenda","z":"议程","c":"会议","t":"word","sc":"例会口语","e":"Please add the API versioning topic to the ____ before we send it out.","ez":"发出去之前，把接口版本管理这个话题加进议程。","d":["schedule","timetable","minutes"],"df":"agenda 是要讨论哪几件事；schedule 是什么时间做什么；timetable 偏交通或课程表；minutes 是会后记录。","tp":"议程决定会议能不能开短。没有议程的会，通常也没有结论，因为没人知道要结束在哪个问题。","n":"认读"},{"w":"convene","z":"召集（会议）","c":"会议","t":"word","sc":"纪要文档","e":"The change advisory board will ____ at 3 p.m. to review the release.","ez":"变更评审委员会下午三点开会评审这次发布。","d":["call","hold","convoke"],"df":"convene 是正式召集开会，主语可以是会议本身；call a meeting 更日常；hold a meeting 是举行；convoke 更正式，多用于机构。","tp":"convene 偏书面。纪要写「the meeting was convened at 15:00」比「we held a meeting」正式。","n":"认读"},{"w":"kickoff","z":"启动会","c":"会议","t":"word","sc":"例会口语","e":"The project ____ is on Monday; all workstream leads are expected to attend.","ez":"项目启动会定在周一，各工作流负责人都要参加。","d":["start","launch","initiation"],"df":"kickoff 是项目开始那次会，重点是目标对齐和分工；start 只是开始这个动作；launch 是产品上线；initiation 是立项流程。","tp":"注意它与动词 kick off 的分工：kickoff 是名词（那次会），kick off 是动词（开始做）。启动会的产出是「谁负责什么、下一步什么时候」。","n":"认读"},{"w":"standup","z":"站会","c":"会议","t":"word","sc":"例会口语","e":"In the daily ____, each person answers what they did, what they will do, and what is blocking them.","ez":"每日站会上，每个人回答做了什么、要做什么、被什么卡住。","d":["standby","briefing","sync"],"df":"standup 是每日固定短会，围绕三个问题；briefing 是单向通报；sync 是同步信息，可长可短；standby 是待命状态。","tp":"站会是暴露问题的场合，不是向上汇报进度。开着开着变成逐人汇报，就是跑偏了。","n":"认读"},{"w":"retrospective","z":"复盘会","c":"会议","t":"word","sc":"例会口语","e":"The sprint ____ surfaced that code review was taking three days on average.","ez":"迭代复盘会上暴露出代码评审平均要三天。","d":["review","postmortem","debrief"],"df":"retrospective 是团队定期回顾过程怎么改进；postmortem 是事故后的分析，聚焦这次为什么出事；debrief 是任务结束后的简短总结；review 是检查产出。","tp":"复盘的对象是流程，事故复盘的对象是事故。在复盘会上追责某个人，下次就没人说真话了。","n":"认读"},{"w":"breakout session","z":"分组讨论","c":"会议","t":"phrase","sc":"例会口语","e":"After the plenary, we will split into a ____ on data migration.","ez":"全体会之后，我们分成小组讨论数据迁移。","d":["workshop","panel","plenary"],"df":"breakout session 是大会议程里分成小组的讨论；workshop 是动手做的研讨；panel 是台上几位嘉宾对谈；plenary 是全体到场的大会，正好与它相对。","tp":"看到 breakout session 就知道自己会被分进某个小组，通常要产出小组结论带回去。","n":"认读"},{"w":"adjourn","z":"休会 / 散会","c":"会议","t":"word","sc":"纪要文档","e":"The meeting was ____ until next Tuesday because the risk team was not ready.","ez":"会议休会到下周二，因为风控团队还没准备好。","d":["suspend","postpone","cancel"],"df":"adjourn 是正式会议暂停或结束、另定时间续，用于有议程的正式会议；suspend 是临时中断；postpone 是推迟；cancel 是取消。","tp":"纪要里出现 adjourned，通常意味着「没议完，还要接着开」。别把它读成「事情定了」。","n":"认读"},{"w":"go over","z":"过一遍","c":"会议","t":"phrase","sc":"例会口语","e":"Let us quickly ____ the open items from last week.","ez":"快速过一下上周的未结项。","d":["go through","go about","go along"],"df":"go over 是逐项看一遍，可以是检查也可以是讲解；go through 更强调完整经历一遍过程；go about 是着手做；go along 是同意、配合。","tp":"go over 后面跟条目、内容，不跟人。go over someone 意思是「越过某人直接找上级」，完全是另一件事。","n":"使用"},{"w":"table","z":"搁置（美式）/ 提交讨论（英式）","c":"会议","t":"word","sc":"例会口语","e":"Since the vendor has not replied, let us ____ the integration discussion until next week.","ez":"供应商还没回复，先把集成的讨论搁置到下周。","d":["postpone","shelve","defer"],"df":"美式 table 是搁置、暂不讨论；英式 table 反而是提交讨论。postpone 是纯粹改期；shelve 是无限期搁置；defer 是推迟到某个时点。","tp":"这个词在跨时区会议里会真的出事。看到 table 先确认对方是美式还是英式：美式是先不谈，英式是现在谈。","n":"使用"},{"w":"park","z":"先放一放（稍后再议）","c":"会议","t":"word","sc":"例会口语","e":"That is a fair point, but let us ____ it and come back after we settle the data model.","ez":"这点有道理，但先放一放，等数据模型定了再回来谈。","d":["drop","skip","table"],"df":"park 是记下来、待会儿或下次再谈，不是丢弃；drop 是彻底不谈；skip 是跳过；table 偏正式搁置。","tp":"park 的关键是有人把它记下来。只说不记，park 就等于 drop，而且没人承认。","n":"使用"},{"w":"circle back","z":"回头再谈","c":"会议","t":"phrase","sc":"例会口语","e":"Let us ____ on the retry policy once we have the error rate data.","ez":"等拿到错误率数据，再回头谈重试策略。","d":["come back","follow up","revisit"],"df":"circle back 是等条件具备后回到这个话题；come back 更泛；follow up 是跟进别人的动作；revisit 是重新考虑已经定过的事。","tp":"circle back 常常是「暂时搁置」的委婉说法。听到它，最好当场问清「什么时候、谁来触发」，否则它不会回来。","n":"使用"},{"w":"follow up","z":"跟进","c":"会议","t":"phrase","sc":"正式邮件","e":"I will ____ with the vendor on the certificate expiry.","ez":"证书到期的事我去跟进供应商。","d":["follow through","chase","pursue"],"df":"follow up 是事后去问进展；follow through 是把手上的事做完；chase 是催，带压力；pursue 是追求某个目标。","tp":"follow up 是你去问别人，follow through 是你把自己的承诺做完。搞混会显得你在催自己。","n":"使用"},{"w":"action item","z":"行动项 / 待办","c":"会议","t":"phrase","sc":"纪要文档","e":"Every ____ must have an owner and a due date, otherwise it will not happen.","ez":"每个行动项都必须有人负责、有截止日期，否则不会发生。","d":["task","to-do","next step"],"df":"action item 是会议产出的、有明确责任人的具体动作；task 来源可以是任何地方；to-do 更个人化；next step 是方向性描述，可能还没落到人。","tp":"三要素：动词开头、有人、有时间。缺一个，它就只是「大家觉得应该做的事」。","n":"使用"},{"w":"owner","z":"责任人","c":"会议","t":"word","sc":"纪要文档","e":"Please confirm the ____ for the data migration before the meeting ends.","ez":"散会前请确认数据迁移的责任人。","d":["assignee","lead","participant"],"df":"owner 是对结果负责；assignee 是被指派执行的人；lead 是牵头人，偏团队或项目；participant 只是参与者。","tp":"owner 要对「做成没做成」负责，不只是「做了」。所以它最好唯一，而一个 owner 下面可以挂多个执行人。","n":"使用"},{"w":"open the floor","z":"开放讨论","c":"会议","t":"phrase","sc":"例会口语","e":"Now that the design has been presented, I will ____ for questions.","ez":"设计讲完了，现在把时间交给提问。","d":["open the meeting","open discussion","take questions"],"df":"open the floor 是把发言权交给在场的人；open the meeting 是宣布会议开始；open discussion 是自由讨论环节；take questions 是接受提问，主语是主持人。","tp":"说完这句，话语权就从主持人转到听众。说完还继续自己讲，这个词就用错了。","n":"认读"},{"w":"run over","z":"超时","c":"会议","t":"phrase","sc":"例会口语","e":"We are already ____ by ten minutes; let us take the rest offline.","ez":"已经超时十分钟了，剩下的会后单独聊。","d":["overrun","run late","extend"],"df":"run over 是会议超出预定时间；overrun 多用于成本或工期超出预算；run late 是人或车迟到；extend 是主动延长。","tp":"会议超时的处理方式不是加速，是砍议题。run over 一出现，就该决定哪一条留到下次。","n":"使用"},{"w":"recap","z":"复述要点","c":"会议","t":"word","sc":"例会口语","e":"Let me ____ what we agreed on before we leave.","ez":"散会前我把达成的共识复述一遍。","d":["summarize","repeat","review"],"df":"recap 是把要点再讲一遍以确认理解一致；summarize 是概括，可以单向；repeat 是重复原话；review 是检查。","tp":"recap 的目的不是复述，是给对方一个说「不是这样」的机会。所以说完要停一下等确认，不能一口气讲完就散会。","n":"使用"},{"w":"bandwidth","z":"精力 / 可投入的时间","c":"会议","t":"word","sc":"例会口语","e":"I do not have the ____ to take on another integration this sprint.","ez":"这个迭代我没精力再接一个集成。","d":["capacity","resource","time"],"df":"bandwidth 在职场口语里指个人可投入的精力；capacity 指系统或团队的承载能力，更正式；resource 指人、机器、预算这些实体；time 只是时间。","tp":"bandwidth 是委婉说法，等于「我忙不过来」。它是人的说法，不要用在系统性能上，那里应该说 capacity 或 throughput。","n":"使用"},{"w":"loop in","z":"把…拉进沟通","c":"会议","t":"phrase","sc":"正式邮件","e":"Please ____ the DBA before we decide on the index change.","ez":"定索引变更之前，把 DBA 拉进来。","d":["include","involve","cc"],"df":"loop in 是让某人进入信息圈，可以是会议也可以是邮件；include 更泛；involve 强调让其参与工作；cc 只是邮件抄送。","tp":"loop in 的重点是「让他知道并且可以发言」，不是「通知他」。只 cc 不交代背景，不算 loop in。","n":"使用"},{"w":"take it offline","z":"会后单独聊","c":"会议","t":"phrase","sc":"例会口语","e":"This is getting into implementation details; let us ____ and report back.","ez":"这已经聊到实现细节了，会后单独聊，然后回来同步结论。","d":["discuss later","off the record","take it outside"],"df":"take it offline 是不占用会议时间、会后小范围谈；discuss later 更泛；off the record 是不记录不公开，性质不同；take it outside 带挑衅意味。","tp":"它不带负面含义，只是「别占大家时间」。但必须说清谁和谁、什么时候，否则这个话题就消失了。","n":"使用"},{"w":"on the same page","z":"理解一致","c":"会议","t":"phrase","sc":"例会口语","e":"Before we split the work, let us make sure we are ____ about what done means.","ez":"分活之前，先确认我们对「完成」的理解是一致的。","d":["in sync","in line","on board"],"df":"on the same page 是对同一件事的理解一致；in sync 是状态同步，偏进度；in line with 是与某标准一致；on board 是同意并支持。","tp":"same page 谈理解，on board 谈态度。理解了但不同意，是 same page 但 not on board，这两种状态要分开处理。","n":"使用"},{"w":"blocker","z":"阻塞项","c":"会议","t":"word","sc":"例会口语","e":"My only ____ is that I still do not have test data for the corporate account.","ez":"我唯一的阻塞是还没拿到对公账户的测试数据。","d":["issue","risk","obstacle"],"df":"blocker 是现在就让工作停住的问题；issue 是已发生的问题，未必停摆；risk 是可能发生；obstacle 是障碍，偏长期。","tp":"判断标准只有一条：我今天还能不能继续干。能继续就不是 blocker。乱用会稀释真正的阻塞。","n":"使用"},{"w":"push back","z":"提出反对 / 回推","c":"会议","t":"phrase","sc":"例会口语","e":"The vendor ____ on the November date, saying the integration needs two more weeks.","ez":"供应商对十一月这个时间点提出反对，说集成还要两周。","d":["push forward","push through","object"],"df":"push back 是对既定方案提出反对或要求重议；object 是正式反对，偏程序；push through 是强行推进；push forward 是推进。","tp":"push back 不等于拒绝，它是「我有理由，请重新考虑」。听到它要问理由，而不是当成阻力。","n":"使用"},{"w":"take the lead","z":"牵头","c":"会议","t":"phrase","sc":"例会口语","e":"Could you ____ on the reconciliation module while I handle reporting?","ez":"你来牵头对账模块，我负责报表，行吗？","d":["take over","take charge","lead"],"df":"take the lead on 是在某件事上牵头；take over 是接手别人的工作；take charge 是接管控制权，语气更强；lead 是泛指领导。","tp":"牵头不等于一个人做完，是负责推动和对外代表。人手和排期还得另外配，这点在分工时要讲清。","n":"使用"},{"w":"touch base","z":"简短沟通一下","c":"会议","t":"phrase","sc":"例会口语","e":"Let us ____ tomorrow morning to see where the migration stands.","ez":"明早简单对一下迁移进度。","d":["catch up","check in","meet"],"df":"touch base 是短时间对齐状态，不解决问题；catch up 是聊近况，社交意味更浓；check in 偏确认对方状况；meet 是正式会面。","tp":"touch base 暗示「不深入、不超时」。真要解决问题，说 working session 更准确，否则对方不会准备材料。","n":"认读"},{"w":"minutes","z":"会议纪要","c":"会议纪要","t":"word","sc":"纪要文档","e":"Could you take the ____ today? I will be presenting.","ez":"今天你做会议纪要行吗？我要主讲。","d":["notes","record","summary"],"df":"minutes 是正式会议记录，含决议、行动项、出席情况，通常要归档；notes 是个人随手记；record 泛指记录，也可指录音；summary 只是摘要。","tp":"它是复数形式但指一份文件。take the minutes 是做纪要，不是拿走纪要。只写摘要不写决议，那不叫 minutes。","n":"使用"},{"w":"attendees","z":"参会人","c":"会议纪要","t":"word","sc":"纪要文档","e":"The ____ list includes two people from risk and one from the vendor.","ez":"参会人名单里有两个风控的人和一个供应商的人。","d":["participants","members","present"],"df":"attendees 是实际到场的人，纪要专用；participants 是参与者，含线上或部分参与；members 指组织归属；present 是形容词，用于 those present。","tp":"attendees 只写到了的人。没到的要单独写 apologies 或 absent，混在一起就说不清谁有表决权。","n":"认读"},{"w":"apologies","z":"请假 / 致歉（缺席）","c":"会议纪要","t":"word","sc":"纪要文档","e":"____ were received from the security team, who will review the minutes asynchronously.","ez":"安全团队请假，他们会事后异步看纪要。","d":["absent","excuses","regrets"],"df":"apologies 在英式纪要里是固定用法，表示请假未到；regrets 是美式对应说法；absent 只是缺席，不含请假意味；excuses 是借口，带负面。","tp":"这条只是礼节记录，不代表他没意见。真正要确认的是他事后有没有提出异议，否则缺席者的态度会被默认忽略。","n":"认读"},{"w":"absent","z":"缺席","c":"会议纪要","t":"word","sc":"纪要文档","e":"Two voting members were ____, so the decision was deferred.","ez":"两名有表决权的成员缺席，所以决议延后。","d":["apologies","missing","away"],"df":"absent 是客观状态，不在场；apologies 是请假这个动作；missing 是找不到；away 是离开，偏口语。","tp":"absent 是中性的。纪要里不要写 failed to attend，那是指责，属于把事实写成评价。","n":"认读"},{"w":"discussion points","z":"讨论要点","c":"会议纪要","t":"phrase","sc":"纪要文档","e":"The ____ section records what was debated, not what was decided.","ez":"讨论要点这一节记的是争论了什么，不是定了什么。","d":["agenda","decisions","topics"],"df":"discussion points 是会上讨论过的内容；decisions 是结论；agenda 是原计划讨论的；topics 是话题，更泛。","tp":"纪要把讨论和决议分开写是基本要求。混在一起，事后没人说得清到底定了什么，也没人知道哪条还能再议。","n":"认读"},{"w":"decision","z":"决议","c":"会议纪要","t":"word","sc":"纪要文档","e":"The ____ was to keep the old endpoint alive for six months.","ez":"决议是保留旧接口六个月。","d":["conclusion","resolution","agreement"],"df":"decision 是已经定下来的选择，有约束力；conclusion 是分析得出的结论，不一定执行；resolution 偏正式机构表决通过；agreement 强调各方共识。","tp":"决议要写清定了什么、谁定的、什么时候生效。只写「会上决定…」，等于没有可追溯性。","n":"使用"},{"w":"decision log","z":"决议记录","c":"会议纪要","t":"phrase","sc":"纪要文档","e":"Add it to the ____ so that we do not re-open the same argument next quarter.","ez":"加进决议记录，免得下季度又吵一遍同样的事。","d":["change log","meeting minutes","issue log"],"df":"decision log 是持续记录所有已定决策及理由的文档；change log 记录代码或配置变更；minutes 是单次会议记录；issue log 记录问题。","tp":"它最有价值的是「理由」那一栏。只记结论，半年后一定有人问「当初为什么这么定」，然后重开讨论。","n":"认读"},{"w":"assigned to","z":"指派给","c":"会议纪要","t":"phrase","sc":"纪要文档","e":"Each action item is ____ a single person, not a team.","ez":"每个行动项指派给一个人，不是指派给一个团队。","d":["allocated to","owned by","handed to"],"df":"assigned to 是被分配任务；owned by 是对结果负责；allocated to 是资源被划给，多用于预算或人力；handed to 是移交。","tp":"指派给团队等于没指派。纪要里的行动项必须落到一个人名，团队只会互相等。","n":"使用"},{"w":"next steps","z":"下一步","c":"会议纪要","t":"phrase","sc":"纪要文档","e":"The ____ are to circulate the draft by Friday and collect feedback by Tuesday.","ez":"下一步是周五前发出草稿，周二前收齐反馈。","d":["action items","follow-up","plan"],"df":"next steps 是接下来要推进的方向和顺序，可以没有具体责任人；action items 是具体到人的动作；follow-up 是跟进这个动作；plan 是完整计划。","tp":"next steps 写得再漂亮，不落到人和时间就只是气氛。它的下限是「有顺序」，上限才是「有责任人」。","n":"认读"},{"w":"AOB","z":"其他事项","c":"会议纪要","t":"abbr","sc":"纪要文档","e":"Any other business (____) was raised at the end: the upcoming audit.","ez":"最后在其他事项环节提到了即将到来的审计。","d":["misc","other items","TBD"],"df":"AOB 是 any other business 的缩写，正式议程的最后一项；misc 是杂项；other items 太泛；TBD 是待定，含义完全不同。","tp":"AOB 是议程的固定收尾项，用来装没提前列但要说一句的事。它不是「随便聊」，也不是「散会前的自由时间」。","n":"认读"},{"w":"motion","z":"动议","c":"会议纪要","t":"word","sc":"纪要文档","e":"The ____ to approve the new retention policy was passed unanimously.","ez":"批准新留存政策的动议一致通过。","d":["proposal","suggestion","request"],"df":"motion 是正式提交表决的提议，有程序含义；proposal 是方案建议，不必表决；suggestion 更轻；request 是请求。","tp":"motion 只在有表决程序的场合用，比如董事会、委员会。日常技术会上说 motion 会很奇怪，那不是程序问题。","n":"认读"},{"w":"second","z":"附议","c":"会议纪要","t":"word","sc":"纪要文档","e":"The motion was proposed by the risk lead and ____ by the operations lead.","ez":"动议由风控负责人提出，运营负责人附议。","d":["support","agree","endorse"],"df":"second 是程序上附议，使动议可以进入表决，是正式动作；support 是支持，不构成程序；agree 是同意；endorse 是公开背书。","tp":"它是动词，不是「第二个」。没被附议的动议通常不能表决，所以纪要里这一笔不能省。","n":"认读"},{"w":"unanimous","z":"一致通过","c":"会议纪要","t":"word","sc":"纪要文档","e":"The vote was ____, with no abstentions.","ez":"表决一致通过，无人弃权。","d":["unified","collective","universal"],"df":"unanimous 是所有有表决权的人都赞成；unified 是团结的，形容状态；collective 是集体的；universal 是普遍的。","tp":"它和「没人反对」不完全一样：弃权也没反对，但严格的一致通过通常要求全员赞成，所以纪要要注明有无弃权。","n":"认读"},{"w":"abstain","z":"弃权","c":"会议纪要","t":"word","sc":"纪要文档","e":"Two members ____ from the vote because of a conflict of interest.","ez":"两名成员因利益冲突弃权。","d":["refrain","withhold","absent"],"df":"abstain 专指表决时弃权；refrain from 是克制不做某事；withhold 是扣住不给，如 withhold approval；absent 是没到场。","tp":"弃权是明确的程序选择，不是没表态。纪要必须记，因为它直接影响是否达到多数。","n":"认读"},{"w":"deferred","z":"延期审议","c":"会议纪要","t":"word","sc":"纪要文档","e":"The decision on the vendor contract was ____ until the legal review is complete.","ez":"供应商合同的决议延后到法务审查结束。","d":["postponed","delayed","suspended"],"df":"deferred 是决定暂缓、等条件具备再议，是主动选择；postponed 是改期；delayed 是被延误，含负面；suspended 是中止，可能不再恢复。","tp":"它和动词 defer 是同源的：deferred 是「这次不定」，不是「否定」。看到它要去查「在等什么条件」。","n":"认读"},{"w":"noted","z":"已知悉","c":"会议纪要","t":"word","sc":"纪要文档","e":"The concern about data retention was ____ but not resolved.","ez":"关于数据留存的顾虑已记录，但未解决。","d":["acknowledged","recorded","agreed"],"df":"noted 是记下了，不含同意；acknowledged 是确认收到并理解；recorded 是已记录；agreed 是同意。","tp":"这是纪要里最容易被误读的词。它只表示「听到了」，不表示「会处理」。看到 noted 要追问后续动作。","n":"使用"},{"w":"acknowledged","z":"已确认收到","c":"会议纪要","t":"word","sc":"正式邮件","e":"The vendor ____ receipt of the change request on Monday.","ez":"供应商周一向我们确认收到了变更请求。","d":["noted","confirmed","accepted"],"df":"acknowledged 是确认收到了，不涉及是否接受内容；confirmed 是确认内容无误或确认安排；accepted 是接受，含同意；noted 更弱。","tp":"它只解决「你收到了吗」，不解决「你同意吗」。这两件事在工单和合同里必须分开记录，否则责任说不清。","n":"使用"},{"w":"in attendance","z":"出席","c":"会议纪要","t":"phrase","sc":"纪要文档","e":"Also ____: the external auditor and two observers from compliance.","ez":"出席者还包括外部审计和两名合规观察员。","d":["present","attending","participants"],"df":"in attendance 是纪要固定表达，用于补充出席者；present 也用于 those present，更简洁；attending 是动词分词；participants 是参与者，未必到场。","tp":"要区分出席和列席：观察员出席但无表决权，纪要里必须标出来，否则决议的有效性会被质疑。","n":"认读"},{"w":"circulate","z":"传阅 / 分发","c":"会议纪要","t":"phrase","sc":"正式邮件","e":"I will ____ the draft minutes to all attendees for correction.","ez":"我把纪要草稿发给所有参会人传阅修改。","d":["distribute","send","share"],"df":"circulate 是在群体内传阅并征求意见；distribute 是分发，单向；send 只是发送；share 更口语。","tp":"circulate 隐含「请你看并反馈」。只发不设反馈期限，纪要就永远定不了稿。","n":"使用"},{"w":"ratify","z":"批准 / 追认","c":"会议纪要","t":"word","sc":"纪要文档","e":"The board will ____ the decision at its next session.","ez":"董事会将在下次会议上追认这个决定。","d":["approve","confirm","endorse"],"df":"ratify 是对已做出但需正式授权的决定予以追认，通常用于机构；approve 是批准，范围更广；confirm 是确认；endorse 是公开支持。","tp":"它的对象是已经发生或已初步决定的事，所以是补程序，不是首次决定。理解错会以为事情还没定。","n":"认读"},{"w":"Please find attached","z":"详见附件","c":"邮件","t":"phrase","sc":"正式邮件","e":"____ the revised schedule and the updated risk list.","ez":"附件是修订后的排期和更新后的风险清单。","d":["Attached please find","Please find enclosed","Please see attachment"],"df":"Attached please find 更老派正式；Please find enclosed 用于实体信件；Please see attachment 更口语；含义相同，差别只在正式度。","tp":"这句后面必须跟「是什么文件」。只说 please find attached 不说附件是什么，对方得打开才知道，等于把成本转给对方。","n":"使用"},{"w":"per our conversation","z":"按我们沟通的","c":"邮件","t":"phrase","sc":"正式邮件","e":"____, the cutoff will move to 22:30 starting next Monday.","ez":"按我们沟通的，截止时间从下周一起改为 22:30。","d":["as per our conversation","according to our conversation","based on our talk"],"df":"per our conversation 是简洁书面表达；as per 被部分风格指南认为冗赘；according to 有「据…所说」的距离感，甚至隐含不确定；based on our talk 更口语。","tp":"它后面跟的应该是结论，不是过程，最好注明日期。写成 per our conversation on 12 Oct 才能追溯，否则将来对方可以说不记得。","n":"使用"},{"w":"following up on","z":"就…跟进","c":"邮件","t":"phrase","sc":"正式邮件","e":"I am ____ the access request I submitted last Thursday.","ez":"我在跟进上周四提交的权限申请。","d":["chasing up","checking on","following on"],"df":"following up on 是中性跟进；chasing up 更口语，带催促感；checking on 是查看状态；following on 通常指紧接着某事之后，不表跟进。","tp":"第二次催问时用 following up on 比重新贴一遍原文更礼貌，也不会显得你在指责对方没回。","n":"使用"},{"w":"further to","z":"关于 / 就…（正式开头）","c":"邮件","t":"phrase","sc":"正式邮件","e":"____ your email of 9 October, I confirm that the account has been closed.","ez":"就你 10 月 9 日的邮件，我确认该账户已关闭。","d":["further to","pursuant to","with reference to"],"df":"further to 是英式商务信函常用的开头，表示「就…进一步说明」；pursuant to 是法律用语，依据条款；with reference to 是「关于」，中性正式。","tp":"further to 后面通常接「对方的邮件或某次会议」，用来建立上下文。它比 regarding 更正式，但只在写信开头用。","n":"认读"},{"w":"at your earliest convenience","z":"请尽早","c":"邮件","t":"phrase","sc":"正式邮件","e":"Please review the attached design and reply ____.","ez":"请审阅附件设计并尽早回复。","d":["as soon as possible","at the earliest","when free"],"df":"at your earliest convenience 是礼貌的尽快，不给具体期限；as soon as possible 更急，带压力；at the earliest 是「最早也要到…」，意思相反；when free 太随意。","tp":"它不给期限，所以事情常被忽略。真要快，直接写具体日期；这句适合对方是上级或外部合作方、你不便催的场合。","n":"使用"},{"w":"kindly","z":"请（较正式）","c":"邮件","t":"phrase","sc":"正式邮件","e":"____ confirm receipt of this email by end of day.","ez":"请在今日下班前确认收到本邮件。","d":["please","be so kind as to","be advised"],"df":"kindly 是较正式的「请」，英式商务信函常见；please 是标准通用；be so kind as to 极其正式，几乎不用；be advised 是「特此告知」，不是请求。","tp":"kindly 的语感偏冷，在部分语境里会被读成不满的提醒。内部日常邮件用 please 更自然，对外正式函件才用它。","n":"认读"},{"w":"To whom it may concern","z":"致相关人士","c":"邮件","t":"phrase","sc":"正式邮件","e":"____: this letter confirms that the account was closed on 12 September.","ez":"致相关人士：本函确认该账户已于 9 月 12 日关闭。","d":["Dear Sir or Madam","Dear all","Dear whom"],"df":"To whom it may concern 用于不知道收件人是谁的正式函件；Dear Sir or Madam 是同类替代，用于性别不明；Dear all 用于群发；Dear whom 不成立。","tp":"它的潜台词是「我不知道你是谁」。所以内部邮件或已知道对接人的邮件里用它，会显得疏离甚至冒犯。","n":"认读"},{"w":"Best regards","z":"此致 / 顺祝商祺","c":"邮件","t":"phrase","sc":"正式邮件","e":"____, / Li Wei / Payment Platform Team","ez":"此致，李伟，支付平台组。","d":["Regards","Kind regards","Yours sincerely"],"df":"Best regards 是通用商务结束语；Regards 更简洁中性；Kind regards 偏英式友好；Yours sincerely 用于已知对方姓名的传统正式信函。","tp":"结尾语只影响语气，不影响礼貌程度。真正影响印象的是正文有没有说清「你要对方做什么、什么时候」。","n":"使用"},{"w":"Looking forward to hearing from you","z":"期待回复","c":"邮件","t":"phrase","sc":"正式邮件","e":"____ at your earliest convenience.","ez":"期待你尽早回复。","d":["Looking forward to hear from you","Hope to hear from you","Awaiting your reply"],"df":"looking forward to 后面必须跟动名词 hearing；hope to hear 更轻，也更口语；awaiting your reply 更正式，也略生硬。","tp":"这是中国使用者最常见的语法错误之一：to 在这里是介词，后面只能接 -ing，不能接原形。","n":"使用"},{"w":"Please advise","z":"请指示","c":"邮件","t":"phrase","sc":"正式邮件","e":"The vendor has not confirmed the delivery date. ____ on how to proceed.","ez":"供应商还没确认交付日期，请指示下一步怎么走。","d":["Please advice","Please be advised","Please note"],"df":"please advise 是请给出指示，advise 是动词；please advice 是错误拼写，advice 是名词；please be advised 是特此告知你，是告知而非询问；please note 是请注意。","tp":"advise 是动词，advice 是名词，不能混。please be advised that 后面跟的是你要对方注意的事，不是请求。","n":"使用"},{"w":"acknowledge receipt","z":"确认收到","c":"邮件","t":"phrase","sc":"正式邮件","e":"Please ____ of this email so that we can close the ticket.","ez":"请确认收到本邮件，以便我们关闭工单。","d":["confirm receipt","acknowledge receiving","reply receipt"],"df":"acknowledge receipt 是固定搭配，中间不加 of；confirm receipt 意思相同，更常用；acknowledge receiving 语法可通但不地道；reply receipt 不成立。","tp":"它只要求对方说「收到了」，不要求表态。所以别拿它当成「已同意」的证据，尤其在银行类审批里。","n":"使用"},{"w":"in writing","z":"以书面形式","c":"邮件","t":"phrase","sc":"正式邮件","e":"Any change to the settlement date must be confirmed ____; a phone call is not enough.","ez":"结算日期的任何变更都必须书面确认，打电话不算。","d":["by writing","on paper","in written form"],"df":"in writing 是固定表达「以书面形式」；by writing 语法可通但不地道；on paper 是「理论上」或「纸面上」，容易歧义；in written form 冗余。","tp":"它排除的是口头承诺。银行和合规场景里，口头同意等于没有同意，因为事后无法举证。","n":"使用"},{"w":"CC / BCC","z":"抄送 / 密送","c":"邮件","t":"abbr","sc":"正式邮件","e":"Please ____ the project mailbox so that the ticket is logged automatically.","ez":"请抄送项目邮箱，这样工单会自动登记。","d":["carbon copy","blind copy","copy"],"df":"cc 是抄送，收件人互相可见；bcc 是密送，收件人互不可见；carbon copy 是全称，口语少用；单独用 copy 会产生歧义。","tp":"cc 的社交含义是「让你知道，但不需要你回复」。把需要回复的人放在 cc，是常见失误，出了事对方会说没被要求处理。","n":"使用"},{"w":"FYI","z":"供参考","c":"邮件","t":"abbr","sc":"正式邮件","e":"____: the maintenance window has been moved to Sunday 02:00.","ez":"供参考：维护窗口改到周日凌晨两点。","d":["for your information","for your action","noted"],"df":"FYI 是 for your information，表示告知、不需行动；for your action 恰恰相反，是需要你处理；noted 是已阅，用于回复。","tp":"FYI 是明确信号：不用你做事。反过来说，需要对方做事时千万别用 FYI，否则对方会当成通知放过。","n":"使用"},{"w":"EOD / COB","z":"今日下班前","c":"邮件","t":"abbr","sc":"正式邮件","e":"Please send the signed form by ____ today.","ez":"请在今日下班前把签好的表格发过来。","d":["EOB","EOBD","end of week"],"df":"EOD 是 end of day；COB 是 close of business，更偏营业结束；EOBD 较少见；end of week 是本周内。","tp":"跨时区时这两个词很危险：你的下班点不是对方的下班点。给出具体时间和时区更安全，比如 by 18:00 Beijing time。","n":"使用"},{"w":"tentative","z":"暂定的","c":"邮件","t":"word","sc":"正式邮件","e":"The ____ go-live date is 30 November, pending the security review.","ez":"暂定上线日期是 11 月 30 日，取决于安全评审结果。","d":["temporary","provisional","proposed"],"df":"tentative 是暂定、可能变；temporary 是临时的，会被替换；provisional 是暂时的、需后续确认，偏正式，常用于协议；proposed 是被提议的。","tp":"它是给自己留余地的词。看到它，排期时不要当成承诺；自己写时用它，等于提前声明「这个数还会动」。","n":"认读"},{"w":"pursuant to","z":"依据 / 根据（正式）","c":"邮件","t":"phrase","sc":"正式邮件","e":"____ clause 7.2, either party may terminate with 30 days notice.","ez":"依据第 7.2 条，任何一方可提前 30 天通知终止。","d":["according to","in accordance with","subject to"],"df":"pursuant to 是法律文书用语，依据某条款；according to 是据…所说，日常用；in accordance with 是按照某规定，偏合规；subject to 是以…为条件。","tp":"它几乎只出现在合同和法律函件里。技术邮件里用它，会显得刻意，反而不自然。","n":"认读"},{"w":"hereby","z":"特此","c":"邮件","t":"word","sc":"正式邮件","e":"We ____ confirm that the system passed the security assessment on 10 October.","ez":"我们特此确认系统已于 10 月 10 日通过安全评估。","d":["herein","hereof","thereto"],"df":"hereby 是凭此文件、特此，用于声明生效；herein 是在本文件中；hereof 是关于本文件的；thereto 是向此、附于此后。","tp":"它的作用是让这句话本身产生效力，所以只出现在正式声明里。不能当「这里」用，那不是它的意思。","n":"认读"},{"w":"should you have any questions","z":"如有疑问","c":"邮件","t":"phrase","sc":"正式邮件","e":"____, please do not hesitate to contact me.","ez":"如有疑问，请随时联系我。","d":["if you have any questions","in case of questions","should you have any question"],"df":"should you have 是省略 if 的倒装条件句，更正式；if you have 更通用；in case of 用于万一发生，后接名词；any question 应为复数 questions。","tp":"should 提到句首是省略 if 的倒装，书面语常见。写的时候不能再加 if，写成 if should you 就错了。","n":"认读"},{"w":"please do not hesitate to","z":"请随时…","c":"邮件","t":"phrase","sc":"正式邮件","e":"Please do not hesitate to ____ me if the data looks inconsistent.","ez":"如果数据看着对不上，请随时找我。","d":["feel free to","be free to","do not hesitate to"],"df":"please do not hesitate to 是正式礼貌说法；feel free to 更轻松；be free to 语义不同，是「可以自由地」；省掉 please 会显得生硬。","tp":"这句在母语者看来略老派，但对外沟通是安全的礼貌表达，不会被误解。对内部同事，feel free to 更自然。","n":"认读"},{"w":"gentle reminder","z":"温馨提示 / 温和提醒","c":"邮件","t":"phrase","sc":"正式邮件","e":"This is a ____ that the access request form must be signed by your line manager.","ez":"温和提醒一下，权限申请表需要你的直属主管签字。","d":["friendly reminder","kind reminder","soft reminder"],"df":"gentle reminder 是温和提醒，暗示对方可能忘了；friendly reminder 更常用；kind reminder 有中式英语倾向；soft reminder 不地道。","tp":"它本质是催，但语气缓和。第二次以上催办时用它，比重新贴一遍原文更有效，也不会破坏关系。","n":"使用"},{"w":"noted with thanks","z":"已知悉，谢谢","c":"邮件","t":"phrase","sc":"正式邮件","e":"____, I will update the tracker accordingly.","ez":"已知悉，谢谢，我会相应更新跟踪表。","d":["noted, thanks","received with thanks","well noted"],"df":"noted with thanks 是完整表达；noted, thanks 更口语；received with thanks 强调收到而非知悉；well noted 偏南亚英语习惯。","tp":"这是回复通知类邮件最省事的句式：一句话表明收到，并说明你会做什么。只写 noted 会显得冷淡。","n":"使用"},{"w":"in the meantime","z":"在此期间 / 与此同时","c":"邮件","t":"phrase","sc":"正式邮件","e":"The fix will take two weeks. ____, please use the manual workaround.","ez":"修复要两周，期间请先用手工绕行方案。","d":["meanwhile","at the same time","for the meantime"],"df":"in the meantime 是在这段等待期内；meanwhile 是同一时间，强调并行；at the same time 两者皆可；for the meantime 通常应说 for the time being。","tp":"它后面跟的通常是过渡方案。写邮件时用它，等于明确告诉对方「别干等」，这是它最大的价值。","n":"使用"},{"w":"for your perusal","z":"供您审阅","c":"邮件","t":"phrase","sc":"正式邮件","e":"I have attached the draft policy ____.","ez":"附上政策草稿供你审阅。","d":["for your review","for your reference","for your information"],"df":"for your perusal 是供你仔细阅读，很正式，现代邮件少用；for your review 是请审阅并给意见；for your reference 是供参考，不需回应；for your information 与 FYI 同义。","tp":"perusal 强调通读，不只是看一眼。如果只要对方确认收到，用 for your reference 就够了，用错会让对方以为要给意见。","n":"认读"},{"w":"revert","z":"回复（非标准用法）","c":"邮件","t":"word","sc":"正式邮件","e":"Please ____ with your comments by Friday.","ez":"请在周五前回复意见。","d":["reply","respond","come back"],"df":"revert 在标准英语里是恢复原状，用它表示回复是南亚英语的用法，在英美被视为错误；reply 或 respond 才是标准；come back 更口语。","tp":"你在跨国邮件里可能见到 please revert，那是印度同事的习惯，能懂但不要跟着用。自己写一律用 reply。","n":"认读"}]},{"id":"L3-B","level":"L3","name":"银行系统","desc":"核心、账务、清算、渠道","items":[{"w":"core banking","z":"核心银行系统","c":"核心系统","t":"phrase","sc":"系统文档","e":"Balance updates are written to ____ first, then pushed to the channel systems.","ez":"余额变更先写进核心系统，再推送到渠道系统。","d":["core system","mainframe","back office"],"df":"core banking 指管账户、记账、计息、总账的那套系统，是银行的地基；core system 太泛，什么都能叫；mainframe 说的是主机硬件；back office 是后台部门。","tp":"它的判断标准很简单：账户余额以它为准。凡是余额的最终来源，就是核心。渠道、App、网银都是它的下游。","n":"认读"},{"w":"ledger","z":"总账 / 账簿","c":"核心系统","t":"word","sc":"系统文档","e":"Every posting must hit at least one ____ account, otherwise the entry is rejected.","ez":"每笔记账至少要落一个账簿科目，否则分录会被拒绝。","d":["log","record","register"],"df":"ledger 是正式的会计账簿，按科目归类并保证借贷平衡；log 是运行日志；record 是记录；register 是登记簿。","tp":"ledger 的核心不是「记下来」，而是「借贷必须平」。日志可以不平行，账簿不行。","n":"认读"},{"w":"chart of accounts","z":"会计科目表","c":"核心系统","t":"phrase","sc":"系统文档","e":"The new product needs two new entries in the ____ before it can be booked.","ez":"新产品要能在系统里记账，得先在科目表里加两个科目。","d":["account list","account code","general ledger"],"df":"chart of accounts 是全部科目的定义与层级结构；account list 只是清单；account code 是单个科目号；general ledger 是按科目汇总的总账本体。","tp":"科目表决定了「一笔业务记到哪里」。新产品上不了线，很多时候卡在这一步，而不是代码。","n":"认读"},{"w":"debit","z":"借记","c":"核心系统","t":"word","sc":"业务场景","e":"The system ____ the customer account and credits the internal settlement account.","ez":"系统借记客户账户，贷记内部结算账户。","d":["debt","deduction","withdrawal"],"df":"debit 是会计上的借方，在资产类账户表示增加；deduction 是扣减金额；withdrawal 是取现；debt 是债务，拼写只差一个字母。","tp":"debit 在客户账户上表现为「减少」，在银行自己的资产账户上表现为「增加」。方向取决于账户性质，不是固定朝一个方向。","n":"认读"},{"w":"credit","z":"贷记","c":"核心系统","t":"word","sc":"业务场景","e":"Salary payments are ____ to the account on the value date.","ez":"工资在起息日贷记到账户。","d":["crediting","deposit","loan"],"df":"credit 作动词是贷记；deposit 是存款这个动作或款项；loan 是贷款；credit 作名词还可指信用、授信，要看上下文。","tp":"同一个 credit，在会计里是「贷」，在风控里是「信用」，在信贷里是「授信额度」。读到时先判断它在哪个语境。","n":"认读"},{"w":"posting","z":"记账 / 入账","c":"核心系统","t":"phrase","sc":"系统文档","e":"The transaction is queued for ____ and will not be visible until the batch runs.","ez":"这笔交易排队等待入账，批处理跑完之前看不到。","d":["booking","recording","settlement"],"df":"posting 是把交易正式写进账簿；booking 与它接近，常用于预订或登记；recording 只是记录动作；settlement 是资金结算，不是记账。","tp":"posting 之后余额才变。所以「交易成功」和「已入账」是两个状态，中间可能隔着批处理。","n":"认读"},{"w":"reversal","z":"冲正","c":"核心系统","t":"word","sc":"业务场景","e":"The teller raised a ____ to undo the duplicate posting from this morning.","ez":"柜员发起冲正，撤销今早重复入账的那一笔。","d":["refund","cancellation","rollback"],"df":"reversal 是用一笔反向分录抵消错误的已记账交易，原来那笔仍在账上；refund 是退钱给客户，不针对错账；cancellation 是取消，通常指未记账的交易；rollback 是技术层面的回滚。","tp":"冲正不删原账，是补一笔反向的。这是审计要求：账必须能看出改过什么。所以别指望在系统里「删掉」错账。","n":"使用"},{"w":"account statement","z":"对账单 / 账户流水","c":"核心系统","t":"phrase","sc":"业务场景","e":"The customer requested a six-month ____ for the loan account.","ez":"客户要了一份该贷款账户六个月的流水。","d":["invoice","receipt","balance sheet"],"df":"account statement 是账户在某一期间的全部交易明细；invoice 是发票；receipt 是收据；balance sheet 是资产负债表。","tp":"statement 是「流水」，不是「余额」。只给余额不给流水，客户对不了账。","n":"认读"},{"w":"accrual","z":"计提 / 权责发生制","c":"核心系统","t":"word","sc":"系统文档","e":"Interest is calculated on an ____ basis, so the daily amount is recognised even before it is paid.","ez":"利息按权责发生制计算，即使还没支付，每日金额也已确认。","d":["provision","allocation","deferral"],"df":"accrual 是收入或费用在发生时确认，与现金收付时点无关；provision 是为预计损失计提的准备金；allocation 是分摊；deferral 是递延，正好相反。","tp":"accrual 让账面利润和现金流不一致。看到「已计提未支付」就是这个意思，不是钱没到账出了问题。","n":"认读"},{"w":"available balance","z":"可用余额","c":"核心系统","t":"phrase","sc":"业务场景","e":"The ____ is lower than the ledger balance because of the pending card authorisation.","ez":"可用余额低于账面余额，因为有笔卡预授权还占着额度。","d":["ledger balance","current balance","book balance"],"df":"available balance 是现在能动的钱，已扣除冻结和未清算；ledger balance 和 current balance 是账面上的余额；book balance 同账面余额。","tp":"客户投诉「钱少了」，十有八九是可用余额和账面余额的差别。这不是 bug，是冻结。","n":"使用"},{"w":"hold","z":"冻结 / 占用","c":"核心系统","t":"word","sc":"业务场景","e":"A ____ of 500 is placed on the account until the merchant confirms the amount.","ez":"在商户确认金额之前，账户上冻结了 500。","d":["freeze","block","reserve"],"df":"hold 是临时占用一部分额度，金额仍记在客户名下；freeze 是冻结，通常由司法或风控发起，时间更长；block 是封禁账户；reserve 是保留，偏主动。","tp":"hold 会自己到期释放，freeze 通常需要人解除。这个区别决定了客户问「什么时候能用」时你怎么答。","n":"使用"},{"w":"dormant account","z":"睡眠账户 / 长期不动户","c":"核心系统","t":"phrase","sc":"业务场景","e":"The ____ was reactivated after the customer completed identity verification at the branch.","ez":"客户在网点完成身份核实后，这个长期不动户被重新激活。","d":["inactive account","closed account","frozen account"],"df":"dormant account 是长期无交易但仍存在的账户；inactive account 更泛，可能只是短期没动；closed account 是已销户；frozen account 是被冻结。","tp":"dormant 是按「多久没动」判定的，各机构标准不同，所以别记具体月数。它的后果是限制交易，不是销户。","n":"认读"},{"w":"overdraft","z":"透支","c":"核心系统","t":"word","sc":"业务场景","e":"An unarranged ____ of 120 was created when the direct debit cleared.","ez":"代扣清算时产生了一笔 120 的未经约定透支。","d":["arrears","advance","shortfall"],"df":"overdraft 是账户余额不足仍完成支付形成的负余额；arrears 是应还未还的欠款；advance 是预付款；shortfall 是缺口，不一定形成负余额。","tp":"overdraft 是账户层面的负余额，arrears 是合同层面的逾期未付。同一个客户可以两者都有，但系统里的处理路径不同。","n":"认读"},{"w":"end-of-day","z":"日终处理","c":"核心系统","t":"word","sc":"系统文档","e":"The ____ batch closes the business date; any transaction after that belongs to the next day.","ez":"日终批处理关掉当前营业日，之后的交易算下一天。","d":["cut-off time","midnight","closing"],"df":"end-of-day 是系统关账、跑批、切换营业日的整套流程；cut-off time 是某类业务的受理截止时刻；midnight 只是自然时间点；closing 是关账这个动作。","tp":"日终不是零点，是系统跑批的时刻，可能发生在凌晨也可能在晚上。所以「今天几点算今天」要看日终时间，不是看表。","n":"认读"},{"w":"cut-off time","z":"截止时间","c":"核心系统","t":"phrase","sc":"业务场景","e":"Transfers submitted after the ____ of 16:30 are value-dated the next business day.","ez":"16:30 截止之后提交的转账，起息日算下一个工作日。","d":["deadline","closing time","maturity"],"df":"cut-off time 是业务受理的时点界限，过了就落到下一周期；deadline 是最后期限，带强制性；closing time 是营业结束；maturity 是到期。","tp":"它跟 deadline 的区别在于：过了 cut-off 不是违约，只是「算明天」。这类抱怨多半是客户不知道有这个界线。","n":"使用"},{"w":"batch processing","z":"批处理","c":"核心系统","t":"phrase","sc":"系统文档","e":"Interest and fees are applied during ____, so the balance does not change in real time.","ez":"利息和费用在批处理中计算，所以余额不会实时变化。","d":["real-time processing","stream processing","bulk update"],"df":"batch processing 是攒一批数据定时统一处理；real-time processing 是逐笔即时处理；stream processing 是流式连续处理；bulk update 是批量更新数据这个动作。","tp":"批处理意味着「延迟可见」。客户刚还的钱没显示，很可能不是丢了，是还没到跑批时间。","n":"认读"},{"w":"interest accrual","z":"计息 / 利息计提","c":"核心系统","t":"phrase","sc":"系统文档","e":"____ runs daily at end-of-day using the tiered rate table.","ez":"计息每天日终按分档利率表跑一次。","d":["interest payment","interest capitalisation","rate reset"],"df":"interest accrual 是按天累计应计利息，钱还没付；interest payment 是实际支付；interest capitalisation 是把利息转成本金；rate reset 是重定价。","tp":"计提是「算出来记着」，付息是「真的给」。中间这段时间利息在账上但不进客户可用余额。","n":"认读"},{"w":"suspense account","z":"暂记账户 / 挂账科目","c":"核心系统","t":"phrase","sc":"系统文档","e":"The unmatched incoming payment sits in a ____ until the beneficiary is identified.","ez":"无法匹配的来账先挂在暂记账户，等确认收款人再处理。","d":["pending account","clearing account","error account"],"df":"suspense account 是临时存放去向未定的款项的科目，必须有人清理；clearing account 是清算过渡科目，按流程自动轧平；pending account 不是标准会计术语；error account 更口语。","tp":"挂账科目的余额本身就是问题清单。它长期不平，说明有一批钱没人认领——这是审计必查的地方。","n":"认读"},{"w":"trial balance","z":"试算平衡表","c":"核心系统","t":"phrase","sc":"系统文档","e":"The ____ did not balance after the migration, which blocked the sign-off.","ez":"迁移之后试算平衡表不平，挡住了验收。","d":["balance sheet","ledger","reconciliation"],"df":"trial balance 是列出所有科目余额、用来检验借贷是否相等的一张表；balance sheet 是对外报表；ledger 是账簿本身；reconciliation 是对账动作。","tp":"它是内部检查工具，不是对外报表。迁移后第一件事就是跑它，不平就说明有账丢了。","n":"认读"},{"w":"journal entry","z":"会计分录","c":"核心系统","t":"phrase","sc":"系统文档","e":"The adjustment was booked as a manual ____ outside the normal product flow.","ez":"这笔调整以手工分录入账，走的不是正常产品流程。","d":["transaction record","voucher","log entry"],"df":"journal entry 是借贷双方都写明的记账凭证；transaction record 是业务流水，未必含分录；voucher 是凭证，偏纸质或单据；log entry 是日志条目。","tp":"手工分录是绕过产品的口子，能记账但不留业务痕迹。所以审计看到 manual journal entry 一定会问「为什么」。","n":"认读"},{"w":"acquirer","z":"收单机构","c":"支付清算","t":"word","sc":"业务场景","e":"The ____ forwards the transaction to the issuer for authorisation.","ez":"收单机构把交易转给发卡行做授权。","d":["issuer","merchant","processor"],"df":"acquirer 是替商户收单、与商户签约的一方；issuer 是发卡行，管持卡人；merchant 是商户本身；processor 是处理交易的技术服务商。","tp":"一笔卡交易里，acquirer 站在商户这边，issuer 站在持卡人这边。看错这一层，责任归属就判反了。","n":"认读"},{"w":"issuer","z":"发卡行","c":"支付清算","t":"word","sc":"业务场景","e":"The ____ declined the transaction because the card had been reported lost.","ez":"发卡行拒绝了这笔交易，因为卡片已挂失。","d":["acquirer","cardholder","network"],"df":"issuer 是发卡给持卡人的银行，负责授权和承担信用风险；cardholder 是持卡人；network 是卡组织；acquirer 是收单方。","tp":"被拒付时，最终决定权在 issuer。所以和收单方吵没用，得看发卡行给的原因码。","n":"认读"},{"w":"clearing","z":"清算","c":"支付清算","t":"word","sc":"业务场景","e":"____ exchanges transaction details and calculates the net position between participants.","ez":"清算环节交换交易明细并计算各参与方之间的净额。","d":["settlement","netting","reconciliation"],"df":"clearing 是交换交易信息、核对、算出各方应收应付，资金还没动；settlement 是按清算结果实际划拨资金；netting 是清算中的一个环节，把多笔轧成净额；reconciliation 是对账。","tp":"清算是「算账」，结算是「付钱」。中文里两个词常混用，英文里必须分开，否则读流程文档会完全错位。","n":"使用"},{"w":"settlement","z":"结算","c":"支付清算","t":"word","sc":"业务场景","e":"Final ____ occurs when funds are actually transferred between the banks' accounts at the central bank.","ez":"最终结算发生在资金真正于央行账户间划转的时候。","d":["clearing","payment","transfer"],"df":"settlement 是资金实际划转、债权债务消灭；clearing 是之前的算账环节；payment 是付款行为，可能还没结算；transfer 是转账动作。","tp":"结算完成才叫钱到了。清算完成只代表账算清了。所以「已清算未结算」是个正常状态，不是异常。","n":"使用"},{"w":"netting","z":"净额轧差","c":"支付清算","t":"word","sc":"业务场景","e":"Bilateral ____ reduces a thousand payments into a single net amount per pair of banks.","ez":"双边轧差把一千笔支付压缩成每两家银行之间的一个净额。","d":["netting","offsetting","aggregation","compression"],"df":"netting 是把多笔相互的债权债务抵消算出净额；offsetting 是抵消，更泛；aggregation 是汇总求和，不抵消；compression 是压缩笔数，未必抵消。","tp":"轧差之后，一方的应收和应付合并成一个数，风险敞口也跟着变。所以它既是效率手段，也是风控手段。","n":"认读"},{"w":"RTGS","z":"实时全额清算","c":"支付清算","t":"abbr","sc":"系统文档","e":"Large-value payments go through the ____ system, where each transaction is settled individually in real time.","ez":"大额支付走实时全额清算系统，每笔单独实时结算。","d":["net settlement","DNS","ACH"],"df":"RTGS 是逐笔、实时、全额结算，不轧差；net settlement 是净额结算，批量轧差后结算；DNS 是差额清算系统；ACH 是自动清算所，多为批量。","tp":"全额意味着不省流动性但免掉一方违约传染；净额反过来。看到 RTGS 就知道这套系统的关键词是「实时 + 逐笔」。","n":"认读"},{"w":"payment channel","z":"支付通道","c":"支付清算","t":"phrase","sc":"厂商方案","e":"Each ____ has its own cut-off time and file format, so the adapter layer must normalise them.","ez":"每个支付通道有自己的截止时间和文件格式，适配层要统一。","d":["payment gateway","payment method","route"],"df":"payment channel 是具体的一条资金通路，比如某家银行或某个清算网络；payment gateway 是统一接入的技术门面；payment method 是支付方式，如卡、转账；route 是路由选择。","tp":"通道是「走哪条路」，网关是「从哪个门进」。通道会挂，网关要做的是挂了之后切到另一条。","n":"使用"},{"w":"merchant","z":"商户","c":"支付清算","t":"word","sc":"业务场景","e":"The ____ account was suspended after the chargeback ratio exceeded the scheme threshold.","ez":"商户的拒付率超过卡组织阈值后，商户号被停用。","d":["customer","vendor","retailer"],"df":"merchant 在支付语境里是收款方，与收单机构签约；customer 是付款的客户；vendor 是供应商，偏采购；retailer 是零售商。","tp":"merchant 是「收钱的那一方」，不是「客户」。在支付文档里把 merchant 读成客户，整段逻辑会反。","n":"认读"},{"w":"refund","z":"退款","c":"支付清算","t":"word","sc":"业务场景","e":"A partial ____ of 200 was issued against the original 800 payment.","ez":"针对原 800 的付款，发起了 200 的部分退款。","d":["reversal","void","chargeback"],"df":"refund 是商户主动退钱给持卡人，通常针对已结算交易；reversal 是冲正错误记账；void 是撤销尚未结算的交易；chargeback 是持卡人向发卡行申诉后强制退回。","tp":"refund 是主动的，chargeback 是被动的。前者商户愿意，后者商户要被罚，处理时限也完全不同。","n":"使用"},{"w":"void","z":"撤销（当日交易）","c":"支付清算","t":"word","sc":"业务场景","e":"The cashier ____ the transaction before the batch closed, so no funds moved.","ez":"收银员在跑批前撤销了这笔交易，所以资金没动。","d":["refund","reversal","cancel"],"df":"void 是撤销当天尚未清算的交易，等于没发生过；refund 是已结算后原路退回；reversal 是针对错账的冲正；cancel 更泛。","tp":"void 只在「还没清算」这个窗口内有效。过了时点就只能 refund，两者在报表上完全不同。","n":"使用"},{"w":"pre-authorization","z":"预授权","c":"支付清算","t":"word","sc":"业务场景","e":"The hotel placed a ____ for the estimated stay and captured the actual amount at check-out.","ez":"酒店按预估房费做了预授权，退房时按实际金额请款。","d":["authorization","capture","hold"],"df":"pre-authorization 是先冻结一笔预估金额、之后按实际请款；authorization 是授权这个批准动作；capture 是请款，把冻结变成实际扣款；hold 是占用的状态。","tp":"预授权只是占额度，不进商户账。所以客户看到「已扣款」但商户没收到钱，通常就卡在没 capture。","n":"使用"},{"w":"capture","z":"请款 / 扣款确认","c":"支付清算","t":"word","sc":"业务场景","e":"The merchant must ____ within seven days, otherwise the authorisation expires.","ez":"商户必须在七天内请款，否则授权失效。","d":["settlement","clearing","withdrawal"],"df":"capture 是把已授权的金额正式请款入账；settlement 是资金划转；clearing 是算账；withdrawal 是取现。","tp":"capture 是「确认要这笔钱」。预授权 + 不 capture，等于白占额度，客户会投诉。","n":"使用"},{"w":"remittance","z":"汇款","c":"支付清算","t":"word","sc":"业务场景","e":"The ____ details must include the beneficiary name exactly as it appears on the account.","ez":"汇款信息里的收款人姓名必须与账户上的完全一致。","d":["transfer","payment","wire"],"df":"remittance 是跨境或跨行汇款，附言信息很重要；transfer 是转账，范围更广；payment 是付款；wire 是电汇，特指走 SWIFT 一类通道。","tp":"汇款出问题最常见的原因是信息不全，不是通道慢。所以字段校验放在提交前，比事后追查有用。","n":"认读"},{"w":"beneficiary","z":"收款人","c":"支付清算","t":"word","sc":"业务场景","e":"The ____ bank rejected the payment because the account name did not match.","ez":"收款行以账户名不符为由退回了这笔款。","d":["payer","remitter","counterparty"],"df":"beneficiary 是收钱的一方；payer 是付钱的一方；remitter 是汇款人，常见于跨境；counterparty 是交易对手，方向不定。","tp":"beneficiary 是收款人，remitter 是汇款人。跨境报文里这两个字段填反，钱会退回来还扣手续费。","n":"使用"},{"w":"payer","z":"付款人","c":"支付清算","t":"word","sc":"业务场景","e":"The ____ is charged a fee by the sending bank, while the beneficiary may be charged by the receiving bank.","ez":"付款人被汇出行收费，收款人可能被汇入行收费。","d":["payee","beneficiary","debtor"],"df":"payer 是付款方；payee 是收款方，与 beneficiary 接近但更泛；debtor 是债务人，会计和法律语境用。","tp":"跨境汇款的手续费分「谁付」，SHAR/OUR/BEN 三种模式。看到 payer 被收费，要看是哪一种。","n":"认读"},{"w":"interchange fee","z":"交换费","c":"支付清算","t":"phrase","sc":"业务场景","e":"The ____ is set by the card network and paid by the acquirer to the issuer.","ez":"交换费由卡组织设定，由收单机构支付给发卡行。","d":["service fee","transaction fee","processing fee"],"df":"interchange fee 是卡组织体系里收单方向发卡方支付的分润费用，费率由卡组织定；service fee 是服务费，泛称；transaction fee 是交易手续费；processing fee 是处理费。","tp":"它的方向容易记反：钱从收单（商户侧）流向发卡（持卡人侧）。这是商户费成本的主要构成之一。","n":"认读"},{"w":"settlement cycle","z":"结算周期","c":"支付清算","t":"phrase","sc":"业务场景","e":"The ____ is T+1 for domestic cards but T+3 for some cross-border channels.","ez":"结算周期在国内卡是 T+1，部分跨境通道是 T+3。","d":["billing cycle","cut-off time","value date"],"df":"settlement cycle 是资金结算的周期规律；billing cycle 是账单周期；cut-off time 是每日截止时点；value date 是起息日。","tp":"周期决定商户什么时候拿到钱。谈费率时不谈周期，等于只谈了一半。","n":"认读"},{"w":"T+1","z":"交易日后一个工作日","c":"支付清算","t":"abbr","sc":"业务场景","e":"Funds are available on a ____ basis, excluding weekends and public holidays.","ez":"资金按 T+1 到账，不含周末和法定假日。","d":["D+1","T+0","next day"],"df":"T+1 的 T 是交易日，加一个工作日；D+1 的 D 是自然日，含义不同；T+0 是当日；next day 口语，不含工作日规则。","tp":"T 和 D 的区别会差出整个周末。周五的交易 T+1 是周一，D+1 是周六。","n":"使用"},{"w":"float","z":"在途资金 / 浮存","c":"支付清算","t":"word","sc":"业务场景","e":"The ____ represents funds that have left the payer but not yet reached the beneficiary.","ez":"在途资金指已从付款人扣出、但还没到收款人账上的那部分钱。","d":["buffer","reserve","balance"],"df":"float 是在途未达的资金，是时间差产生的；buffer 是缓冲，用于削峰；reserve 是准备金；balance 是余额。","tp":"float 是时间差，不是差错。它天然存在，规模取决于清算效率。做资金预测时必须把它算进去。","n":"认读"},{"w":"chargeback","z":"拒付 / 退单","c":"支付清算","t":"word","sc":"业务场景","e":"The cardholder filed a ____ claiming the service was never delivered.","ez":"持卡人以服务未提供为由发起拒付。","d":["refund","reversal","dispute"],"df":"chargeback 是持卡人通过发卡行强制退回资金，由卡组织规则裁定；refund 是商户主动退款；reversal 是冲正；dispute 是争议本身，chargeback 是它的正式处理手段。","tp":"chargeback 有严格时限和举证责任，商户输了还要付罚金。所以它是风控指标，不只是客服问题。","n":"使用"},{"w":"credit limit","z":"授信额度","c":"风控合规","t":"phrase","sc":"业务场景","e":"The ____ was reduced after the customer missed two consecutive payments.","ez":"客户连续两次未还款后，授信额度被下调。","d":["exposure","balance","cap"],"df":"credit limit 是允许使用的最高额度；exposure 是当前已承担的风险敞口；balance 是已用余额；cap 是上限，泛指各种封顶。","tp":"额度是「最多能欠多少」，敞口是「已经欠了多少」。风控看的是后者会不会逼近前者。","n":"使用"},{"w":"exposure","z":"敞口 / 风险暴露","c":"风控合规","t":"word","sc":"业务场景","e":"Total ____ to a single counterparty must not exceed ten percent of capital.","ez":"对单一交易对手的风险敞口不得超过资本的百分之十。","d":["risk","liability","position"],"df":"exposure 是可能损失的规模，含已用和未用额度；risk 是风险本身；liability 是负债；position 是持仓，偏交易。","tp":"敞口不只是已经借出去的钱，还包括承诺但未提用的额度。这一点最容易漏。","n":"认读"},{"w":"collateral","z":"抵押物 / 担保品","c":"风控合规","t":"word","sc":"业务场景","e":"The property serves as ____ for the mortgage and must be revalued every two years.","ez":"该房产作为按揭抵押物，每两年要重估一次。","d":["guarantee","security","pledge"],"df":"collateral 是用于担保的资产，可以处置变现；guarantee 是第三方承诺代偿，不一定是资产；security 是担保的总称；pledge 是质押，多用于动产或权利。","tp":"collateral 是可以卖掉的资产，guarantee 是有人替你兜底。一个是物，一个是人。","n":"使用"},{"w":"default","z":"违约 / 未履行","c":"风控合规","t":"word","sc":"业务场景","e":"The loan went into ____ after three missed instalments.","ez":"连续三期未还款后，该笔贷款进入违约状态。","d":["delinquency","breach","overdue"],"df":"default 是达到合同约定的违约认定标准，通常有明确期数门槛；delinquency 是逾期，但还没到违约；breach 是违反条款，范围更广；overdue 只是过期未付。","tp":"delinquency 是过程，default 是结论。逾期不等于违约，但从逾期到违约通常有固定天数。","n":"使用"},{"w":"delinquency","z":"逾期 / 拖欠","c":"风控合规","t":"word","sc":"业务场景","e":"The ____ bucket moved from 30 days to 60 days, which triggered a collections call.","ez":"逾期账龄从 30 天档升到 60 天档，触发了催收电话。","d":["default","arrears","overdue"],"df":"delinquency 是逾期这个状态及其账龄分档；arrears 是应还未还的金额；overdue 是形容词；default 是更严重的违约认定。","tp":"账龄分档（30/60/90 天）是行业惯例做法，具体档位各家不同，别记死数字，记「按账龄分档」这个机制。","n":"认读"},{"w":"overdue","z":"逾期的","c":"风控合规","t":"word","sc":"业务场景","e":"The system sends a reminder when an instalment is one day ____.","ez":"每期还款逾期一天，系统就发提醒。","d":["delinquent","past due","late"],"df":"overdue 是过了应付日期，最通用的形容词；delinquent 更正式，含「已构成拖欠」意味；past due 多见于账单；late 偏口语。","tp":"overdue 是「过期了」，但不一定进逾期分档。分档通常从约定宽限期结束后才开始算。","n":"使用"},{"w":"write-off","z":"核销","c":"风控合规","t":"word","sc":"业务场景","e":"The board approved the ____ of the unsecured balance after all recovery options were exhausted.","ez":"所有追偿手段用尽后，董事会批准核销这笔无抵押余额。","d":["provision","impairment","waiver"],"df":"write-off 是把确认收不回的资产从账上剔除；provision 是提前计提的准备金；impairment 是资产价值下降的会计确认；waiver 是放弃权利，不一定动账。","tp":"核销不等于放弃追索，很多机构核销后仍继续催收。看到 write-off 不要理解成「这笔钱不要了」。","n":"认读"},{"w":"provision","z":"拨备 / 准备金","c":"风控合规","t":"word","sc":"系统文档","e":"A general ____ is held against the whole portfolio, while a specific ____ is raised per exposure.","ez":"组合层面计提一般准备，单笔敞口计提专项准备。","d":["reserve","accrual","allowance"],"df":"provision 是为预计损失计提的准备，冲减当期利润；reserve 是储备，用途更广；accrual 是应计费用；allowance 是备抵科目，与 provision 常互换使用。","tp":"拨备是「提前认损」，钱还在，但利润已经扣了。所以拨备高的年份分红会低。","n":"认读"},{"w":"impairment","z":"减值","c":"风控合规","t":"word","sc":"系统文档","e":"The model applies a forward-looking ____ to the loan book each quarter.","ez":"模型每季度对贷款组合计提前瞻性减值。","d":["depreciation","provision","write-down"],"df":"impairment 是资产可收回金额低于账面价值的减值，适用面广；depreciation 专指固定资产折旧；provision 是为已知风险计提；write-down 是减值的账面动作。","tp":"减值是「这个东西值不了账上那么多钱了」，拨备是「我为可能的损失先留一笔」。两者会互相影响，但不是同一件事。","n":"认读"},{"w":"AML","z":"反洗钱","c":"风控合规","t":"abbr","sc":"监管报送","e":"The ____ programme covers customer due diligence, transaction monitoring and reporting.","ez":"反洗钱体系包括客户尽职调查、交易监测和报告。","d":["fraud prevention","KYC","compliance"],"df":"AML 是反洗钱的整体框架，含 KYC、监测、报告；KYC 是其中的客户识别环节；fraud prevention 是防欺诈，目标不同；compliance 是合规，范围更大。","tp":"KYC 只是 AML 的第一步。文档里说「满足 KYC」不等于「满足 AML」，后者还要监测和报送。","n":"认读"},{"w":"KYC","z":"了解你的客户","c":"风控合规","t":"abbr","sc":"监管报送","e":"____ refresh is required periodically, and more often for high-risk customers.","ez":"客户信息要定期重新核实，高风险客户频率更高。","d":["AML","CDD","onboarding"],"df":"KYC 是识别并核实客户身份的过程；CDD 是客户尽职调查，是 KYC 的正式说法，深度更高；onboarding 是开户接入；AML 是更大的框架。","tp":"KYC 不是开户时做一次就完，它是持续义务。客户信息过期，账上仍能交易，但已经是合规缺口。","n":"认读"},{"w":"STR","z":"可疑交易报告","c":"风控合规","t":"abbr","sc":"监管报送","e":"An ____ must be filed with the financial intelligence unit within the statutory window.","ez":"必须在法定时限内向金融情报机构提交可疑交易报告。","d":["SAR","CTR","incident report"],"df":"STR 与 SAR 都是可疑交易报告，不同司法辖区用词不同；CTR 是大额交易报告，按金额门槛触发，不涉及可疑判断；incident report 是内部事件报告。","tp":"STR 是「我觉得可疑」，CTR 是「金额超了」。前者靠判断，后者靠规则，别混。报送后通常不得告知客户。","n":"认读"},{"w":"sanctions screening","z":"制裁名单筛查","c":"风控合规","t":"phrase","sc":"监管报送","e":"Every payment is subject to ____ before release, including name and country checks.","ez":"每笔付款放行前都要做制裁名单筛查，包括姓名和国别。","d":["AML screening","blacklist check","due diligence"],"df":"sanctions screening 是比对制裁名单，命中即拦截，法律强制；blacklist check 更泛；AML screening 范围更宽，含可疑行为；due diligence 是调查过程。","tp":"制裁筛查是硬拦截，不看意图；反洗钱监测看的是行为模式。前者命中就必须停，没有商量空间。","n":"认读"},{"w":"watchlist","z":"监控名单","c":"风控合规","t":"word","sc":"监管报送","e":"A false positive on the ____ requires documented clearance before the payment proceeds.","ez":"监控名单误命中要有书面排除记录，付款才能继续。","d":["blacklist","sanctions list","blocklist"],"df":"watchlist 是需要关注的名单，命中后要评估，不一定拒绝；sanctions list 是法定制裁名单，命中通常必须拒绝；blacklist 泛称；blocklist 是禁止访问名单。","tp":"watchlist 命中是「要查」，sanctions 命中是「要停」。把前者当后者会误伤客户，反过来是合规事故。","n":"认读"},{"w":"threshold","z":"阈值 / 门槛","c":"风控合规","t":"word","sc":"监管报送","e":"Transactions above the ____ are reported automatically, regardless of suspicion.","ez":"超过阈值的交易自动上报，不论是否可疑。","d":["limit","cap","quota"],"df":"threshold 是触发某个动作的临界值；limit 是允许的上限；cap 是封顶；quota 是配额。","tp":"阈值是「到了就触发」，上限是「不能超过」。前者管上报，后者管拦截。","n":"使用"},{"w":"authorisation","z":"授权 / 审批","c":"风控合规","t":"word","sc":"业务场景","e":"The adjustment requires dual ____ because it affects the customer balance directly.","ez":"这笔调整影响客户余额，需要双人授权。","d":["approval","authentication","permission"],"df":"authorisation 是授予某人做某事的权限，也指审批这个动作；approval 是同意，偏决策；authentication 是身份验证；permission 是权限，偏系统层面。","tp":"在支付里 authorization 是「这笔交易被批准」；在管理里是「这个人有权限」。同一个词两个层面，读文档要看主语是谁。","n":"使用"},{"w":"four-eyes principle","z":"双人复核","c":"风控合规","t":"phrase","sc":"业务场景","e":"The ____ requires a second officer to review any manual entry above the threshold.","ez":"双人复核要求超过阈值的任何手工录入都由第二名员工复查。","d":["dual control","segregation of duties","peer review"],"df":"four-eyes principle 是同一操作必须两人分别确认；dual control 强调两人共同才能完成；segregation of duties 是职责分离，防止一人掌握全流程；peer review 是同行评审，多用于代码或文档。","tp":"它的关键是「两个人独立判断」，不是「两个人签字」。后一个人照着前一个人签，形式上合规、实质上失效。","n":"认读"},{"w":"segregation of duties","z":"职责分离","c":"风控合规","t":"phrase","sc":"业务场景","e":"____ prevents the same person from both creating a payee and releasing the payment.","ez":"职责分离防止同一个人既创建收款人又放行付款。","d":["four-eyes principle","access control","rotation"],"df":"segregation of duties 是把不相容的职责分给不同人，是制度设计；four-eyes principle 是单笔操作的双人确认；access control 是权限控制；rotation 是轮岗。","tp":"职责分离是设计层面的（岗位怎么分），双人复核是执行层面的（这一笔谁签）。制度文档里两者常一起出现。","n":"认读"},{"w":"audit trail","z":"审计轨迹","c":"风控合规","t":"phrase","sc":"系统文档","e":"The ____ must record who changed what and when, and must not be editable by application users.","ez":"审计轨迹必须记录谁在何时改了什么，且应用用户不能修改它。","d":["log","history","trace"],"df":"audit trail 是可追溯、可举证、防篡改的操作记录；log 是运行日志，可能滚动覆盖；history 是变更历史，偏功能；trace 是调用链追踪。","tp":"审计轨迹的重点是「不可改」。能被应用账号删除的，只能叫日志，不能叫审计轨迹。","n":"认读"},{"w":"material","z":"重大的","c":"风控合规","t":"word","sc":"监管报送","e":"Any ____ deviation from the policy must be escalated to the risk committee.","ez":"任何重大偏离政策的情况都必须上报风险委员会。","d":["important","significant","major"],"df":"material 是会计和监管语境的「重大」，指足以影响判断或决策；important 是重要，主观；significant 是显著，可指统计意义；major 是主要，偏规模。","tp":"material 有门槛含义：不到这个量级就不必披露。所以说「重大」时必须能说清标准，否则这个词等于没说。","n":"认读"},{"w":"principal","z":"本金","c":"信贷","t":"word","sc":"业务场景","e":"The monthly payment first covers interest, then reduces the ____.","ez":"每月还款先覆盖利息，再冲减本金。","d":["capital","amount","balance"],"df":"principal 是借款本金，与利息相对；capital 是资本，偏股权或监管资本；amount 是金额；balance 是余额，含利息。","tp":"principal 和 interest 是一对。还的钱里哪部分是本金，决定了利息还能不能再产生利息。","n":"使用"},{"w":"interest rate","z":"利率","c":"信贷","t":"phrase","sc":"业务场景","e":"The loan carries a floating ____ linked to the benchmark plus a margin.","ez":"该贷款执行浮动利率，挂钩基准利率加一个利差。","d":["rate of return","APR","yield"],"df":"interest rate 是借款成本；APR 是年化百分率，含费用；yield 是收益率，站在投资方；rate of return 是回报率。","tp":"同一个数字，借款人叫 interest rate，投资人叫 yield。读文档先看站在哪一方。","n":"使用"},{"w":"amortisation","z":"分期摊还","c":"信贷","t":"word","sc":"系统文档","e":"Under the ____ schedule, each payment covers both interest and part of the principal.","ez":"按摊还计划，每期还款同时覆盖利息和一部分本金。","d":["depreciation","instalment","repayment"],"df":"amortisation 是把本金按期分摊偿还，也可指无形资产摊销；depreciation 是固定资产折旧；instalment 是每期还款额；repayment 是还款这个动作。","tp":"等额本息和等额本金都是 amortisation 的不同算法。看到这个词，要看文档给的是哪种摊销方式。","n":"认读"},{"w":"maturity","z":"到期 / 到期日","c":"信贷","t":"word","sc":"业务场景","e":"At ____, the outstanding balance plus accrued interest becomes payable in full.","ez":"到期时，未偿余额加应计利息一次性付清。","d":["due date","expiry","tenor"],"df":"maturity 是金融工具的到期，含本金偿还义务；due date 是某笔款项的应付日；expiry 是失效，多用于合约或卡；tenor 是期限长度。","tp":"maturity 是一个时点，tenor 是一段长度。说「期限三年」是 tenor，「三年后到期」是 maturity。","n":"使用"},{"w":"tenor","z":"期限","c":"信贷","t":"word","sc":"业务场景","e":"The facility has a five-year ____ with a two-year grace period on principal.","ez":"这笔融资期限五年，本金有两年宽限期。","d":["term","duration","maturity"],"df":"tenor 是融资的期限长度，金融行业专用；term 是条款或期限，通用；duration 是持续期间，也用于债券的久期；maturity 是到期时点。","tp":"tenor 在中文里就是「期限多久」，不是「什么时候到期」。这两个信息在合同里通常都写。","n":"认读"},{"w":"drawdown","z":"提款","c":"信贷","t":"word","sc":"业务场景","e":"The borrower may ____ in tranches as long as the total stays within the facility.","ez":"只要总额度不超，借款人可以分批提款。","d":["withdrawal","disbursement","utilisation"],"df":"drawdown 是在已批额度内提用资金，是授信术语；withdrawal 是取款，偏存款账户；disbursement 是放款，站在银行角度；utilisation 是额度使用率。","tp":"drawdown 的前提是「额度已经批了」。所以它和 disbursement 视角不同：一个是借款人取，一个是银行放。","n":"认读"},{"w":"facility","z":"授信额度 / 融资安排","c":"信贷","t":"word","sc":"业务场景","e":"The revolving ____ allows the company to borrow, repay and re-borrow up to the limit.","ez":"循环额度允许公司在限额内借、还、再借。","d":["loan","limit","line"],"df":"facility 是银行给的一整套融资安排，含额度、期限、条件；loan 是具体一笔借款；limit 只是额度数字；line 是额度线，与 facility 接近但更窄。","tp":"facility 是「安排」，loan 是「借的钱」。一个 facility 下面可以有很多笔 loan。","n":"认读"},{"w":"covenant","z":"契约条款 / 约束性承诺","c":"信贷","t":"word","sc":"业务场景","e":"The loan agreement contains a financial ____ requiring the company to keep leverage below three times.","ez":"贷款协议含一条财务约束条款，要求公司杠杆率低于三倍。","d":["condition","clause","warranty"],"df":"covenant 是借款人必须持续满足的承诺性条款，违反即构成违约；condition 是放款前提条件；clause 是合同里任意一条；warranty 是陈述与保证，针对签约时的事实。","tp":"covenant 是「一直要满足」，condition 是「满足才放款」。前者是持续义务，后者是一次性门槛。","n":"认读"},{"w":"guarantor","z":"担保人 / 保证人","c":"信贷","t":"word","sc":"业务场景","e":"The ____ is jointly liable if the borrower fails to repay.","ez":"借款人未能还款时，担保人承担连带责任。","d":["collateral","surety","sponsor"],"df":"guarantor 是提供保证的人；surety 是保证这个角色或保证行为，也指保证人；collateral 是抵押物，是资产；sponsor 是发起方或赞助方。","tp":"担保人是人（或机构），抵押物是资产。追偿顺序和处置方式完全不同。","n":"使用"},{"w":"mortgage","z":"抵押贷款 / 按揭","c":"信贷","t":"word","sc":"业务场景","e":"The ____ is secured on the property, so the bank can repossess it on default.","ez":"该按揭以房产作抵押，违约时银行可以收回房产。","d":["loan","pledge","lien"],"df":"mortgage 特指以不动产作抵押的贷款；pledge 是质押，多指动产或权利；lien 是留置权或优先受偿权；loan 是贷款泛称。","tp":"mortgage 的关键是「抵押物是不动产」。同样有担保，动产质押在法律程序上完全不同。","n":"使用"},{"w":"unsecured loan","z":"无抵押贷款","c":"信贷","t":"phrase","sc":"业务场景","e":"The ____ carries a higher rate because there is no asset to recover.","ez":"无抵押贷款利率更高，因为没有资产可追偿。","d":["secured loan","personal loan","credit line"],"df":"unsecured loan 是没有抵押物、仅凭信用发放的贷款；secured loan 相反；personal loan 可以是无抵押，但不必然；credit line 是额度。","tp":"利率差异来自「违约后能拿回多少」，不是「风险高所以罚你」。理解这一点，才看得懂定价逻辑。","n":"认读"},{"w":"revolving credit","z":"循环信贷","c":"信贷","t":"phrase","sc":"业务场景","e":"With ____, repaid amounts become available again without a new approval.","ez":"循环信贷下，已还的部分自动恢复可用，不需要重新审批。","d":["term loan","instalment loan","overdraft"],"df":"revolving credit 是还款后额度自动恢复；term loan 是一次性发放、按期还本；instalment loan 是分期贷款；overdraft 是账户透支。","tp":"循环的关键是「额度可复用」。信用卡就是典型的循环信贷，而房贷不是。","n":"认读"},{"w":"repayment schedule","z":"还款计划","c":"信贷","t":"phrase","sc":"业务场景","e":"The ____ was restructured to lower the monthly amount and extend the term.","ez":"还款计划被重组，月供降低、期限拉长。","d":["amortisation table","billing cycle","instalment plan"],"df":"repayment schedule 是每期还款的时间和金额安排；amortisation table 是摊还明细表，含每期本金利息拆分；billing cycle 是账单周期；instalment plan 是分期方案。","tp":"重组还款计划意味着「原来还不上了」。所以这个词在风控报表里是预警信号，不是普通的服务调整。","n":"使用"},{"w":"prepayment","z":"提前还款","c":"信贷","t":"word","sc":"业务场景","e":"A ____ penalty applies if the loan is repaid within the first two years.","ez":"贷款在头两年内还清要收提前还款违约金。","d":["part payment","overpayment","settlement"],"df":"prepayment 是提前偿还全部或部分本金；part payment 是部分付款；overpayment 是多付；settlement 是结清，可以是到期正常结清。","tp":"提前还款对银行是「利息收不到了」，所以才有罚金。这条在合同里通常藏得比较深。","n":"使用"},{"w":"arrears","z":"欠款 / 拖欠金额","c":"信贷","t":"word","sc":"业务场景","e":"The account fell into ____ after the third instalment was missed.","ez":"第三期未还后，账户进入欠款状态。","d":["delinquency","default","overdue"],"df":"arrears 是应还未还的金额本身；delinquency 是逾期状态和账龄；default 是违约认定；overdue 是形容词。","tp":"arrears 是「欠了多少钱」，delinquency 是「欠了多久」。催收话术里这两个数字都要报。","n":"认读"},{"w":"rollover","z":"展期 / 续期","c":"信贷","t":"word","sc":"业务场景","e":"A ____ extends the deposit for another twelve months at the rate in force on the maturity date.","ez":"这笔存款按新利率又续了十二个月。","d":["extension","renewal","refinancing"],"df":"rollover 是到期后按新条件续做，资金不实际进出；extension 是延长期限；renewal 是续签；refinancing 是借新还旧，换了债权人或条件。","tp":"rollover 是「同一笔钱接着用」，refinancing 是「借新的还旧的」。后者在报表上会体现为新旧两笔。","n":"认读"},{"w":"disbursement","z":"放款 / 拨付","c":"信贷","t":"word","sc":"业务场景","e":"____ occurs only after all conditions precedent have been satisfied.","ez":"所有放款前提条件满足后才会放款。","d":["drawdown","payment","release"],"df":"disbursement 是银行把款项拨出，站在银行角度；drawdown 是借款人提用，站在客户角度；payment 是付款；release 是释放，多指解除冻结。","tp":"disbursement 是银行的视角，drawdown 是客户的视角，同一笔钱两个词。写接口文档时选哪个，取决于字段在谁的系统里。","n":"使用"},{"w":"underwriting","z":"授信审批 / 承保","c":"信贷","t":"word","sc":"业务场景","e":"____ combines credit scoring, affordability checks and manual review for large exposures.","ez":"授信审批综合信用评分、还款能力核查，大额敞口还要人工复核。","d":["assessment","evaluation","approval"],"df":"underwriting 是评估并决定是否承担风险的完整过程；assessment 是评估，范围更广；evaluation 是评价；approval 只是最后那一步。","tp":"underwriting 在保险里是「承保」，在信贷里是「审批」。同一个词，行业不同，动作不同。","n":"认读"},{"w":"credit scoring","z":"信用评分","c":"信贷","t":"phrase","sc":"系统文档","e":"The ____ model outputs a score that maps to a risk grade and an approval policy.","ez":"信用评分模型输出一个分数，映射到风险等级和审批策略。","d":["credit rating","rating scale","risk grade"],"df":"credit scoring 是针对个人或小微的量化打分，多为统计模型；credit rating 是评级机构对发行人的等级评定；rating scale 是等级刻度；risk grade 是风险分级。","tp":"评分是「算出来的数」，评级是「评出来的等级」。前者可以每天跑，后者通常定期调整。","n":"认读"},{"w":"NPL","z":"不良贷款","c":"信贷","t":"abbr","sc":"监管报送","e":"The ____ ratio is reported monthly and is a key supervisory indicator.","ez":"不良贷款率按月报送，是核心监管指标。","d":["bad debt","overdue loan","provision"],"df":"NPL 是按监管口径认定的不良贷款，通常以逾期天数划分；bad debt 是已确认收不回的债；overdue loan 只是逾期，未必进入不良；provision 是计提的准备。","tp":"不良的认定口径由监管规定，不是银行自己定。所以看不同机构的不良率，要先确认口径是否一致。","n":"认读"},{"w":"regulatory reporting","z":"监管报送","c":"监管报送","t":"phrase","sc":"监管报送","e":"____ failures are treated as compliance incidents and must be remediated within a fixed window.","ez":"监管报送失败会被认定为合规事件，必须在固定时限内整改。","d":["regulatory filing","statutory report","disclosure"],"df":"regulatory reporting 是向监管机构定期报送数据的整体工作；regulatory filing 更偏单次申报；statutory report 是法定报表；disclosure 是对外披露，对象可能是市场。","tp":"报送的对象是监管，披露的对象是市场。同一份数据可能两边都要，但口径和时限不同。","n":"使用"},{"w":"submission","z":"报送 / 提交","c":"监管报送","t":"word","sc":"监管报送","e":"The ____ was rejected because two mandatory fields were left blank.","ez":"报送被退回，因为两个必填字段为空。","d":["filing","delivery","upload"],"df":"submission 是提交这个动作或提交物，监管语境常用；filing 是备案或申报；delivery 是交付；upload 只是上传。","tp":"submission 被退回不等于失败，通常还有补报窗口。所以第一反应应该是查退回原因，不是改数据重发。","n":"使用"},{"w":"filing","z":"备案 / 申报","c":"监管报送","t":"word","sc":"监管报送","e":"The new product requires a ____ with the regulator before it can be marketed.","ez":"新产品要先向监管备案才能推广。","d":["submission","registration","notification"],"df":"filing 是向监管报备的行为，可能是事前也可能是事后；registration 是登记注册，取得资格；notification 是通知，义务更轻；submission 是提交动作。","tp":"filing 有时是「先备案后做」，有时是「做完再报」。这两种在流程上差别很大，看文档要看清时点。","n":"认读"},{"w":"reporting period","z":"报告期","c":"监管报送","t":"phrase","sc":"监管报送","e":"Data must be as at the end of the ____, not as at the run date.","ez":"数据必须取报告期末的时点，而不是跑批当天的时点。","d":["billing cycle","accounting period","cut-off"],"df":"reporting period 是报送覆盖的时间区间；accounting period 是会计期间；billing cycle 是账单周期；cut-off 是截止时点。","tp":"报告期和跑批日是两回事。取错时点是最常见的报送错误，而且很难发现，因为数看起来是对的。","n":"使用"},{"w":"reporting entity","z":"报送主体","c":"监管报送","t":"phrase","sc":"监管报送","e":"Each ____ reports on a standalone basis unless a waiver for consolidated reporting is granted.","ez":"各报送主体独立报送，除非获批按并表口径报送。","d":["legal entity","branch","group"],"df":"reporting entity 是承担报送义务的法律主体；legal entity 是法律实体，范围相同但更泛；branch 是分支机构，通常并入法人；group 是集团，对应并表口径。","tp":"报送主体决定了「谁来报、报什么范围」。分子行和并表两套口径，数字对不上往往是这个原因。","n":"认读"},{"w":"statutory","z":"法定的","c":"监管报送","t":"word","sc":"监管报送","e":"The ____ audit must be completed within four months of the financial year end.","ez":"法定审计必须在财年结束后四个月内完成。","d":["regulatory","mandatory","legal"],"df":"statutory 是由法律明文规定的；regulatory 是监管要求的，可能来自规章而非法律；mandatory 是强制的，来源不限；legal 是合法的或法律的。","tp":"statutory 强调「法律写的」，regulatory 强调「监管要的」。前者违反是违法，后者违反通常是行政处罚。","n":"认读"},{"w":"supervisory","z":"监管的","c":"监管报送","t":"word","sc":"监管报送","e":"The ____ review focused on data quality and the timeliness of submissions.","ez":"监管检查重点是数据质量和报送及时性。","d":["regulatory","statutory","oversight"],"df":"supervisory 是监管机构行使监督职能的，常与 review、authority 搭配；regulatory 是监管规定层面的；statutory 是法律层面的；oversight 是监督这个职能本身。","tp":"监管机构叫 supervisory authority，监管规定叫 regulatory requirement。搭配是固定的，不要互换。","n":"认读"},{"w":"regulator","z":"监管机构","c":"监管报送","t":"word","sc":"监管报送","e":"The ____ issued a circular requiring daily liquidity reporting from next quarter.","ez":"监管下发通知，要求下季度起按日报送流动性数据。","d":["supervisor","authority","government"],"df":"regulator 是制定并执行规则的监管机构；supervisor 是具体行使监督职能的一方，常可互换；authority 更泛；government 是政府。","tp":"在金融语境里 regulator 和 supervisor 经常指同一个机构，但前者强调「定规则」，后者强调「查执行」。","n":"使用"},{"w":"circular","z":"监管通知 / 通函","c":"监管报送","t":"word","sc":"监管报送","e":"The ____ sets out the new calculation method and takes effect on 1 January.","ez":"该通函规定了新的计算方法，明年一月一日起生效。","d":["notice","guideline","bulletin"],"df":"circular 是监管下发的正式文件，有编号和生效日，具有约束力；notice 更泛；guideline 是指导性文件，通常不强制；bulletin 是公报，多为信息通报。","tp":"circular 是要照着做的，guideline 是建议照着做。分不清这两者，会在合规评估时低估工作量。","n":"认读"},{"w":"compliance","z":"合规","c":"监管报送","t":"word","sc":"监管报送","e":"____ is assessed against both local rules and group policy, and the stricter one applies.","ez":"合规要同时对照本地规定和集团政策，从严适用。","d":["conformity","adherence","governance"],"df":"compliance 是遵守外部规则和内部制度的状态与职能；conformity 偏产品符合标准；adherence 是坚持遵守某规则；governance 是治理结构。","tp":"合规不是「没被罚」，是「有证据证明你按规则做了」。所以它极度依赖留痕。","n":"使用"},{"w":"attestation","z":"声明 / 鉴证","c":"监管报送","t":"word","sc":"监管报送","e":"The annual ____ confirms that the submitted data is complete and accurate.","ez":"年度声明用于确认报送数据完整准确。","d":["certification","declaration","assurance"],"df":"attestation 是有签署人承担责任的正式声明；certification 是认证，通常由第三方发证；declaration 是宣告，责任较轻；assurance 是保证，多指审计提供的保证程度。","tp":"签了 attestation 就是个人担责。所以它签署前一定有一轮内部核对，不会随手签。","n":"认读"},{"w":"remediation","z":"整改","c":"监管报送","t":"word","sc":"监管报送","e":"A ____ plan with dated milestones was submitted to address the findings.","ez":"针对检查发现的问题提交了带时间节点的整改计划。","d":["rectification","correction","resolution"],"df":"remediation 是消除问题根源的整改，含计划和验证；rectification 是纠正，偏把错的改对；correction 是修正单个错误；resolution 是解决。","tp":"监管语境里通用的是 remediation。rectification 在英文材料里出现频率低得多，别按中文直译套过去。","n":"使用"},{"w":"restatement","z":"重述（财务报表）","c":"监管报送","t":"word","sc":"监管报送","e":"The error led to a ____ of the prior year figures.","ez":"该错误导致上年数据被重述。","d":["revision","adjustment","correction"],"df":"restatement 是对已公布报表的正式重新表述，属于重大事件；revision 是修订，可以是常规更新；adjustment 是调整分录；correction 是更正单个错误。","tp":"restatement 意味着「之前公布的数字错了」，会引发外部关注。所以内部一般慎用这个词。","n":"认读"},{"w":"disclosure","z":"披露","c":"监管报送","t":"word","sc":"监管报送","e":"The ____ requirements cover related-party transactions and off-balance-sheet exposures.","ez":"披露要求覆盖关联交易和表外敞口。","d":["reporting","publication","announcement"],"df":"disclosure 是向外部公开信息，对象是投资者和公众；reporting 是向监管报送，对象是监管；publication 是发布；announcement 是公告。","tp":"报送是对监管，披露是对市场。同一件事两边都要做，但内容深度和时点不同。","n":"认读"},{"w":"materiality","z":"重要性水平","c":"监管报送","t":"word","sc":"监管报送","e":"The ____ threshold determines whether the misstatement must be corrected or merely noted.","ez":"重要性门槛决定了差错必须更正还是只需记录。","d":["significance","threshold","relevance"],"df":"materiality 是判断「是否足以影响使用者决策」的量化标准；significance 是显著性，无固定标准；threshold 是任意临界值；relevance 是相关性。","tp":"重要性是「多错才算错」。有了它，才不必为每一分钱返工；没有它，就会被无限细节拖死。","n":"认读"},{"w":"grace period","z":"宽限期","c":"监管报送","t":"phrase","sc":"业务场景","e":"Interest continues to accrue during the ____, although no payment is due.","ez":"宽限期内不用还款，但利息仍在计提。","d":["extension","moratorium","deferral"],"df":"grace period 是允许延迟履行且不视为违约的期间；extension 是延长期限；moratorium 是暂停履行，多为监管统一安排；deferral 是递延，偏会计。","tp":"宽限期免的是「违约」，不是「利息」。客户以为不用还就没成本，是最常见的误解。","n":"使用"},{"w":"penalty","z":"罚款 / 违约金","c":"监管报送","t":"word","sc":"监管报送","e":"Late submission attracts a ____ calculated per day of delay.","ez":"逾期报送按延迟天数计收罚款。","d":["fine","sanction","charge"],"df":"penalty 是违约或违规的处罚，可以是罚金也可以是其他后果；fine 特指罚金；sanction 是制裁，含更广的措施；charge 是费用，不含惩罚意味。","tp":"penalty 不一定只是钱，也可能是业务限制。看到它要看条款里写的是哪一种。","n":"使用"},{"w":"wind down","z":"有序退出 / 逐步关停","c":"监管报送","t":"phrase","sc":"厂商方案","e":"The regulator required an orderly ____ plan before approving the exit.","ez":"监管在批准退出前要求提交有序退出方案。","d":["shut down","phase out","decommission"],"df":"wind down 是有序地逐步停止业务，兼顾客户和债务处置；shut down 是关闭，可能突然；phase out 是逐步淘汰产品或功能；decommission 是系统退役。","tp":"wind down 的关键是「有序」，即先安置客户和存量业务。它跟直接关停是两种完全不同的监管态度。","n":"认读"},{"w":"on-site inspection","z":"现场检查","c":"监管报送","t":"phrase","sc":"监管报送","e":"During the ____, the team traced sample transactions end to end.","ez":"现场检查期间，检查组对抽样交易做了端到端追溯。","d":["audit","review","off-site surveillance"],"df":"on-site inspection 是监管人员到机构现场检查，可调阅原始凭证；audit 是审计，可以是内部或外部；review 是审阅，力度更轻；off-site surveillance 是非现场监管，靠报送数据。","tp":"现场检查要拿原始凭证，非现场监管只看报表。所以前者暴露的问题更具体，也更难提前准备。","n":"认读"},{"w":"off-site surveillance","z":"非现场监管","c":"监管报送","t":"phrase","sc":"监管报送","e":"____ relies on submitted data, so reporting errors can trigger a follow-up inquiry.","ez":"非现场监管依赖报送数据，所以报送错误会引来问询。","d":["on-site inspection","monitoring","oversight"],"df":"off-site surveillance 是监管通过报送数据和指标分析远程监控；on-site inspection 是到现场；monitoring 是监测，主体可以是任何一方；oversight 是监督职能。","tp":"报送数据质量直接决定非现场监管的判断。数据错了，监管看到的是另一个你。","n":"认读"},{"w":"interface specification","z":"接口规范","c":"接口与厂商","t":"phrase","sc":"接口文档","e":"The ____ defines field length, format and mandatory flags for every message.","ez":"接口规范定义了每个报文的字段长度、格式和必填标记。","d":["API document","data dictionary","schema"],"df":"interface specification 是双方约定的完整接口文档，含字段、格式、异常；API document 偏技术说明；data dictionary 只有字段定义；schema 是结构定义。","tp":"规范里最容易被忽略的是「异常怎么回」。只写正常流程的接口文档，联调时一定卡住。","n":"使用"},{"w":"endpoint","z":"端点 / 接口地址","c":"接口与厂商","t":"word","sc":"接口文档","e":"Each ____ requires a separate certificate and has its own rate limit.","ez":"每个端点要单独配证书，还有各自的限流。","d":["URL","port","route"],"df":"endpoint 是一个具体可调用的服务地址，含协议、路径和用途；URL 只是地址字符串；port 是端口；route 是路由规则。","tp":"一个系统可以有几十个 endpoint，运维和安全的配置是逐个做的。所以「接口通了」不等于「所有接口都通了」。","n":"使用"},{"w":"signature","z":"签名","c":"接口与厂商","t":"word","sc":"接口文档","e":"The request must carry a ____ computed over the sorted parameters using the shared secret.","ez":"请求必须携带签名，用共享密钥对排序后的参数计算。","d":["token","hash","certificate"],"df":"signature 是用于验证来源和完整性的加密摘要；token 是身份凭证；hash 是散列值，不含密钥；certificate 是证书，用于建立信任链。","tp":"签名防的是「内容被改」和「冒充发送方」，不防「被看到」。所以加密和签名是两件不同的事，缺一不可。","n":"使用"},{"w":"certificate","z":"证书","c":"接口与厂商","t":"word","sc":"接口文档","e":"The ____ expires in thirty days and must be renewed before the cutover.","ez":"证书三十天后到期，切换前必须续期。","d":["key","signature","credential"],"df":"certificate 是绑定身份的公钥文件，由 CA 签发，有有效期；key 是密钥本身；signature 是签名值；credential 是凭证的总称。","tp":"证书过期是最典型的「什么都没改却突然全挂」。所以监控要盯到期日，不是盯错误率。","n":"使用"},{"w":"UAT","z":"用户验收测试","c":"接口与厂商","t":"abbr","sc":"厂商方案","e":"____ is performed by business users against real scenarios, not by the delivery team.","ez":"用户验收测试由业务人员按真实场景执行，不是交付团队自己测。","d":["SIT","regression test","smoke test"],"df":"UAT 是业务方确认系统满足需求；SIT 是系统集成测试，验证各系统之间能否正确交互；regression test 是回归测试；smoke test 是冒烟测试。","tp":"UAT 和 SIT 的区别在「谁来测、测什么」：SIT 测系统之间通不通，UAT 测业务上对不对。顺序是 SIT 在前。","n":"使用"},{"w":"SIT","z":"系统集成测试","c":"接口与厂商","t":"abbr","sc":"厂商方案","e":"____ covers the end-to-end flow across the core, payment and reporting systems.","ez":"系统集成测试覆盖核心、支付和报送系统之间的端到端流程。","d":["UAT","unit test","integration test"],"df":"SIT 是在接近生产的集成环境里验证多系统协同；unit test 是单元测试；integration test 更泛；UAT 是业务验收。","tp":"SIT 由技术团队主导，UAT 由业务主导。很多项目把两者合并做，结果是业务问题和技术问题混在一起查不清。","n":"使用"},{"w":"production cutover","z":"生产切换","c":"接口与厂商","t":"phrase","sc":"厂商方案","e":"The ____ plan includes a rollback window of four hours after go-live.","ez":"生产切换方案包含上线后四小时的回滚窗口。","d":["go-live","migration","deployment"],"df":"production cutover 是从旧系统整体切到新系统的动作，含数据、接口、权限；go-live 是正式对外提供服务这个时点；migration 是数据迁移；deployment 是部署代码。","tp":"cutover 是「换系统」，go-live 是「开张」。可以先 cutover 但不对外，这段观察期很关键。","n":"使用"},{"w":"go-live","z":"上线","c":"接口与厂商","t":"word","sc":"厂商方案","e":"The ____ date is fixed by the business, so any delay has a commercial cost.","ez":"上线日期由业务定死，任何延期都有商务成本。","d":["cutover","rollout","release"],"df":"go-live 是系统正式对外提供服务的那一天；cutover 是技术切换过程；rollout 是分批推广；release 是一个发布版本。","tp":"go-live 是一个时点，rollout 是一个过程。银行项目常常先小范围 go-live，再逐步 rollout。","n":"使用"},{"w":"defect","z":"缺陷","c":"接口与厂商","t":"word","sc":"厂商方案","e":"A severity-one ____ blocks the release; severity three can be deferred to the next patch.","ez":"一级缺陷阻塞发布，三级可以延到下个补丁。","d":["bug","error","issue"],"df":"defect 是产品与需求或规范不符，是正式的质量术语；bug 是口语，指程序错误；error 是错误状态；issue 是泛称。","tp":"缺陷等级的判定标准是「影响多大、有无绕过方案」，不是「改起来多难」。所以低等级缺陷也可能很难修。","n":"使用"},{"w":"root cause","z":"根因","c":"接口与厂商","t":"phrase","sc":"厂商方案","e":"The ____ was a missing index, but the trigger was a change in the query plan.","ez":"根因是缺索引，但触发点是执行计划变了。","d":["reason","cause","source"],"df":"root cause 是导致问题的根本原因，修它才能防复发；cause 是原因，可以是直接原因；reason 是理由，含主观；source 是来源。","tp":"直接原因和根因经常不是一回事。只修直接原因，同一个问题会以另一种形式再来一次。","n":"使用"},{"w":"vendor","z":"供应商 / 厂商","c":"接口与厂商","t":"word","sc":"厂商方案","e":"The ____ is responsible for the fix, but we own the acceptance test.","ez":"修复由厂商负责，但验收测试由我们做。","d":["supplier","partner","provider"],"df":"vendor 是提供产品或服务的第三方，含合同责任；supplier 偏供应链供货；partner 是合作伙伴，关系更对等；provider 是服务提供方，多用于云服务。","tp":"vendor 的关系由合同界定，partner 的关系由共同利益界定。用错词会影响对方对责任范围的预期。","n":"使用"},{"w":"statement of work","z":"工作说明书","c":"接口与厂商","t":"phrase","sc":"厂商方案","e":"The ____ defines deliverables, acceptance criteria and payment milestones.","ez":"工作说明书定义了交付物、验收标准和付款节点。","d":["contract","proposal","scope document"],"df":"statement of work 是合同附件，明确做什么、怎么验收、何时付款；contract 是合同主体；proposal 是投标方案；scope document 是范围说明。","tp":"SOW 是把商务承诺变成可验收条目的文件。它写得含糊，项目后期就一定会为「这算不算在范围内」吵架。","n":"使用"},{"w":"proof of concept","z":"概念验证","c":"接口与厂商","t":"phrase","sc":"厂商方案","e":"The ____ showed the approach works, but it did not prove it scales.","ez":"概念验证说明方案可行，但没证明能撑住规模。","d":["pilot","prototype","trial"],"df":"proof of concept 是验证技术可行性，通常不做生产级工程；pilot 是小范围真实用户试运行；prototype 是原型，重在形；trial 是试用。","tp":"POC 通过只代表「原理成立」，不代表「能上线」。把 POC 当成品评估，是选型时最常见的误判。","n":"认读"},{"w":"adapter","z":"适配器","c":"接口与厂商","t":"word","sc":"接口文档","e":"Each channel has its own ____ that translates between the internal model and the external format.","ez":"每个通道有自己的适配器，负责内部模型和外部格式之间的转换。","d":["connector","gateway","middleware"],"df":"adapter 是做协议或格式转换的组件；connector 是连接器，偏建立连接；gateway 是统一入口，还含路由和限流；middleware 是中间件的统称。","tp":"适配器的职责是「翻译」，不是「决策」。适配器里塞业务判断，后面会非常难维护。","n":"认读"},{"w":"middleware","z":"中间件","c":"接口与厂商","t":"word","sc":"系统文档","e":"The ____ layer handles message routing, retries and transformation between systems.","ez":"中间件层负责系统之间的消息路由、重试和转换。","d":["framework","platform","infrastructure"],"df":"middleware 是介于应用和操作系统之间、提供通用能力的软件；framework 是开发框架；platform 是平台，含运行环境和工具链；infrastructure 是基础设施。","tp":"中间件的价值是「不用每个应用都自己实现一遍」。但它也意味着故障点集中，所以它的监控必须比应用更细。","n":"认读"},{"w":"message queue","z":"消息队列","c":"接口与厂商","t":"phrase","sc":"系统文档","e":"The ____ decouples the payment service from downstream notification, but introduces duplicate delivery.","ez":"消息队列把支付服务和下游通知解耦，但引入了重复投递。","d":["buffer","channel","topic"],"df":"message queue 是异步传递消息的组件；buffer 是缓冲，目的不同；channel 是通道；topic 是发布订阅模型里的主题。","tp":"队列的代价是「至少一次投递」，所以消费端必须幂等。这一条是设计与测试的必查项。","n":"使用"},{"w":"data mapping","z":"字段映射","c":"接口与厂商","t":"phrase","sc":"接口文档","e":"The ____ document lists every source field and its target field, including transformation rules.","ez":"字段映射文档列出所有源字段和目标字段，含转换规则。","d":["field list","schema","transformation"],"df":"data mapping 是源与目标字段的对应关系及转换规则；field list 只是字段清单；schema 是结构定义；transformation 只描述转换本身。","tp":"映射文档是联调时唯一能对质的依据。少了它，双方各按自己理解开发，最后一定对不上。","n":"使用"},{"w":"onboarding","z":"接入 / 入驻","c":"接口与厂商","t":"word","sc":"厂商方案","e":"Merchant ____ includes contract signing, technical integration and a certification test.","ez":"商户接入包括签约、技术对接和认证测试。","d":["registration","integration","activation"],"df":"onboarding 是让新方接入并跑通全流程的完整过程；registration 是注册登记；integration 是技术对接，只是其中一步；activation 是激活。","tp":"onboarding 是一段有始有终的流程，不是「开个账号」。它的结束标志通常是第一笔真实交易成功。","n":"使用"},{"w":"decommission","z":"退役 / 下线","c":"接口与厂商","t":"word","sc":"厂商方案","e":"The legacy system will be ____ six months after the new platform is stable.","ez":"新平台稳定运行六个月后，老系统退役。","d":["shut down","retire","phase out"],"df":"decommission 是系统正式停止服务并完成资产与数据处置；retire 与它接近，偏资产视角；shut down 是关机或关停；phase out 是逐步淘汰。","tp":"退役的前提是「没有调用方了」。所以退役前必须确认流量为零，否则会静默失败。","n":"认读"},{"w":"parallel run","z":"并行运行","c":"接口与厂商","t":"phrase","sc":"厂商方案","e":"During the ____, both systems process the same input and the outputs are compared daily.","ez":"并行运行期间，两套系统处理同样的输入，每天比对结果。","d":["dual run","shadow mode","pilot"],"df":"parallel run 是新旧系统同时处理真实业务并比对结果；dual run 与它基本同义；shadow mode 是新系统只算不产出；pilot 是小范围试运行。","tp":"并行运行的成本是双倍，但它是唯一能证明「新系统算得对」的方式。银行核心切换几乎必做。","n":"认读"}]},{"id":"L3-J","level":"L3","name":"京东后台","desc":"订单、库存、履约、售后","items":[{"w":"line item","z":"订单行","c":"订单与交易","t":"phrase","sc":"接口文档","e":"Each ____ is priced and cancelled independently, so a single order can be partially refunded.","ez":"每个订单行独立定价、独立取消，所以一个订单可以部分退款。","d":["order","transaction","entry"],"df":"line item 是订单里的最小可独立处理单元，一个订单含多个 line item；order 是整单；transaction 是一次资金或库存动作；entry 是记账分录。","tp":"拆单、部分退、部分发货都按 line item 走。看到它就要想到「这一条能被单独取消」，而不是整单。","n":"认读"},{"w":"order snapshot","z":"订单快照","c":"订单与交易","t":"phrase","sc":"接口文档","e":"Pricing and address are frozen in the ____; later edits to the product do not change what the customer pays.","ez":"价格和地址在订单快照里冻结，之后改商品不影响客户实付。","d":["backup","version","archive"],"df":"order snapshot 是下单时刻各字段的只读副本，用于事后举证和复算；backup 是系统级数据备份；version 是记录
