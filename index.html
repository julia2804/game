的版本号；archive 是归档存放。","tp":"有快照才能回答「当时到底卖多少钱」。没有快照的系统，改一次价会把历史订单的金额一起改掉，对账时说不清。","n":"认读"},{"w":"order routing","z":"订单路由","c":"订单与交易","t":"phrase","sc":"系统文档","e":"____ decides which warehouse ships the order based on stock, distance and cost.","ez":"订单路由根据库存、距离和成本决定由哪个仓发货。","d":["dispatching","load balancing","assignment"],"df":"order routing 是在多个仓之间选仓的业务规则；dispatching 是发货动作本身；load balancing 是技术层把请求分到多台机器；assignment 是泛指指派。","tp":"路由错了，会出现「有货的仓不发、没货的仓接单」。查超卖先看路由规则，不要只盯库存数。","n":"认读"},{"w":"split order","z":"拆单","c":"订单与交易","t":"phrase","sc":"业务场景","e":"The order was ____ because the two items ship from different warehouses.","ez":"因为两件商品从不同仓发货，订单被拆开。","d":["merge","cancel","divide"],"df":"split order 是按仓、按时效把一个订单拆成多个子单；merge 是反方向合并；cancel 是取消；divide 只表示分割，不含业务规则。","tp":"拆单之后「一个订单」对客户是一个、对系统是多个，运费和发票都可能跟着变。测拆单要把运费一起测。","n":"使用"},{"w":"backorder","z":"缺货待补订单","c":"订单与交易","t":"word","sc":"业务场景","e":"Items marked as ____ will ship once the next inbound arrives, at the price shown today.","ez":"标记为缺货待补的商品会在下次入库后按今日价格发出。","d":["stockout","oversell","pre-order"],"df":"backorder 是已经下单、等货到再发；stockout 是当前无货这个状态，不一定有单；oversell 是卖超了；pre-order 是货还没上市就先收单。","tp":"backorder 是「允许你买，但晚点发」，属于业务承诺；stockout 只是「没货」。把两者混为一谈会误接单。国内平台多数直接禁售，这个说法在读海外文档时才会遇到。","n":"认读"},{"w":"oversell","z":"超卖","c":"订单与交易","t":"word","sc":"业务场景","e":"Concurrent checkouts caused an ____ of two units on the same SKU.","ez":"并发下单导致同一 SKU 超卖两件。","d":["undersell","stockout","backorder"],"df":"oversell 是卖出量超过实际可售量；stockout 是货卖完了；backorder 是明知没货仍接单；undersell 是卖得比预期少。","tp":"超卖几乎都是并发扣减没加锁、或扣减不幂等。测超卖不要单线程点，要并发压同一个 SKU。","n":"使用"},{"w":"order state machine","z":"订单状态机","c":"订单与交易","t":"phrase","sc":"系统文档","e":"Every status change must go through the ____; direct updates to the status column are rejected.","ez":"每次状态变更都必须经过订单状态机，直接改状态字段会被拒绝。","d":["workflow","pipeline","scheduler"],"df":"状态机定义合法状态与合法迁移；workflow 是审批流；pipeline 是数据流水线；scheduler 是定时调度。","tp":"有状态机才有「哪些跳转非法」的判定。订单异常里有一半的 bug 是绕过了状态机直接改库。","n":"认读"},{"w":"cancellation window","z":"可取消时限","c":"订单与交易","t":"phrase","sc":"业务场景","e":"The ____ closes once the order is picked in the warehouse.","ez":"订单在仓库拣货后就不能再取消了。","d":["grace period","cut-off time","return window"],"df":"cancellation window 是下单后到出库前可取消的时段；grace period 是宽限期，多用于还款；cut-off time 是当日截单时点；return window 是收货后可退的时段。","tp":"三个「期」常被混为一谈：取消在发货前，退货在收货后。跟客户解释时用错一个，承诺就错了。","n":"使用"},{"w":"payment timeout","z":"支付超时","c":"订单与交易","t":"phrase","sc":"业务场景","e":"After a ____ the order is closed automatically and the reserved stock is released.","ez":"支付超时后订单自动关闭，预留的库存被释放。","d":["latency","expiry","failover"],"df":"payment timeout 是等待付款的业务时限；latency 是系统响应耗时；expiry 是凭证或卡的到期；failover 是故障切换。","tp":"超时关单必须同时释放库存，否则「单关了、库存还占着」，会凭空少卖。这是最常见的库存泄漏点。","n":"使用"},{"w":"cart abandonment","z":"弃购","c":"订单与交易","t":"phrase","sc":"数据看板","e":"Most ____ happens at the shipping fee step, not at the payment step.","ez":"大部分弃购发生在运费这一步，而不是支付这一步。","d":["churn","bounce","dropout"],"df":"cart abandonment 是加购后没下单；churn 是用户长期流失；bounce 是进页面就走；dropout 是流程中途离开，多用于测试或学习场景。","tp":"它衡量的是「差一步」，不等于用户流失。把弃购率当流失率看，会误判用户规模。","n":"认读"},{"w":"checkout funnel","z":"下单漏斗","c":"订单与交易","t":"phrase","sc":"数据看板","e":"The ____ shows where users drop off between the cart page and the payment result.","ez":"下单漏斗显示用户在购物车页到支付结果之间哪一步流失。","d":["pipeline","flow chart","journey map"],"df":"checkout funnel 是按步骤统计转化与流失的数据视图；pipeline 是处理链路；flow chart 是流程图；journey map 是用户体验地图。","tp":"漏斗每一层都必须有埋点，否则只能看到「最后转化率低」，不知道低在哪一步。","n":"认读"},{"w":"conversion rate","z":"转化率","c":"订单与交易","t":"phrase","sc":"数据看板","e":"The ____ is measured per visitor session, not per user, which is why it looks lower than the app report.","ez":"转化率按访问会话算而不是按用户算，所以看起来比 App 报表低。","d":["hit rate","success rate","take-up rate"],"df":"conversion rate 是访问到下单的比例；hit rate 是缓存命中率；success rate 是请求成功比例；take-up rate 是符合条件者中实际使用的比例。","tp":"同一个词在不同报表里分母不同，数字能差一倍。看转化率先问分母是谁。","n":"认读"},{"w":"GMV","z":"成交总额","c":"订单与交易","t":"abbr","sc":"数据看板","e":"____ includes cancelled orders in some reports and excludes them in others, so always check the definition.","ez":"有的报表把取消订单算进 GMV，有的不算，所以先确认口径。","d":["revenue","turnover","sales volume"],"df":"GMV 是成交总额，含未付款、按口径也可能含取消；revenue 是会计口径的确认收入；turnover 是营业额或周转率；sales volume 是销量件数。","tp":"GMV 不是收入。对外说业绩用 GMV，对内算钱用 revenue，两者差着退款、取消和佣金。","n":"认读"},{"w":"AOV","z":"客单价","c":"订单与交易","t":"abbr","sc":"数据看板","e":"Bundling raised ____ even though the number of orders stayed flat.","ez":"组合销售提升了客单价，尽管订单数没变。","d":["ARPU","unit price","basket size"],"df":"AOV 是每单平均金额；ARPU 是每用户平均收入；unit price 是单件价格；basket size 是每单件数。","tp":"AOV 涨了不一定是生意变好，可能只是件数少了、单价高了。它必须和 basket size 一起看。","n":"认读"},{"w":"PDP","z":"商品详情页","c":"订单与交易","t":"abbr","sc":"数据看板","e":"Traffic on the ____ converts three times better than traffic on the category page.","ez":"商品详情页的流量转化率是类目页的三倍。","d":["landing page","storefront","listing"],"df":"PDP 是单个商品的详情页；landing page 是投放落地页，可以是任意页面；storefront 是店铺首页；listing 是商品在平台上的挂牌信息本身。","tp":"PDP 是转化的主战场，接口和埋点最密。口语说「商详」，文档里就是 PDP。","n":"认读"},{"w":"add-to-cart rate","z":"加购率","c":"订单与交易","t":"phrase","sc":"数据看板","e":"An ____ above the category average usually means the price is competitive, not that the page is good.","ez":"加购率高于类目平均，通常说明价格有优势，而不是页面做得好。","d":["click-through rate","conversion rate","bounce rate"],"df":"add-to-cart rate 是访问到加购的比例；CTR 是曝光到点击；conversion rate 是访问到下单；bounce rate 是只看一页就离开的比例。","tp":"加购高但下单低，问题在运费或支付；加购也低，问题在商品或价格。两个数一起看才定位得准。","n":"认读"},{"w":"order lifecycle","z":"订单生命周期","c":"订单与交易","t":"phrase","sc":"系统文档","e":"Notifications are triggered at each stage of the ____, from creation to settlement.","ez":"通知在订单生命周期的每个阶段触发，从创建到结算。","d":["lifespan","duration","SLA"],"df":"order lifecycle 是订单从创建到关闭的全过程及状态集合；lifespan 是存活时长；duration 是持续时间；SLA 是服务时限承诺。","tp":"讨论「订单什么时候算结束」时用的就是这个词。各系统对终态定义不一致，是对账差异的常见来源。","n":"认读"},{"w":"compensating transaction","z":"补偿事务","c":"订单与交易","t":"phrase","sc":"系统文档","e":"If the inventory deduction succeeds but the payment fails, a ____ releases the stock.","ez":"如果扣库存成功但支付失败，就用一笔补偿事务释放库存。","d":["rollback","retry","fallback"],"df":"compensating transaction 是再发一笔反向业务动作来抵消，原操作留在记录里；rollback 是数据库层的原子回滚；retry 是重试同一操作；fallback 是降级到备用方案。","tp":"跨系统没有真正的事务，只能补偿。补偿失败必须有重试和人工兜底，否则数据会长期不一致。","n":"使用"},{"w":"deduplication","z":"去重","c":"订单与交易","t":"word","sc":"系统文档","e":"____ is keyed on the order number, so a retried callback will not create a second record.","ez":"去重以订单号为准，这样重试的回调不会产生第二条记录。","d":["validation","sanitization","throttling"],"df":"deduplication 是识别并丢弃重复请求或记录；validation 是校验格式与规则；sanitization 是清洗非法字符；throttling 是限速。","tp":"去重的关键是「用什么做键」。键选错，重试一次就多一条单。","n":"使用"},{"w":"purchase limit","z":"限购","c":"订单与交易","t":"phrase","sc":"业务场景","e":"A ____ of two units per account is enforced at checkout, not at add to cart.","ez":"每账号限购两件在下单时校验，加购时不校验。","d":["quota","threshold","cap"],"df":"purchase limit 是按人或按单限制购买数量；quota 是配额，多用于资源与额度；threshold 是触发阈值；cap 是上限，泛指。","tp":"限购放在加购环节会误伤（用户先加后删），放在下单才准。测限购要测同一账号多端并发。","n":"使用"},{"w":"SKU","z":"最小库存单位","c":"商品与库存","t":"abbr","sc":"系统文档","e":"Colour and size together define the ____, and stock is tracked at this level.","ez":"颜色和尺码共同决定 SKU，库存按这个粒度管理。","d":["SPU","item","unit"],"df":"SKU 是最小可售、可库存单位，带颜色尺码；SPU 是同一款商品的集合；item 是泛指的条目；unit 是计量单位。","tp":"库存、价格、条码都挂在 SKU 上。说「这个商品没货」时，准确说是某个 SKU 没货。","n":"使用"},{"w":"SPU","z":"标准产品单元","c":"商品与库存","t":"abbr","sc":"系统文档","e":"Reviews and images are shared across the ____, so one bad batch affects all its SKUs.","ez":"评价和图片在 SPU 层共享，所以一个批次出问题会影响它下面所有 SKU。","d":["SKU","product family","category"],"df":"SPU 是款，SKU 是款下的具体规格；product family 是更大的产品系列；category 是类目。","tp":"上下架、评价、搜索聚合在 SPU 层，库存和价格在 SKU 层。搞错层级，接口字段一定对不上。","n":"使用"},{"w":"listing","z":"上架 / 挂牌","c":"商品与库存","t":"word","sc":"业务场景","e":"The product cannot be ____ until its qualification documents are approved.","ez":"资质审核通过前，商品不能上架。","d":["publishing","release","deployment"],"df":"listing 是商品在平台上对外可售；publishing 是发布内容；release 是发版；deployment 是部署。","tp":"国内平台的「上架」是一个带审核的动作，不是把状态字段改成 1。接口里的 on-shelf / off-shelf 说的就是它。","n":"使用"},{"w":"delisting","z":"下架","c":"商品与库存","t":"word","sc":"业务场景","e":"Regulatory review forced a temporary ____ of all units from that supplier.","ez":"监管审查导致该供应商的所有商品被临时下架。","d":["removal","suspension","takedown"],"df":"delisting 是商品从可售变为不可售，可以恢复；removal 是移除记录；suspension 是暂停，多指账号或服务；takedown 是强制删除，多用于侵权内容。","tp":"下架分「商家自己下」和「平台强制下」，对商家考核的影响不同。看日志要分清是谁触发的。","n":"认读"},{"w":"stockout","z":"缺货","c":"商品与库存","t":"word","sc":"业务场景","e":"The ____ lasted four days and cost the listing its search ranking.","ez":"缺货持续四天，导致该商品掉了搜索排名。","d":["backorder","shortage","out-of-stock"],"df":"stockout 是可售库存为零这一段状态；shortage 是供给不足，可以是长期的；out-of-stock 多作形容词或口语；backorder 是缺货仍接单。","tp":"缺货不只是卖不出去，还会掉权重，恢复后流量回不来。补货的时效比补货的量更要紧。","n":"认读"},{"w":"safety stock","z":"安全库存","c":"商品与库存","t":"phrase","sc":"业务场景","e":"____ covers demand variability during the replenishment lead time.","ez":"安全库存用来覆盖补货前置期内的需求波动。","d":["buffer","reserve","threshold"],"df":"safety stock 是为应对波动而常备的库存量；buffer 是泛指缓冲；reserve 是预留，通常已被某订单占用；threshold 是触发补货的警戒线。","tp":"安全库存不是越多越好，它是拿资金换缺货率。这个词出现时，讨论的其实是服务水平。","n":"认读"},{"w":"replenishment","z":"补货","c":"商品与库存","t":"word","sc":"业务场景","e":"Automatic ____ is triggered when available stock falls below the reorder point.","ez":"可用库存低于补货点时自动触发补货。","d":["restocking","refill","procurement"],"df":"replenishment 是把货补到可售位置的全过程；restocking 是重新上货；refill 是重新装满；procurement 是采购，只到入库为止。","tp":"补货含采购、调拨、入库几段，任何一段卡住都表现为「补了但没货卖」。查缺货要看整条链路。","n":"认读"},{"w":"inventory reservation","z":"库存预留","c":"商品与库存","t":"phrase","sc":"接口文档","e":"An ____ is created at checkout and released if the payment does not arrive in time.","ez":"下单时创建库存预留，支付未及时到达则释放。","d":["allocation","lock","hold"],"df":"inventory reservation 是把库存挂到某笔订单名下，物理上还在仓里；allocation 是把库存分配到渠道或区域；lock 是数据库锁；hold 是挂起，语义更泛。","tp":"预留不释放就是库存泄漏。线上最常见的问题就是「单关了、预留还在」。","n":"使用"},{"w":"inventory visibility","z":"库存可见性","c":"商品与库存","t":"phrase","sc":"系统文档","e":"____ across warehouses is what allows the site to promise delivery dates accurately.","ez":"跨仓的库存可见性，才让网站能准确承诺送达日期。","d":["transparency","traceability","monitoring"],"df":"inventory visibility 是各节点库存能否被实时看到；transparency 是信息透明；traceability 是可追溯；monitoring 是监控。","tp":"可见性差，就会「前台显示有货、下单后告诉你要等」。多仓场景下这是承诺时效的根。","n":"认读"},{"w":"shrinkage","z":"损耗","c":"商品与库存","t":"word","sc":"业务场景","e":"Annual ____ from damage and misplacement is written off against the warehouse P&L.","ez":"因破损和错放造成的年度损耗，从仓库损益里核销。","d":["wastage","leakage","attrition"],"df":"shrinkage 是库存账面与实物之差，含失窃、破损、错放；wastage 是变质浪费；leakage 是流失，多用于资金或客户；attrition 是自然减少，多用于人员。","tp":"盘亏盘盈都归到 shrinkage。它不区分原因，所以这个数只能发现问题、不能定位原因。","n":"认读"},{"w":"cycle count","z":"循环盘点","c":"商品与库存","t":"phrase","sc":"业务场景","e":"Instead of a full stocktake, the warehouse runs a ____ on high-value SKUs every week.","ez":"仓库不做全盘，改为每周对高价值 SKU 做循环盘点。","d":["stocktake","audit","reconciliation"],"df":"cycle count 是按计划分批抽盘；stocktake 是全量盘点；audit 是审计，范围更广；reconciliation 是账目核对，不一定数实物。","tp":"循环盘点的目的是持续校准，不是年底一次性对账。它能让差异在还小的时候就被发现。","n":"认读"},{"w":"bin location","z":"库位","c":"商品与库存","t":"phrase","sc":"系统文档","e":"The picker is routed to the ____ shown on the handheld, not the one printed on the shelf label.","ez":"拣货员按手持设备上的库位走，而不是按货架标签上的。","d":["warehouse","shelf","zone"],"df":"bin location 是最小存储位的编码；shelf 是货架；zone 是区域；warehouse 是整仓。","tp":"库位是 WMS 的定位主键。库位不准，拣货就只能靠人记，错发率随之上升。","n":"认读"},{"w":"batch number","z":"批次号","c":"商品与库存","t":"phrase","sc":"接口文档","e":"Returns are traced back by ____ to identify which production run was affected.","ez":"退货按批次号回溯，确认受影响的是哪个生产批次。","d":["serial number","lot code","version"],"df":"batch number 是同一批生产或进货的编号，多个单品共用；serial number 是单件唯一序号；lot code 多数场景与 batch 同义；version 是版本。","tp":"追溯用批次，售后换新用序列号。要召回时找不到批次，只能整类下架。","n":"认读"},{"w":"shelf life","z":"保质期","c":"商品与库存","t":"phrase","sc":"业务场景","e":"Items with less than one third of their ____ left are blocked from the main warehouse.","ez":"剩余保质期不足三分之一的商品不能进主仓。","d":["expiry date","lead time","warranty"],"df":"shelf life 是可存放的总时长；expiry date 是具体到期日；lead time 是前置期；warranty 是保修期。","tp":"shelf life 是「能放多久」，expiry date 是「哪天到期」。收货规则按剩余比例算，用的是前者。","n":"认读"},{"w":"expiry date","z":"到期日","c":"商品与库存","t":"phrase","sc":"业务场景","e":"The system rejects any receipt whose ____ is within ninety days.","ez":"到期日在九十天内的货，系统拒收。","d":["shelf life","maturity","validity"],"df":"expiry date 是商品或凭证的到期日；maturity 是金融工具的到期；validity 是有效期这个性质；shelf life 是可存放时长。","tp":"食品用 expiry date，金融用 maturity，合同用 validity。同一个「到期」，三个词各有归属。","n":"认读"},{"w":"variant","z":"规格","c":"商品与库存","t":"word","sc":"接口文档","e":"Each ____ must carry its own barcode, otherwise the warehouse cannot tell them apart.","ez":"每个规格都必须有自己的条码，否则仓库无法区分。","d":["version","option","variation"],"df":"variant 是可售的具体规格，对应一个 SKU；version 是版本；option 是可选项；variation 是差异本身。","tp":"前台叫「规格」，后台叫 variant，落到 SKU。三层说的是同一件事，接口里常混着出现。","n":"使用"},{"w":"spec sheet","z":"规格表","c":"商品与库存","t":"phrase","sc":"系统文档","e":"The ____ lists weight and dimensions, which the logistics quote depends on.","ez":"规格表列出重量和尺寸，物流报价依赖这些数据。","d":["datasheet","manual","catalogue"],"df":"spec sheet 是参数清单；datasheet 偏电子元器件的详细技术数据；manual 是使用说明；catalogue 是商品目录。","tp":"体积重算错，运费就错。规格表是运费和包装的输入，不是给人看的宣传资料。","n":"认读"},{"w":"category tree","z":"类目树","c":"商品与库存","t":"phrase","sc":"系统文档","e":"A product can sit in only one leaf of the ____, which is why mis-categorisation hides it from search.","ez":"一个商品只能挂在一个叶子类目下，所以类目挂错就搜不到。","d":["taxonomy","menu","hierarchy"],"df":"category tree 是平台的类目层级，带运营规则；taxonomy 是学术上的分类体系；menu 是导航菜单；hierarchy 是泛指层级。","tp":"类目决定佣金率、属性和流量入口。改类目等于改规则，不只是改个分类名。","n":"认读"},{"w":"catalog","z":"商品目录","c":"商品与库存","t":"word","sc":"系统文档","e":"The ____ feed is refreshed nightly, so a new item may take a day to appear in search.","ez":"商品目录每晚刷新，所以新品可能要一天才进搜索。","d":["inventory","listing","registry"],"df":"catalog 是全部商品的主数据集合；inventory 是库存数量；listing 是单个商品的挂牌；registry 是登记册。","tp":"catalog 管「有什么」，inventory 管「有多少」。接口报错说 catalog 不同步，意思是商品主数据没过去，不是没货。","n":"认读"},{"w":"bundle","z":"组合装","c":"商品与库存","t":"word","sc":"业务场景","e":"The ____ is sold as one unit but picks two separate SKUs from stock.","ez":"组合装作为一个单位销售，但要从库存里拣两个不同的 SKU。","d":["package","set","kit"],"df":"bundle 是多个 SKU 打包成一个可售单元，库存仍分别扣减；package 是包装；set 是一套；kit 是配套工具包。","tp":"组合装最容易出的问题是「拆开退」：退一个子件，整单价格怎么算。规则要在商品层写死。","n":"使用"},{"w":"fulfillment","z":"履约","c":"履约与售后","t":"word","sc":"业务场景","e":"____ cost per order is measured from picking to the customer's door.","ez":"每单履约成本从拣货算到客户门口。","d":["delivery","shipment","logistics"],"df":"fulfillment 是从接单到送达的整套动作，含仓储、拣配、发货；delivery 只是末端送达；shipment 是发运的这一批货；logistics 是物流这个职能或行业。","tp":"履约是电商的核心成本项，仓储和配送都在里面。说「履约时效」，指的是从下单到签收。","n":"使用"},{"w":"OMS","z":"订单管理系统","c":"履约与售后","t":"abbr","sc":"系统文档","e":"The ____ sits between the storefront and the warehouse, deciding which order goes to which node.","ez":"OMS 位于前台和仓库之间，决定订单去哪个节点。","d":["ERP","WMS","CRM"],"df":"OMS 管订单的分发与状态；WMS 管仓内作业；ERP 管财务与资源；CRM 管客户。","tp":"出问题先分系统：订单丢了找 OMS，货发不出找 WMS。系统定位错，排查会绕一大圈。","n":"使用"},{"w":"WMS","z":"仓储管理系统","c":"履约与售后","t":"abbr","sc":"系统文档","e":"The ____ assigns pick tasks and confirms each item by scanning the bin.","ez":"WMS 分配拣货任务，通过扫库位逐件确认。","d":["OMS","TMS","ERP"],"df":"WMS 管仓内收货、上架、拣货、复核；OMS 管订单；TMS 管运输；ERP 管账。","tp":"WMS 的操作都是扫码驱动，所以「扫不上」往往不是网络问题，是主数据里的条码和实物不一致。","n":"认读"},{"w":"3PL","z":"第三方物流","c":"履约与售后","t":"abbr","sc":"业务场景","e":"Peak volume is overflowed to a ____ that handles the outer regions.","ez":"大促期间超出能力的量会外溢给一家负责偏远地区的第三方物流。","d":["carrier","forwarder","vendor"],"df":"3PL 提供仓储加配送的综合外包；carrier 只承运；forwarder 是货代，做报关与转运；vendor 是供应商，泛称。","tp":"3PL 既是仓也是运，carrier 只运。合同里混用这两个词，责任边界就说不清。","n":"认读"},{"w":"inbound","z":"入库","c":"履约与售后","t":"word","sc":"系统文档","e":"____ appointments must be booked a day ahead so the dock does not queue.","ez":"入库要提前一天预约，否则月台会排队。","d":["receiving","put-away","intake"],"df":"inbound 是货从外部进入仓的流向；receiving 是收货这个作业环节；put-away 是上架；intake 是接收量。","tp":"inbound 讲流向，receiving 讲动作。看板上的 inbound volume 指的是预计到货量。","n":"认读"},{"w":"outbound","z":"出库","c":"履约与售后","t":"word","sc":"系统文档","e":"____ capacity is the bottleneck during the first hour of a flash sale.","ez":"秒杀开始后的第一个小时，出库能力是瓶颈。","d":["shipping","release","dispatch"],"df":"outbound 是货从仓发往外部的流向；shipping 是运输；release 是放行；dispatch 是发货动作本身。","tp":"出库能力看的是每小时能拣多少单，不是仓库总面积。大促前的容量规划按这个数做。","n":"认读"},{"w":"last-mile delivery","z":"最后一公里","c":"履约与售后","t":"phrase","sc":"业务场景","e":"____ accounts for over half of total delivery cost but only a small share of the distance.","ez":"最后一公里占总配送成本一半以上，但只占很小一段距离。","d":["final delivery","local courier","drop-off"],"df":"last-mile delivery 是从最后一个分拨点到客户手上的这一段；final delivery 是同义的口语说法；local courier 是本地快递员；drop-off 是投放到自提点。","tp":"成本高在「每单都要单独跑一趟」。自提点和驿站的本质，就是在压缩这一段。","n":"认读"},{"w":"lead time","z":"前置期","c":"履约与售后","t":"phrase","sc":"业务场景","e":"Quoted ____ excludes weekends, which is why the promise date moves on a Friday order.","ez":"承诺前置期不含周末，所以周五下的单承诺日期会后移。","d":["cycle time","turnaround","latency"],"df":"lead time 是从下单到可用或送达的总时长；cycle time 是单次作业耗时；turnaround 是周转时间；latency 是系统延迟。","tp":"lead time 是给客户看的承诺，cycle time 是内部效率。两个数常被混着算，结果就是承诺失信。","n":"认读"},{"w":"same-day delivery","z":"当日达","c":"履约与售后","t":"phrase","sc":"业务场景","e":"____ is only offered where the order is placed before the 11 a.m. cut-off.","ez":"只有上午十一点前下的单才提供当日达。","d":["express","next-day","priority"],"df":"same-day delivery 是当天送达；express 是加急，不保证当天；next-day 是次日达；priority 是优先处理，不含时效承诺。","tp":"时效承诺是产品能力，不是快递选项。它绑定了截单时间、仓的位置和运力。","n":"认读"},{"w":"drop shipping","z":"代发","c":"履约与售后","t":"phrase","sc":"业务场景","e":"With ____, the supplier ships directly to the customer and the platform never holds the stock.","ez":"代发模式下供应商直接发给客户，平台不持有库存。","d":["consignment","direct shipment","cross-docking"],"df":"drop shipping 是商家不备货、由上游直发；consignment 是货在平台仓但所有权归供应商；direct shipment 只指直发这个动作；cross-docking 是越库，货过仓不停留。","tp":"代发的库存不在平台，时效和包装都不受控，所以这类订单的差评率明显更高。","n":"使用"},{"w":"reverse logistics","z":"逆向物流","c":"履约与售后","t":"phrase","sc":"业务场景","e":"____ covers returns, exchanges and the disposal of damaged goods.","ez":"逆向物流覆盖退货、换货和残次品处理。","d":["returns","recovery","disposal"],"df":"reverse logistics 是货从客户回到仓或供应商的整套流程；returns 只指退货这一个业务；recovery 是价值回收；disposal 是报废处理。","tp":"逆向的成本常高于正向，因为它无法批量、无法预测。退货率高一个点，利润掉得比想象快。","n":"认读"},{"w":"RMA","z":"退货授权","c":"履约与售后","t":"abbr","sc":"业务场景","e":"No return is accepted without an ____ number printed on the label.","ez":"没有 RMA 号打印在面单上的退货不予受理。","d":["refund","claim","ticket"],"df":"RMA 是批准退货并给出编号的凭据；refund 是退款；claim 是索赔；ticket 是工单。","tp":"RMA 的作用是把「同意退」和「钱退回去」分开：先有授权，再走退款，账才对得上。国内平台多以「退货单号」代替，RMA 是欧美叫法。","n":"认读"},{"w":"after-sales","z":"售后","c":"履约与售后","t":"word","sc":"业务场景","e":"____ requests are routed to the seller first and escalated to the platform after two rejections.","ez":"售后请求先转给商家，被拒两次后升级到平台。","d":["customer service","support","warranty"],"df":"after-sales 是成交之后的服务总称，含退换修；customer service 是客服这个职能；support 是技术支持；warranty 只是保修。","tp":"售后是业务范围，客服是执行方。接口里 after-sales order 是一个独立的单据类型，和订单平级。","n":"使用"},{"w":"return window","z":"退货期","c":"履约与售后","t":"phrase","sc":"业务场景","e":"The ____ is counted from the delivery date, not the order date.","ez":"退货期从签收日算，不是下单日。","d":["cancellation window","grace period","warranty"],"df":"return window 是收货后可退的时段；cancellation window 是发货前可取消的时段；grace period 是宽限期；warranty 是保修期。","tp":"「七天无理由」说的就是它。从哪天开始算经常引起争议，所以签收时间必须准。","n":"使用"},{"w":"exchange","z":"换货","c":"履约与售后","t":"word","sc":"业务场景","e":"An ____ creates a new outbound order and a linked return, so both must be tracked.","ez":"换货会生成一张新的出库单和一张关联退货单，两张都要跟。","d":["replacement","swap","return"],"df":"exchange 是退回原件并发出同款或他款；replacement 是补发，通常不退原件；swap 是调换，偏口语；return 只退不换。","tp":"换货在系统里是两笔单，任何一笔卡住客户都收不到货。测换货要测两张单的关联关系。","n":"使用"},{"w":"warranty","z":"保修","c":"履约与售后","t":"word","sc":"业务场景","e":"____ claims after the first year require the original invoice.","ez":"一年之后的保修申请需要提供原始发票。","d":["guarantee","insurance","after-sales"],"df":"warranty 是厂商对质量的承诺期；guarantee 是保证，可指退款承诺；insurance 是保险；after-sales 是服务范围。","tp":"保修是厂商责任，退货是平台规则。两者时限不同，别用一个数字回答客户。","n":"认读"},{"w":"tracking number","z":"运单号","c":"履约与售后","t":"phrase","sc":"接口文档","e":"The ____ is issued by the carrier and is what the customer actually searches for.","ez":"运单号由承运商生成，客户实际查的是这个号。","d":["order number","waybill","serial number"],"df":"tracking number 是承运商的包裹查询号；waybill 是运单本身，多用于空运海运；order number 是平台订单号；serial number 是设备序列号。","tp":"客户报「查不到物流」，先确认他查的是运单号还是订单号——这两个号在系统里是不同字段。","n":"使用"},{"w":"carrier","z":"承运商","c":"履约与售后","t":"word","sc":"系统文档","e":"Each ____ has its own cut-off hour, so the promise date depends on which one is selected.","ez":"每家承运商有自己的截单时间，所以承诺日期取决于选了谁。","d":["forwarder","courier","3PL"],"df":"carrier 是实际承运的公司；courier 是快递员或快递公司，偏小件；forwarder 是货代，安排运输但不自己运；3PL 是仓储加配送的综合外包方。","tp":"一个订单只选一个 carrier，但可以经过多个分拨。路由规则里配的就是它。","n":"使用"},{"w":"proof of delivery","z":"签收凭证","c":"履约与售后","t":"phrase","sc":"业务场景","e":"Disputes over lost parcels are settled by the ____, which includes a photo and a timestamp.","ez":"丢件争议靠签收凭证裁定，凭证含照片和时间戳。","d":["receipt","invoice","acceptance"],"df":"proof of delivery 是送达的证据，含签收人、时间、照片；receipt 是付款收据；invoice 是发票；acceptance 是验收，多用于项目。","tp":"没有签收凭证，丢件就只能平台赔。所以这块数据要留存足够久，通常长于退货期。","n":"认读"},{"w":"COD","z":"货到付款","c":"履约与售后","t":"abbr","sc":"业务场景","e":"____ orders carry a higher return rate because payment happens after inspection.","ez":"货到付款订单退货率更高，因为付款发生在验货之后。","d":["prepaid","installment","deferred payment"],"df":"COD 是收货时付现或扫码；prepaid 是先付款；installment 是分期；deferred payment 是延期付款。","tp":"COD 的风险在回款：货发了钱可能收不到，所以这类订单的风控阈值更严。","n":"认读"},{"w":"promotion","z":"促销","c":"营销与促销","t":"word","sc":"业务场景","e":"A ____ can stack with a coupon only if the rule explicitly allows it.","ez":"只有规则明确允许时，促销才能和优惠券叠加。","d":["discount","campaign","offer"],"df":"promotion 是促销活动这一整套规则；discount 是降价这个动作或金额；campaign 是营销战役，含传播；offer 是对外给出的条件。","tp":"叠加规则是促销系统最容易出线上事故的地方。听到 promotion 要先问「能不能叠」。","n":"使用"},{"w":"campaign","z":"活动","c":"营销与促销","t":"word","sc":"业务场景","e":"The ____ runs for three days and covers both the app and the mini program.","ez":"活动持续三天，覆盖 App 和小程序。","d":["promotion","event","project"],"df":"campaign 是有时间窗、有主题的营销活动；promotion 偏价格优惠规则；event 是事件；project 是项目。","tp":"campaign 是外壳，promotion 是里面的优惠。一个 campaign 可以挂多个 promotion。","n":"使用"},{"w":"coupon","z":"优惠券","c":"营销与促销","t":"word","sc":"业务场景","e":"The ____ is bound to the account, so it cannot be transferred or resold.","ez":"优惠券绑定账号，不能转让或转卖。","d":["voucher","gift card","rebate"],"df":"coupon 是满减或折扣券；voucher 是代金券，通常抵固定金额；gift card 是储值卡；rebate 是事后返现。","tp":"券的核心是「谁的钱」——平台补还是商家补。这个字段决定结算时谁承担。","n":"使用"},{"w":"voucher","z":"代金券","c":"营销与促销","t":"word","sc":"业务场景","e":"The ____ is redeemed at checkout and reduces the payable amount directly.","ez":"代金券在下单时核销，直接减少应付金额。","d":["coupon","token","credit note"],"df":"voucher 抵固定金额；coupon 可以是折扣或满减；token 是令牌；credit note 是红字单据。","tp":"券和码是两件事：voucher 是钱，token 是凭证。接口里混用会导致核销两次。","n":"认读"},{"w":"flash sale","z":"秒杀","c":"营销与促销","t":"phrase","sc":"大促保障","e":"During a ____, inventory is deducted before payment to avoid overselling.","ez":"秒杀期间先扣库存再支付，避免超卖。","d":["promotion","clearance","auction"],"df":"flash sale 是限时限量的极低库存活动；clearance 是清仓；auction 是拍卖；promotion 是泛称。","tp":"秒杀的技术特征是「瞬时高并发加极少库存」，所以它测的是扣减和限流，不是页面。","n":"使用"},{"w":"pre-order","z":"预售","c":"营销与促销","t":"word","sc":"业务场景","e":"A ____ collects payment now and ships after the production run completes.","ez":"预售现在收款，生产完成后再发货。","d":["backorder","reservation","deposit"],"df":"pre-order 是商品尚未可售时先接单；backorder 是已售罄后仍接单；reservation 是预留；deposit 是定金。","tp":"预售的关键是「什么时候能发」的承诺，不是「能不能买」。承诺日期写错，投诉量会翻倍。","n":"认读"},{"w":"tiered pricing","z":"阶梯定价","c":"营销与促销","t":"phrase","sc":"业务场景","e":"____ gives a lower unit price as quantity increases, which is why the cart total is not linear.","ez":"阶梯定价随数量增加而降低单价，所以购物车总额不是线性的。","d":["volume discount","dynamic pricing","price ladder"],"df":"tiered pricing 是按数量区间定价；volume discount 是按量给的折扣；dynamic pricing 是随供需实时变价；price ladder 是价格阶梯的说法。","tp":"阶梯定价必须跨区间测边界，比如「买 9 件和 10 件」的单价是否按规则跳档。","n":"使用"},{"w":"price protection","z":"价保","c":"营销与促销","t":"phrase","sc":"业务场景","e":"____ refunds the difference if the price drops within seven days of delivery.","ez":"签收七天内降价，价保退还差额。","d":["price match","refund","guarantee"],"df":"price protection 是买后降价补差；price match 是买时匹配他家价格；refund 是退货退款；guarantee 是保证。","tp":"价保是「事后补差」，需要订单快照和价格历史才算得出来。没有价格历史就做不了。","n":"认读"},{"w":"spend threshold","z":"满减门槛","c":"营销与促销","t":"phrase","sc":"业务场景","e":"The coupon applies only when the cart crosses the ____, excluding shipping.","ez":"只有购物车金额过门槛才可用券，运费不计入。","d":["minimum order","cap","quota"],"df":"spend threshold 是触发优惠的金额线；minimum order 是最低起送或起订量；cap 是上限；quota 是配额。","tp":"门槛算不算运费、算不算已打折商品，两条规则不同，用户看到的可用券就不一样。","n":"使用"},{"w":"BOGO","z":"买赠","c":"营销与促销","t":"abbr","sc":"业务场景","e":"____ is implemented as two line items, one priced at zero, which affects how refunds are calculated.","ez":"买赠会拆成两个订单行，其中一行价格为零，这影响退款怎么算。","d":["bundle","gift","sample"],"df":"BOGO 是买一件赠一件的促销形式；bundle 是打包成一个商品卖；gift 是赠品；sample 是试用装。","tp":"赠品那一行价格为零，退货时「退多少钱」就变成规则问题。这是客诉高发点。","n":"认读"},{"w":"loyalty program","z":"会员体系","c":"营销与促销","t":"phrase","sc":"业务场景","e":"The ____ grants free shipping after a spend level is reached in a rolling twelve months.","ez":"会员体系在滚动十二个月内消费达标后给予免运费。","d":["membership","subscription","rewards"],"df":"loyalty program 是按消费行为给权益的体系；membership 是会员身份；subscription 是付费订阅；rewards 是奖励本身。","tp":"会员看的是「权益怎么给」，订阅看的是「按期收费」，两者的续费和退订逻辑完全不同。","n":"认读"},{"w":"points","z":"积分","c":"营销与促销","t":"word","sc":"业务场景","e":"____ expire at the end of the second calendar year after they are earned.","ez":"积分在获得后的第二个自然年末过期。","d":["credits","miles","balance"],"df":"points 是消费累积的虚拟值，可兑权益；credits 是账户余额或信用；miles 是里程，航空场景；balance 是余额。","tp":"积分在账上是负债，不是白给的。过期规则和兑换率一变，财务就要重算。","n":"认读"},{"w":"upsell","z":"向上销售","c":"营销与促销","t":"word","sc":"业务场景","e":"The ____ prompt offers the larger pack at checkout, which lifts AOV without extra traffic.","ez":"向上销售在结算页推荐大包装，不增加流量也能提升客单价。","d":["cross-sell","bundle","recommendation"],"df":"upsell 是推荐更贵或更高配的同款；cross-sell 是推荐相关但不同的商品；bundle 是打包；recommendation 是推荐系统输出的泛称。","tp":"upsell 改的是「买哪个版本」，cross-sell 改的是「还买什么」。指标要分开算，否则互相掩盖。","n":"使用"},{"w":"cross-sell","z":"交叉销售","c":"营销与促销","t":"word","sc":"业务场景","e":"____ on the cart page adds accessories that ship from the same warehouse.","ez":"购物车页的交叉销售推荐同仓发货的配件。","d":["upsell","bundling","placement"],"df":"cross-sell 是推荐互补品类；upsell 是推荐更高规格；bundling 是打包定价；placement 是展示位置。","tp":"同仓发货是硬约束——推荐了别的仓的货，运费和时效都会变差。","n":"使用"},{"w":"affiliate","z":"联盟推广","c":"营销与促销","t":"word","sc":"业务场景","e":"____ traffic is tracked by a click identifier that survives for thirty days.","ez":"联盟流量用点击标识追踪，有效期三十天。","d":["referral","partner","reseller"],"df":"affiliate 是按成交付佣金的推广方；referral 是推荐，可以是用户拉用户；partner 是合作伙伴；reseller 是转售商。","tp":"归因窗口（点击标识的有效期）直接决定佣金归谁。改这个参数，等于改分钱规则。","n":"认读"},{"w":"impression","z":"曝光","c":"营销与促销","t":"word","sc":"数据看板","e":"The ad had a million ____ but only four thousand clicks.","ez":"广告有一百万次曝光，但只有四千次点击。","d":["view","reach","visit"],"df":"impression 是广告被展示的次数，同一人可多次；reach 是触达的人数；view 是页面或视频被看；visit 是访问。","tp":"曝光按次算、触达按人算。两个数混用，点击率会算错一个量级。","n":"使用"},{"w":"CTR","z":"点击率","c":"营销与促销","t":"abbr","sc":"数据看板","e":"____ fell after the main image changed, even though the price did not move.","ez":"主图换了之后点击率下降，尽管价格没变。","d":["conversion rate","open rate","engagement"],"df":"CTR 是曝光到点击；conversion rate 是访问到下单；open rate 是邮件打开率；engagement 是互动率。","tp":"CTR 只反映「想不想点」，不反映「买不买」。主图、标题、价格标签都会影响它。","n":"使用"},{"w":"ROAS","z":"广告投产比","c":"营销与促销","t":"abbr","sc":"数据看板","e":"____ is calculated on attributed revenue, so it excludes orders that arrive after the window closes.","ez":"投产比按归因收入算，窗口外到达的订单不计入。","d":["ROI","margin","CPA"],"df":"ROAS 是广告收入除以广告花费；ROI 是利润除以投入；margin 是利润率；CPA 是单次获客成本。","tp":"ROAS 用的是收入不是利润，所以它能大于 1 却仍然亏钱。别拿它当盈亏线。","n":"认读"},{"w":"attribution","z":"归因","c":"营销与促销","t":"word","sc":"数据看板","e":"Under last-click ____, the affiliate gets credit even when the user saw three ads first.","ez":"在末次点击归因下，即使先看了三个广告，佣金也归联盟方。","d":["allocation","tracking","assignment"],"df":"attribution 是功劳归给谁；allocation 是成本或库存的分配；tracking 是追踪行为；assignment 是把任务分给人。","tp":"归因模型决定预算往哪投。换模型不是技术改动，是利益重新分配。","n":"认读"},{"w":"promotional calendar","z":"促销日历","c":"营销与促销","t":"phrase","sc":"大促保障","e":"Every team plans capacity against the ____, so an unlisted campaign is treated as unplanned load.","ez":"各团队按促销日历排容量，没进日历的活动被视为计划外负载。","d":["schedule","roadmap","timeline"],"df":"promotional calendar 是全平台促销活动的时间总表；schedule 是时间安排；roadmap 是产品路线；timeline 是时间线。","tp":"大促保障的起点就是这份日历。不在日历上的活动，压测和扩容都不会覆盖到。","n":"认读"},{"w":"seller","z":"商家","c":"商家与结算","t":"word","sc":"商家沟通","e":"Each ____ is responsible for the accuracy of the declared attributes.","ez":"每个商家对申报属性的准确性负责。","d":["merchant","vendor","supplier"],"df":"seller 是平台上卖货的主体；merchant 多指收单商户，偏支付语境；vendor 是提供货物或服务的一方；supplier 是上游供货方。","tp":"支付文档里的 merchant 是收单商户，电商后台里的 seller 才是商家。同一个中文，两个系统两个词。","n":"使用"},{"w":"storefront","z":"店铺","c":"商家与结算","t":"word","sc":"商家沟通","e":"The ____ rating is recalculated nightly from the past ninety days of orders.","ez":"店铺评分每晚按近九十天订单重算。","d":["shop","page","portal"],"df":"storefront 是商家在平台上的店铺；shop 是泛指店铺；page 是页面；portal 是门户。","tp":"storefront 是商家维度的容器，商品挂在它下面。接口里 store id 和 seller id 常常不是一个。","n":"认读"},{"w":"DSR","z":"店铺评分","c":"商家与结算","t":"abbr","sc":"数据看板","e":"A ____ below the threshold blocks the seller from joining the next campaign.","ez":"店铺评分低于门槛，商家不能参加下一场活动。","d":["rating","score","NPS"],"df":"DSR 是平台对店铺的多项评分，含描述、服务、物流；rating 是单次评价的星级；score 是综合分；NPS 是净推荐值。","tp":"DSR 有多个维度，任一项拖后腿都会影响流量。只看总分看不出问题在哪。各平台维度与算法不同，以平台规则为准。","n":"认读"},{"w":"commission","z":"佣金","c":"商家与结算","t":"word","sc":"商家沟通","e":"The ____ rate depends on the category, and is deducted before the payout is calculated.","ez":"佣金率按类目定，在算打款前先扣掉。","d":["fee","margin","royalty"],"df":"commission 是按成交额抽的佣金；fee 是固定或按次的费用；margin 是毛利；royalty 是授权费。","tp":"佣金和「扣点」是一个东西，合同里叫 commission rate。类目挂错，佣金率就错。","n":"使用"},{"w":"payout","z":"打款","c":"商家与结算","t":"word","sc":"商家沟通","e":"The ____ runs weekly, and only settled orders are included in the batch.","ez":"打款每周跑一次，只有已结算订单进批次。","d":["payment","disbursement","remittance"],"df":"payout 是平台把钱付给商家；payment 是客户付给平台；disbursement 是放款，多用于信贷；remittance 是汇款，多用于跨境。","tp":"三笔钱的流向别混：客户付进来是 payment，平台付出去是 payout，银行间划拨是 remittance。","n":"使用"},{"w":"invoice","z":"发票","c":"商家与结算","t":"word","sc":"商家沟通","e":"The ____ is generated from the order, so a partial return requires a red-letter reversal.","ez":"发票按订单开具，部分退货需要开红字冲销。","d":["receipt","bill","statement"],"df":"invoice 是开票方给付款方的应收凭证；receipt 是收款凭证；bill 是账单，偏消费场景；statement 是期间对账单。","tp":"发票和订单不是一对一，退款要走红冲。最容易出问题的是「钱退了、票没冲」。","n":"使用"},{"w":"VAT invoice","z":"增值税发票","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"A ____ is required before the buyer can deduct the input tax.","ez":"买方要抵扣进项税，必须取得增值税发票。","d":["tax receipt","invoice","fiscal receipt"],"df":"VAT invoice 是增值税发票，专用发票可抵扣；tax receipt 是完税凭证；invoice 是普通发票；fiscal receipt 是财政票据。","tp":"专票能抵税，普票不能。开错类型对方财务会退票，来回一轮就是一周。","n":"认读"},{"w":"credit note","z":"红字发票 / 贷项通知单","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"The ____ reduces the amount owed and must reference the original invoice number.","ez":"红字发票冲减应付金额，必须引用原发票号。","d":["debit note","refund","receipt"],"df":"credit note 是冲减应收的单据，负数方向；debit note 是增加应收；refund 是实际退钱；receipt 是收款凭证。","tp":"红冲是「改账」，退款是「给钱」。只退款不红冲，账永远对不平。国内红字发票须走税务系统，与通用的 credit note 流程不完全一样。","n":"认读"},{"w":"withholding tax","z":"代扣税","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"____ is deducted at source and paid to the tax authority on the seller's behalf.","ez":"代扣税在源头扣除，由平台代商家缴给税务机关。","d":["tariff","duty","levy"],"df":"withholding tax 是支付时预扣的所得税；tariff 是关税；duty 是税费，多指进口；levy 是征收，泛指。","tp":"跨境结算最常见的争议就是「到手怎么少了」，差额多半是这一项。","n":"认读"},{"w":"platform fee","z":"平台服务费","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"The ____ covers storage and technical service and is billed monthly, separate from commission.","ez":"平台服务费覆盖仓储和技术服务，按月收取，与佣金分开。","d":["service charge","handling fee","subscription"],"df":"platform fee 是平台按合同收的综合服务费；service charge 是服务费，餐饮常见；handling fee 是手续费；subscription 是订阅费。","tp":"佣金按成交抽，服务费按期收。一个看成交额，一个看合同。对账要分两条线。","n":"使用"},{"w":"deposit","z":"保证金","c":"商家与结算","t":"word","sc":"商家沟通","e":"The ____ is held against breaches and returned thirty days after the store closes.","ez":"保证金用于抵扣违约，关店三十天后退还。","d":["prepayment","advance","collateral"],"df":"deposit 是押金，可退；prepayment 是预付款，用于抵扣货款；advance 是垫付或预付；collateral 是抵押物，用于融资。","tp":"保证金在平台账上是负债，不是收入。它被扣了商家一定来问，所以扣款原因必须留痕。","n":"认读"},{"w":"deduction","z":"扣款","c":"商家与结算","t":"word","sc":"商家沟通","e":"Each ____ must be tied to a specific order, otherwise the seller can dispute it.","ez":"每笔扣款必须关联到具体订单，否则商家可以申诉。","d":["offset","penalty","chargeback"],"df":"deduction 是从应付款里直接减扣；offset 是抵消，多用于账目对冲；penalty 是罚款；chargeback 是拒付，来自发卡行。","tp":"扣款最怕「无依据」。不能关联到单据的扣款，申诉基本都会成立。","n":"使用"},{"w":"dispute","z":"争议","c":"商家与结算","t":"word","sc":"商家沟通","e":"A ____ freezes the payout until evidence from both sides is reviewed.","ez":"争议会冻结打款，直到双方证据审核完毕。","d":["complaint","claim","appeal"],"df":"dispute 是双方对某笔交易有争议；complaint 是投诉，单向；claim 是索赔，要求赔付；appeal 是申诉或上诉。","tp":"dispute 会冻钱，complaint 不一定。看到 dispute 要按有时限的流程走，超时通常自动判负。","n":"使用"},{"w":"revenue share","z":"分成","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"Under the ____ model, the seller keeps seventy percent of the settled amount.","ez":"分成模式下商家拿结算额的七成。","d":["commission","profit split","rebate"],"df":"revenue share 是按收入比例分成；commission 是按成交抽佣；profit split 是按利润分；rebate 是返点，事后返还。","tp":"分成按收入、抽佣也按收入，但一个在合同里谈、一个在费率表里配。别把两者叠加计算。","n":"认读"},{"w":"net revenue","z":"净收入","c":"商家与结算","t":"phrase","sc":"数据看板","e":"____ is what remains after refunds, commission and platform fees.","ez":"净收入是扣掉退款、佣金和平台费之后剩下的。","d":["gross revenue","GMV","margin"],"df":"net revenue 是扣除各项后的收入；gross revenue 是未扣除的总额；GMV 是成交额；margin 是利润率。","tp":"报表里的「收入」默认指净额，对外宣传用总额或成交额。谈判时要先问口径。","n":"认读"},{"w":"business license","z":"营业执照","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"Onboarding stops until a valid ____ is uploaded and verified.","ez":"营业执照上传并核验通过前，入驻流程无法继续。","d":["permit","certificate","registration"],"df":"business license 是工商登记的经营凭证；permit 是许可证，针对特定行业；certificate 是证书；registration 是登记行为或登记号。","tp":"资质审核的第一道就是它。名称和主体不一致，后面所有合同和开票都会卡住。","n":"认读"},{"w":"qualification review","z":"资质审核","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"The ____ checks category-specific documents such as food or medical permits.","ez":"资质审核检查类目专属文件，比如食品或医疗器械许可。","d":["due diligence","verification","inspection"],"df":"qualification review 是平台对商家资质的审核；due diligence 是尽职调查，用于投资并购；verification 是核验真实性；inspection 是现场检查。","tp":"资质和类目绑定。新增类目要重新审，不是一次通过就永久有效。","n":"认读"},{"w":"settlement account","z":"结算账户","c":"商家与结算","t":"phrase","sc":"商家沟通","e":"Payouts can only go to a ____ registered under the same legal entity.","ez":"打款只能打到同一法人主体登记的结算账户。","d":["bank account","escrow account","current account"],"df":"settlement account 是用于收付结算的账户，需与主体一致；bank account 是泛称；escrow account 是托管账户；current account 是活期账户。","tp":"主体不一致是打款失败的第一原因。测绑卡流程要覆盖「户名与营业执照不一致」这一支。","n":"使用"},{"w":"rebate","z":"返点","c":"商家与结算","t":"word","sc":"商家沟通","e":"The quarterly ____ is calculated on purchase volume and paid as a credit, not cash.","ez":"季度返点按采购量算，以抵扣额度形式发放而非现金。","d":["discount","commission","refund"],"df":"rebate 是事后按量返还；discount 是当场降价；commission 是按成交抽佣；refund 是退款。","tp":"返点是「先按原价走账，事后再返」，所以它不影响当期收入，影响的是下一期。","n":"使用"},{"w":"consignment","z":"寄售","c":"商家与结算","t":"word","sc":"商家沟通","e":"Under ____, the goods sit in our warehouse but the seller retains ownership until sale.","ez":"寄售模式下货在我们仓里，但售出前所有权归供应商。","d":["drop shipping","vendor managed inventory","storage"],"df":"consignment 是货在平台、所有权不转移；drop shipping 是货不在平台、由上游直发；vendor managed inventory 是供应商管库存但通常已转移所有权；storage 只是仓储。","tp":"所有权不转移意味着「卖不掉可以退」。这是库存风险归谁的合同问题，不是系统问题。","n":"认读"},{"w":"peak season","z":"旺季","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"Capacity is provisioned for ____ and released the week after.","ez":"容量按旺季预留，旺季过后一周释放。","d":["peak load","rush hour","high season"],"df":"peak season 是大促这一段业务周期；peak load 是峰值负载这个技术指标；rush hour 是每日高峰；high season 是旅游等行业的旺季。","tp":"peak season 是业务概念，以周计；peak load 是技术概念，以秒计。扩容按业务排期，压测按技术指标。","n":"使用"},{"w":"traffic surge","z":"流量洪峰","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"A ____ at midnight tripled inbound requests within ninety seconds.","ez":"零点流量洪峰让入站请求在九十秒内翻了三倍。","d":["spike","burst","load"],"df":"traffic surge 是持续一段的流量上涨；spike 是瞬时尖刺；burst 是突发；load 是负载。","tp":"surge 要靠扩容，spike 要靠限流挡住。判断错类型，要么白扩容，要么挡不住。","n":"使用"},{"w":"cache warm-up","z":"缓存预热","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"____ before the sale prevents the first thousand requests from all hitting the database.","ez":"开售前预热缓存，避免前一千个请求全部打到数据库。","d":["preload","priming","flush"],"df":"cache warm-up 是把热点数据提前装进缓存；preload 是预加载资源；priming 是启动前的准备；flush 是清空缓存。","tp":"冷缓存加瞬时高并发，就是雪崩的起点。预热是成本最低的一道保险。","n":"使用"},{"w":"load test","z":"压测","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"The ____ ran at three times expected peak and found the connection pool was the limit.","ez":"压测按预期峰值的三倍跑，发现瓶颈在连接池。","d":["stress test","benchmark","soak test"],"df":"load test 是在预期负载下验证表现；stress test 是压到崩溃找极限；benchmark 是基准对比；soak test 是长时间稳定性测试。","tp":"压测回答「能不能扛住」，压力测试回答「什么时候崩」。大促前两个都要做，顺序不能反。","n":"使用"},{"w":"capacity planning","z":"容量规划","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"____ starts from the promotional calendar, not from last year's numbers.","ez":"容量规划从促销日历出发，而不是去年的数字。","d":["sizing","forecasting","scaling"],"df":"capacity planning 是按业务计划推算所需资源；sizing 是确定单机规格；forecasting 是预测；scaling 是扩缩容动作。","tp":"没有日历就没有容量规划，只能事后救火。","n":"认读"},{"w":"feature flag","z":"功能开关","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"The new pricing logic sits behind a ____ so it can be turned off without a release.","ez":"新定价逻辑放在功能开关后面，不发布也能关掉。","d":["toggle","config","switch"],"df":"feature flag 是控制功能是否生效的运行时开关，可灰度；toggle 是开关这个动作或控件；config 是配置；switch 是泛指。","tp":"大促期间「能关」比「能修」重要。上线前先问一句：出问题关得掉吗。","n":"使用"},{"w":"canary release","z":"灰度发布","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"The ____ sent five percent of traffic to the new service for two hours.","ez":"灰度发布把百分之五的流量导到新服务，持续两小时。","d":["blue-green deployment","rolling update","A","B test"],"df":"canary 是按比例逐步放量；blue-green 是两套环境整体切换；rolling update 是逐台替换；A/B test 是对比效果。","tp":"灰度是降风险，A/B 是比效果。目的不同，看的指标也不同。","n":"使用"},{"w":"hot standby","z":"热备","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"A ____ node takes over within seconds, but it doubles the infrastructure cost.","ez":"热备节点能在秒级接管，但基础设施成本翻倍。","d":["cold standby","warm standby","replica"],"df":"hot standby 实时同步、随时接管；warm standby 需启动；cold standby 需部署；replica 是副本，不一定能接管。","tp":"热备是用钱换恢复时间。要不要热备，取决于恢复时间目标，不取决于技术喜好。","n":"认读"},{"w":"disaster recovery","z":"灾备","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"The ____ site is in another region and is tested twice a year.","ez":"灾备站点在另一个地域，每年演练两次。","d":["backup","failover","redundancy"],"df":"disaster recovery 是灾难后的恢复能力与方案；backup 是数据备份；failover 是故障切换动作；redundancy 是冗余。","tp":"有备份不等于有灾备。备份能恢复数据，灾备要能在可接受时间内恢复业务。","n":"使用"},{"w":"RTO","z":"恢复时间目标","c":"大促与稳定性","t":"abbr","sc":"大促保障","e":"The ____ for the order service is fifteen minutes, which rules out manual recovery.","ez":"订单服务的恢复时间目标是十五分钟，这排除了人工恢复。","d":["RPO","SLA","MTTR"],"df":"RTO 是允许业务中断多久；RPO 是允许丢多少数据；SLA 是对外承诺；MTTR 是实际平均修复时间。","tp":"RTO 定方案，RPO 定同步方式。先定 RTO，再谈要不要异地多活。","n":"使用"},{"w":"RPO","z":"恢复点目标","c":"大促与稳定性","t":"abbr","sc":"大促保障","e":"A fifteen-minute ____ means asynchronous replication is acceptable.","ez":"恢复点目标十五分钟，意味着异步复制可以接受。","d":["RTO","retention","backup window"],"df":"RPO 是能容忍丢失多长时间的数据；RTO 是中断时长；retention 是保留期；backup window 是备份窗口。","tp":"RPO 是「丢多少」，RTO 是「停多久」。两个都写进合同，就不能只满足一个。","n":"使用"},{"w":"drill","z":"演练","c":"大促与稳定性","t":"word","sc":"大促保障","e":"The switchover ____ exposed that the DNS record had never been updated.","ez":"切换演练暴露了 DNS 记录从未更新过。","d":["rehearsal","test","exercise"],"df":"drill 是针对特定场景的实操演练；rehearsal 是排练；test 是测试；exercise 是演习，偏泛称。","tp":"演练的价值在于暴露「以为准备好了」的部分。没演练过的预案，等于没有预案。","n":"使用"},{"w":"war room","z":"作战室","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"During the sale, the ____ has one screen per domain and a single person deciding rollbacks.","ez":"大促期间作战室每个域一块屏，由一个人决定是否回滚。","d":["control room","bridge","command center"],"df":"war room 是大促或事故时的集中指挥场所；control room 是控制室；bridge 是电话桥，远程协同；command center 是指挥中心，偏常设。","tp":"作战室的作用是缩短决策链，不是把人聚在一起。没有唯一决策人，聚了也没用。","n":"认读"},{"w":"on-call","z":"值班","c":"大促与稳定性","t":"word","sc":"大促保障","e":"The ____ engineer has fifteen minutes to acknowledge a page before it escalates.","ez":"值班工程师要在十五分钟内响应告警，否则升级。","d":["standby","shift","duty"],"df":"on-call 是待命并响应告警的值班安排；standby 是待命状态；shift 是班次；duty 是职责。","tp":"on-call 的关键指标是响应时间，不是解决时间。响应慢，问题就被拖长了。","n":"使用"},{"w":"incident","z":"事故","c":"大促与稳定性","t":"word","sc":"大促保障","e":"The ____ was declared a P1 because checkout was unavailable for six minutes.","ez":"结算不可用六分钟，事故被定为 P1。","d":["issue","outage","bug"],"df":"incident 是需要协调处理的服务异常事件；issue 是问题，范围更宽；outage 是服务中断这一状态；bug 是代码缺陷。","tp":"incident 有等级、有指挥、有复盘。bug 只是原因之一，不是事件本身。","n":"使用"},{"w":"postmortem","z":"复盘","c":"大促与稳定性","t":"word","sc":"大促保障","e":"The ____ is blameless and must produce at least one preventive action with an owner.","ez":"复盘不追责，且必须产出至少一项带责任人的预防措施。","d":["review","retrospective","root cause analysis"],"df":"postmortem 是事故后的系统性复盘；review 是评审；retrospective 是迭代回顾；root cause analysis 是找根因的方法。","tp":"复盘不产出可执行项，等于没做。判断复盘质量，看下次还会不会犯。","n":"使用"},{"w":"degraded mode","z":"降级模式","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"In ____, recommendations are skipped so that checkout keeps working.","ez":"降级模式下跳过推荐，保证结算可用。","d":["fallback","maintenance mode","read-only mode"],"df":"degraded mode 是牺牲非核心功能保核心链路；fallback 是切到备用方案；maintenance mode 是维护状态；read-only mode 是只读。","tp":"降级的难点是「决定牺牲什么」，这必须在事前定好，事中来不及讨论。","n":"使用"},{"w":"traffic shaping","z":"流量整形","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"____ smooths bursts so downstream services see a steady rate instead of spikes.","ez":"流量整形把突发削平，让下游看到平稳速率而非尖刺。","d":["rate limiting","throttling","load shedding"],"df":"traffic shaping 是调整发送节奏使其平滑；rate limiting 是限制速率上限；throttling 是限流降速；load shedding 是主动丢请求保系统。","tp":"整形是「排队慢慢过」，限流是「超了就不让进」，丢载是「直接扔掉」。三者对用户体验的影响完全不同。","n":"认读"},{"w":"queue depth","z":"队列深度","c":"大促与稳定性","t":"phrase","sc":"系统文档","e":"____ kept climbing while throughput stayed flat, which means consumers were stuck rather than slow.","ez":"队列深度持续上升而吞吐不变，说明消费者卡住了而不是变慢。","d":["backlog","lag","buffer size"],"df":"queue depth 是队列里待处理的消息数；backlog 是积压，业务视角；lag 是滞后时间，多用于同步延迟；buffer size 是缓冲区容量。","tp":"深度涨、吞吐平，是消费端阻塞；两者都涨，是上游过量。看这两个数就能初步定位。","n":"使用"},{"w":"smoke test","z":"冒烟测试","c":"大促与稳定性","t":"phrase","sc":"大促保障","e":"A ____ after each deployment catches broken configuration before traffic is switched.","ez":"每次部署后跑冒烟测试，在切流量前发现配置错误。","d":["sanity check","regression test","health check"],"df":"smoke test 是部署后的最小关键路径验证；sanity check 是快速合理性检查；regression test 是全量回归；health check 是运行时的健康探针。","tp":"冒烟测试只回答「主要功能还活着吗」，不回答「对不对」。它必须跑得快，慢了就没人跑。","n":"使用"}]}]}</script>

<script>
/* ===== 10-store.js ===== */
/* ============================================================
   10-store.js —— 存储层
   ------------------------------------------------------------
   这一层管三件事：
     1. 把「谁 + 学到什么程度」这个结构，安全地写进 localStorage
     2. 读回来，并且在数据损坏 / 缺字段 / 旧版本时能自愈
     3. 导出成文件、从文件导入（换设备、误删图标的唯一救命通道）

   这一层不碰 DOM、不弹提示。出问题只返回错误码，
   由 UI 层决定怎么告诉用户。这样以后加玩法不用改存储逻辑。
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});

  /* ------------------------------------------------------------
     一、存储键名与版本
     ------------------------------------------------------------
     键名带版本号 v1：将来如果结构大改，可以读旧的 v1 数据做迁移，
     再写新的 v2，不会把用户进度直接覆盖丢掉。
     ------------------------------------------------------------ */
  var KEY_MAIN = "wg:v1"; // 主数据
  var KEY_BACKUP = "wg:v1:bak"; // 每次导入前的自动备份
  var SCHEMA = 1; // 当前数据结构版本

  /* ------------------------------------------------------------
     二、数据结构说明（这是整个游戏最重要的一段，改之前请读完）
     ------------------------------------------------------------

     {
       v: 1,                       // 结构版本
       createdAt: 1761... ,        // 这份数据的创建时间（毫秒时间戳）
       activeId: "u1",             // 上次是谁在用
       users: [                    // 使用者列表，最多建议 5 人
         { id: "u1", name: "甲", color: "#2b6cf6" }
       ],
       data: {                     // 以 userId 为键，每人一份独立进度
         "u1": {
           p: {                    // 熟练度表
             "kettle": [3, 1761...]
             //         ^  ^
             //         |  +-- 最后一次练习的时间戳（毫秒）
             //         +----- 熟练度 0~5（0 不存，省体积）
           },
           wrong: { "kettle": 1761... },   // 错词本：答错过的词 + 时间
           days:  { "2026-10-23": [24, 19] }, // 日统计：[总答题数, 答对数]
           last:  { "L1": 0, "L2": 0, "L3": 0 } // 每个等级上次选的是第几个包
         }
       }
     }

     为什么用「英文原词」当键，而不是词在数组里的下标？
       —— 因为词库会加词。加一个新词进去，后面所有词的下标全部 +1，
          存下来的进度就会整体错位到别的词身上（"kettle 的熟练度"
          变成了 "spatula 的熟练度"）。用英文原词当键，加词、删词、
          调顺序都不影响已有进度。这是这个游戏能长期维护的前提。

     为什么熟练度用 [数字, 时间戳] 数组而不是对象？
       —— localStorage 在 iOS 上是按 UTF-16 存的，实际占用是字符数 x2。
          [3,1761000000000] 是 17 个字符，{"l":3,"t":1761000000000}
          是 26 个字符，省 35%。练满全库也就 30KB 左右，
          离 5MB 配额很远，但没理由浪费。

     ------------------------------------------------------------ */

  /* ------------------------------------------------------------
     三、localStorage 可用性探测
     ------------------------------------------------------------
     必须探测的两个原因：
       a) Safari 无痕模式 / 关闭「网站数据」时，访问 localStorage
          会直接抛 SecurityError，不是返回 null。
       b) 本地双击打开 HTML（file://）时，不同浏览器行为不一样，
          Chrome 系会拒绝，Safari 允许。

     探测失败时降级成「内存存储」：游戏照样能玩，
     但关掉页面进度就没了。UI 层必须把这个事实告诉用户，
     否则用户练一小时发现归零，会认为是 bug。
     ------------------------------------------------------------ */
  function probe() {
    try {
      var t = "__wg_probe__";
      window.localStorage.setItem(t, "1");
      window.localStorage.removeItem(t);
      return true;
    } catch (e) {
      return false;
    }
  }

  var hasLS = probe();

  // 降级用的内存存储。key -> 字符串
  var mem = {};
  function rawGet(k) {
    if (hasLS) {
      try {
        return window.localStorage.getItem(k);
      } catch (e) {
        return null;
      }
    }
    return mem[k] === undefined ? null : mem[k];
  }
  function rawSet(k, v) {
    if (hasLS) {
      // 配额满时 setItem 会抛 QuotaExceededError。
      // 这里不吞掉，让上层知道写失败了，可以提示用户导出备份。
      window.localStorage.setItem(k, v);
    } else {
      mem[k] = v;
    }
  }
  function rawDel(k) {
    if (hasLS) {
      try {
        window.localStorage.removeItem(k);
      } catch (e) {}
    } else {
      delete mem[k];
    }
  }

  /* ------------------------------------------------------------
     四、默认结构与「自愈」
     ------------------------------------------------------------
     读回来的数据可能是：
       - 空的（第一次用）
       - 半截的（上次写到一半被系统杀掉）
       - 结构不对的（用户手动改过 / 旧版本）
     全部走 normalize() 补全，保证后面的代码可以放心用，
     不用到处写 if (x && x.p)。
     ------------------------------------------------------------ */

  var COLORS = [
    "#2b6cf6", // 蓝
    "#12a150", // 绿
    "#d97706", // 橙
    "#8b5cf6", // 紫
    "#e5484d", // 红
    "#0891b2", // 青
  ];

  function newUser(name, idx) {
    return {
      id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name,
      color: COLORS[idx % COLORS.length],
    };
  }

  function newUserData() {
    return {
      p: {}, // 熟练度
      wrong: {}, // 错词本
      days: {}, // 日统计
      last: {}, // 每个等级上次进的包
    };
  }

  function emptyDB() {
    var u = newUser("我", 0);
    var d = {};
    d[u.id] = newUserData();
    return {
      v: SCHEMA,
      createdAt: Date.now(),
      activeId: u.id,
      users: [u],
      data: d,
    };
  }

  function isObj(x) {
    return x && typeof x === "object" && !Array.isArray(x);
  }

  function normalize(raw) {
    if (!isObj(raw)) return emptyDB();

    var db = {
      v: SCHEMA,
      createdAt: typeof raw.createdAt === "number" ? raw.createdAt : Date.now(),
      activeId: typeof raw.activeId === "string" ? raw.activeId : "",
      users: [],
      data: {},
    };

    // 使用者列表：只保留结构完整的项，补颜色
    if (Array.isArray(raw.users)) {
      raw.users.forEach(function (u, i) {
        if (!isObj(u) || typeof u.name !== "string" || !u.name) return;
        db.users.push({
          id: typeof u.id === "string" && u.id ? u.id : "u" + i + "_" + Date.now(),
          name: u.name.slice(0, 12),
          color: typeof u.color === "string" ? u.color : COLORS[i % COLORS.length],
        });
      });
    }
    // 一个都没有（首次运行或数据被清空）→ 造一个
    if (!db.users.length) {
      var u0 = newUser("我", 0);
      db.users.push(u0);
      db.activeId = u0.id;
    }

    // 每人进度：字段缺失就补空对象
    db.users.forEach(function (u) {
      var src = isObj(raw.data) && isObj(raw.data[u.id]) ? raw.data[u.id] : {};
      var one = newUserData();
      if (isObj(src.p)) one.p = src.p;
      if (isObj(src.wrong)) one.wrong = src.wrong;
      if (isObj(src.days)) one.days = src.days;
      if (isObj(src.last)) one.last = src.last;
      db.data[u.id] = one;
    });

    // activeId 指向的人可能已被删掉 → 退回第一个
    if (!db.data[db.activeId]) db.activeId = db.users[0].id;

    return db;
  }

  /* ------------------------------------------------------------
     五、加载 / 保存
     ------------------------------------------------------------ */

  var db = null; // 内存中的唯一数据源。所有读操作都走它，不重复读盘。
  var saveState = { ok: true, err: null, count: 0 };

  /**
   * 批量修改模式。
   *
   * 场景：英中匹配配错一次，要同时给「英文那个词」和「中文对应的词」
   * 各记一次错。如果两次都各自写盘，就是两次 48KB 序列化。
   * 套一层 batch，中间只改内存，结束时统一写一次。
   *
   * 用法：
   *   App.store.batch(function () {
   *     App.store.recordAnswer(a, false, 1);
   *     App.store.recordAnswer(b, false, 1);
   *   });
   */
  var batching = 0;

  function batch(fn) {
    batching++;
    try {
      fn();
    } finally {
      batching--;
    }
    if (!batching) save();
  }

  function load() {
    var text = rawGet(KEY_MAIN);
    if (!text) {
      db = emptyDB();
      save(); // 首次运行立刻建库，保证后面 setItem 一定有东西可改
      return db;
    }
    var parsed = null;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      // 数据坏了。最可能的场景：写到一半断电 / 用户手动改了。
      // 处理原则：不直接清空（那是毁掉用户几个月的进度），
      // 先把坏数据原样挪到备份键，再建新库。
      // 万一还能人工救回来，备份还在。
      try {
        rawSet(KEY_BACKUP, text);
      } catch (e2) {}
      parsed = null;
    }
    db = normalize(parsed);
    return db;
  }

  /**
   * 立即写盘。
   *
   * 为什么是「立即」而不是攒 500ms 再写：
   *   背单词每答一题的间隔是 2~3 秒，写一次的耗时（iPad 2019 上
   *   序列化 + setItem 约 3~5ms）只占 0.2%，用户完全无感。
   *   攒着写只会把「最坏丢多少」从 0 题扩大到几百毫秒内的题目，
   *   没有任何收益 —— 这是给高频连点场景准备的优化，这里用不上。
   *
   * 谁调用：
   *   每道题判定完成、修改熟练度之后，立刻调用。
   *   另外页面进入后台时再补一次（见 90-boot.js），防止系统直接杀进程。
   */
  function save() {
    if (!db) return false;
    var text;
    try {
      text = JSON.stringify(db);
    } catch (e) {
      saveState = { ok: false, err: "serialize", count: saveState.count };
      return false;
    }
    try {
      rawSet(KEY_MAIN, text);
      saveState = { ok: true, err: null, count: saveState.count + 1 };
      return true;
    } catch (e) {
      // 最常见的是 QuotaExceededError（配额满）。
      // 走到这里说明数据没写进去，UI 应该提示用户去导出备份，
      // 而不是假装成功 —— 用户以为存了、实际没存，是最坏的体验。
      saveState = { ok: false, err: "quota", count: saveState.count };
      return false;
    }
  }

  /* ------------------------------------------------------------
     六、使用者（档案）管理
     ------------------------------------------------------------
     共用一台 iPad 的场景：两个人进度不同，必须分开记。
     不做密码、不做锁 —— 因为是「不同时使用」，点一下名字就进。
     ------------------------------------------------------------ */

  function users() {
    return db.users;
  }

  function activeUser() {
    for (var i = 0; i < db.users.length; i++) {
      if (db.users[i].id === db.activeId) return db.users[i];
    }
    return db.users[0];
  }

  /** 当前用户的数据容器。所有玩法都通过它读写熟练度。 */
  function me() {
    return db.data[db.activeId];
  }

  function switchUser(id) {
    if (!db.data[id]) return false;
    db.activeId = id;
    save();
    return true;
  }

  /** 新增使用者。名字重复不拦（现实里可能真有同名），但界面上会显示颜色区分。 */
  function addUser(name) {
    var n = String(name || "").trim().slice(0, 12);
    if (!n) return null;
    var u = newUser(n, db.users.length);
    db.users.push(u);
    db.data[u.id] = newUserData();
    save();
    return u;
  }

  function renameUser(id, name) {
    var n = String(name || "").trim().slice(0, 12);
    if (!n) return false;
    for (var i = 0; i < db.users.length; i++) {
      if (db.users[i].id === id) {
        db.users[i].name = n;
        save();
        return true;
      }
    }
    return false;
  }

  /**
   * 删除使用者。连带删除他的全部进度，不可恢复。
   * 不允许删掉最后一个人（至少留一个，否则界面无处可去）。
   */
  function removeUser(id) {
    if (db.users.length <= 1) return false;
    var idx = -1;
    for (var i = 0; i < db.users.length; i++) {
      if (db.users[i].id === id) idx = i;
    }
    if (idx < 0) return false;
    db.users.splice(idx, 1);
    delete db.data[id];
    if (db.activeId === id) db.activeId = db.users[0].id;
    save();
    return true;
  }

  function resetUser(id) {
    if (!db.data[id]) return false;
    db.data[id] = newUserData();
    save();
    return true;
  }

  /* ------------------------------------------------------------
     七、熟练度读写
     ------------------------------------------------------------
     熟练度 0~5：
       0 = 没练过（不写进 p，省体积）
       1~5 = 越高越熟

     出题优先级（见 20-data.js）：分越低、越久没练，越优先。
     ------------------------------------------------------------ */

  var MAX_LEVEL = 5;

  function getSkill(word) {
    var rec = me().p[word];
    return rec && typeof rec[0] === "number" ? rec[0] : 0;
  }

  function getLastTime(word) {
    var rec = me().p[word];
    return rec && typeof rec[1] === "number" ? rec[1] : 0;
  }

  /**
   * 改熟练度并立即落盘。
   * @param {string} word  英文原词（键）
   * @param {number} delta 增量，通常 +1 / +2 / 直接归零用 setSkill
   */
  function bumpSkill(word, delta) {
    var d = me();
    var cur = getSkill(word);
    var next = Math.max(0, Math.min(MAX_LEVEL, cur + delta));
    if (next <= 0) {
      delete d.p[word]; // 归零就删掉整条记录，不占体积
    } else {
      d.p[word] = [next, Date.now()];
    }
    return save();
  }

  function setSkill(word, value) {
    var d = me();
    var next = Math.max(0, Math.min(MAX_LEVEL, value | 0));
    if (next <= 0) delete d.p[word];
    else d.p[word] = [next, Date.now()];
    return save();
  }

  /** 答错时要记进错词本，结算页会列出来。 */
  function markWrong(word) {
    me().wrong[word] = Date.now();
    return save();
  }

  function clearWrong(word) {
    delete me().wrong[word];
    return save();
  }

  /**
   * 记一次答题结果。每答一题调用一次，内部直接写盘。
   * 之所以把「熟练度」和「日统计」放在一次 save 里，
   * 是因为它们属于同一次答题事实，分两次写会多一次序列化。
   */
  function recordAnswer(word, correct, weight) {
    var d = me();
    var w = weight || 1;
    var cur = getSkill(word);

    if (correct) {
      var next = Math.min(MAX_LEVEL, cur + w);
      d.p[word] = [next, Date.now()];
      delete d.wrong[word]; // 答对了就从错词本移出
    } else {
      delete d.p[word]; // 答错归零，回到最不熟
      d.wrong[word] = Date.now();
    }

    // 日统计
    var key = dayKey();
    var cell = d.days[key] || [0, 0];
    cell[0] += 1;
    if (correct) cell[1] += 1;
    d.days[key] = cell;

    // 只保留最近 60 天，防止无限增长
    var ks = Object.keys(d.days);
    if (ks.length > 60) {
      ks.sort();
      for (var i = 0; i < ks.length - 60; i++) delete d.days[ks[i]];
    }

    // 批量模式下调用的，由 batch() 结束时统一写盘
    return batching ? true : save();
  }

  function dayKey(d) {
    var t = d || new Date();
    var m = t.getMonth() + 1;
    var day = t.getDate();
    return t.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }

  /* ------------------------------------------------------------
     八、包内统计（主屏进度条用）
     ------------------------------------------------------------ */

  /**
   * @param {object} pack 词包对象（含 items）
   * @returns {{total:number, learned:number, mastered:number, avg:number}}
   *   learned  = 练过的（熟练度 >= 1）
   *   mastered = 熟练的（熟练度 >= 2，因为匹配答对一次就是 1，
   *              连续两次答对才算真的记住）
   */
  function packStats(pack) {
    var total = pack.items.length;
    var learned = 0,
      mastered = 0,
      sum = 0;
    for (var i = 0; i < total; i++) {
      var s = getSkill(pack.items[i].w);
      if (s >= 1) learned++;
      if (s >= 2) mastered++;
      sum += s;
    }
    return {
      total: total,
      learned: learned,
      mastered: mastered,
      avg: total ? sum / total : 0,
    };
  }

  /** 错词本里属于这个包的词数 */
  function wrongCountIn(pack) {
    var w = me().wrong,
      n = 0;
    for (var i = 0; i < pack.items.length; i++) {
      if (w[pack.items[i].w]) n++;
    }
    return n;
  }

  /* ------------------------------------------------------------
     九、导出：把进度变成一个 .json 文件
     ------------------------------------------------------------
     为什么要导出？
       进度只存在这台 iPad 的 localStorage 里。以下情况会全部丢失且无法找回：
         - 在 Safari 设置里「清除历史记录与网站数据」
         - 长按删除主屏幕图标（连带存储一起删）
         - 换一台 iPad
         - iOS 存储空间告急时系统清理网站数据
       前三个是用户操作导致的，程序拦不住。导出的文件存在「文件」App 里，
       不受浏览器存储策略影响，是唯一跨设备/长期的保险。

     文件格式（在外面包一层，而不是直接存内部结构）：
       {
         _app: "背单词",          <- 用来识别「这是本游戏的文件」
         _schema: 1,              <- 内部结构版本，导入时校验兼容性
         _exportedAt: "2026-10-23 17:30",
         payload: { ...原始 db... }
       }
       包一层的好处：用户可能选错文件，没有标识的话会直接把
       无关 json 导进来把进度覆盖成垃圾。

     实现细节（iOS 上的坑）：
       - 用 Blob + a[download]，不用 window.open(url)。
         后者在 PWA 里会新开一个空白页，且文件存不下来。
       - Blob 的 type 写 application/json，Safari 才会存成 .json
         而不是当成文本预览。
       - 必须在点击的同一个事件里触发 a.click()，否则 iOS 会拦
         「非用户手势触发的下载」。
     ------------------------------------------------------------ */

  function exportBlob() {
    var payload = JSON.parse(JSON.stringify(db)); // 深拷贝，避免导出时被改动
    var wrap = {
      _app: "背单词",
      _schema: SCHEMA,
      _exportedAt: formatTime(new Date()),
      payload: payload,
    };
    var text = JSON.stringify(wrap, null, 1);
    return new Blob([text], { type: "application/json" });
  }

  function exportFileName() {
    var d = new Date();
    var p = function (n) {
      return (n < 10 ? "0" : "") + n;
    };
    return (
      "背单词进度_" +
      d.getFullYear() +
      p(d.getMonth() + 1) +
      p(d.getDate()) +
      "_" +
      p(d.getHours()) +
      p(d.getMinutes()) +
      ".json"
    );
  }

  function formatTime(d) {
    var p = function (n) {
      return (n < 10 ? "0" : "") + n;
    };
    return (
      d.getFullYear() +
      "-" +
      p(d.getMonth() + 1) +
      "-" +
      p(d.getDate()) +
      " " +
      p(d.getHours()) +
      ":" +
      p(d.getMinutes())
    );
  }

  /**
   * 把 Blob 存成文件。
   * 注意：这个函数必须在用户点击的事件回调里同步调用。
   */
  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    // 有些 iOS 版本要求 a 在文档里才会触发下载
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    // 立刻回收会让下载中断，延迟释放
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 4000);
  }

  /* ------------------------------------------------------------
     十、导入：从文件恢复进度
     ------------------------------------------------------------
     流程与安全检查（顺序不能变）：
       1. 读文本、JSON.parse —— 失败直接报「不是有效的进度文件」
       2. 校验 _app 标识 —— 防止误选别的 json
       3. 校验 _schema <= 当前版本 —— 未来版本的文件不认
       4. 先把「当前进度」整份存进备份键 —— 导入前无条件备份
       5. normalize 后写入并落盘

     为什么第 4 步无条件备份：
       用户导错文件（比如把同事的进度导到自己头上）时，
       他没有任何办法撤销。备份键是最后一道防线，
       设置页提供「恢复上一次导入前的进度」。

     不做自动合并：
       合并熟练度听起来聪明，实际上会造成诡异结果
       （同一台机器上两个人交叉导入，词表会变成并集）。
       默认整份替换，并在确认框里写清楚会发生什么。
     ------------------------------------------------------------ */

  /**
   * @param {string} text 文件内容
   * @returns {{ok:boolean, err?:string, summary?:object}}
   */
  function importText(text) {
    var wrap;
    try {
      wrap = JSON.parse(text);
    } catch (e) {
      return { ok: false, err: "notjson" };
    }
    if (!isObj(wrap) || wrap._app !== "背单词") {
      return { ok: false, err: "notours" };
    }
    if (typeof wrap._schema === "number" && wrap._schema > SCHEMA) {
      return { ok: false, err: "newer" };
    }
    if (!isObj(wrap.payload)) {
      return { ok: false, err: "empty" };
    }

    // 第 4 步：无条件备份当前进度
    try {
      rawSet(KEY_BACKUP, JSON.stringify(db));
    } catch (e) {
      // 备份失败不阻断导入（用户此刻更想恢复数据），
      // 但要在返回值里告诉他
    }

    var next = normalize(wrap.payload);
    db = next;
    var okSaved = save();

    return {
      ok: true,
      saved: okSaved,
      summary: {
        users: next.users.length,
        exportedAt: wrap._exportedAt || "",
      },
    };
  }

  /** 导入前的备份能不能用 */
  function hasBackup() {
    return !!rawGet(KEY_BACKUP);
  }

  function restoreBackup() {
    var text = rawGet(KEY_BACKUP);
    if (!text) return false;
    try {
      var parsed = JSON.parse(text);
      db = normalize(parsed);
      save();
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ------------------------------------------------------------
     十一、对外暴露
     ------------------------------------------------------------ */
  App.store = {
    // 生命周期
    load: load,
    save: save,
    state: function () {
      return saveState;
    },
    persistent: hasLS, // false 表示只能用内存，关页面即丢

    // 使用者
    users: users,
    activeUser: activeUser,
    switchUser: switchUser,
    addUser: addUser,
    renameUser: renameUser,
    removeUser: removeUser,
    resetUser: resetUser,
    me: me,

    // 进度
    getSkill: getSkill,
    getLastTime: getLastTime,
    bumpSkill: bumpSkill,
    setSkill: setSkill,
    markWrong: markWrong,
    clearWrong: clearWrong,
    recordAnswer: recordAnswer,
    batch: batch,
    MAX_LEVEL: MAX_LEVEL,

    // 统计
    packStats: packStats,
    wrongCountIn: wrongCountIn,
    dayKey: dayKey,

    // 导入导出
    exportBlob: exportBlob,
    exportFileName: exportFileName,
    download: download,
    importText: importText,
    hasBackup: hasBackup,
    restoreBackup: restoreBackup,

    // 调试用：导出整份结构（只读）
    dump: function () {
      return db;
    },
  };
})();


/* ===== 20-data.js ===== */
/* ============================================================
   20-data.js —— 词库访问层 + 出题算法
   ------------------------------------------------------------
   数据在页面末尾的 #db 节点里（一个 type=application/json 的 script 节点），
   由 build.py 从 data/vocab.json 压成紧凑字段后注入。

   字段对照（压缩是为了减小 HTML 体积，gzip 后差别不大，
   但解析更快、原始文件更小）：
     w  = word      英文原词（也是进度表的主键）
     z  = 中文释义
     p  = 词性
     c  = 子类／归类（挑干扰项时用：同子类最容易混）
     t  = 形态 word | phrase
     e  = 例句（L2 是文档原句，L3 是挖空句）
     ez = 例句中文（仅 L3）
     s  = 来源类型（仅 L2：配置说明／框架文档…）
     n  = 掌握要求（认读 / 使用）
     d  = 干扰项数组（仅 L3）
     df = 差异解释（仅 L3）
     sc = 场景类型（仅 L3）
     f  = 常见度 1~3（仅 L1）
     sp = 拼写难度 1~3（仅 L1）
     nt = 备注（仅 L1）
     tp = 人话解释
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});

  var DB = null; // 解析后的原始结构
  var PACK_BY_ID = {};

  /**
   * 解析页面里内嵌的 JSON。
   *
   * 为什么用 application/json 类型的 script 节点，而不是把数据写成
   * JS 字面量（var DB = {...}）：
   *   1. JSON.parse 比 JS 引擎解析对象字面量快一个量级
   *      （290KB 的体量，桌面 1.3ms vs 十几毫秒，iPad 上差距更明显）
   *   2. 数据是纯数据，不会被当成代码执行；即使某个字符串里
   *      混进了奇怪的字符，最坏结果是解析失败、页面显示错误提示，
   *      而不是整页白屏
   *   3. 浏览器不会把它当脚本预编译，首屏更快
   */
  function init() {
    var el = document.getElementById("db");
    if (!el) throw new Error("找不到词库节点 #db");
    DB = JSON.parse(el.textContent);

    DB.packs.forEach(function (p) {
      PACK_BY_ID[p.id] = p;
    });
    return DB;
  }

  /* ------------------------------------------------------------
     等级定义
     ------------------------------------------------------------
     三个等级是并列的，没有解锁、没有推荐顺序。
     每个等级下面挂若干词包（L1/L2 各一个，L3 三个）。
     ------------------------------------------------------------ */
  var LEVELS = [
    { id: "L1", name: "简单", tag: "L1", desc: "日常物品、动物、场所、人员称谓" },
    { id: "L2", name: "中等", tag: "L2", desc: "读英文技术文档会用到的词" },
    { id: "L3", name: "复杂", tag: "L3", desc: "开发测试中与人沟通的用词" },
  ];

  function packsOf(levelId) {
    return DB.packs.filter(function (p) {
      return p.level === levelId;
    });
  }

  function getPack(id) {
    return PACK_BY_ID[id] || null;
  }

  function levelOf(levelId) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].id === levelId) return LEVELS[i];
    }
    return null;
  }

  /* ------------------------------------------------------------
     小工具
     ------------------------------------------------------------ */

  /** Fisher-Yates 洗牌，原地修改并返回。 */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function randInt(n) {
    return Math.floor(Math.random() * n);
  }

  /* ------------------------------------------------------------
     一、出题优先级
     ------------------------------------------------------------
     一句话：越不熟、越久没碰，越先出。

     分数构成：
       base = (5 - 熟练度) * 10
         没练过 → 50；练到 5 → 0。这是主项。
       stale = min(30, 距上次练习的天数 * 1.5)
         一个月没碰的词最多加 30 分，能压过一半的熟练度差距 ——
         这是刻意的：熟词放久了照样会忘，得捞回来复习。
         没练过的词按 999 天算，直接吃满 30 分，所以新词永远优先。
       noise = 随机 0~8
         防止每次进游戏题目顺序完全一样。人会对顺序产生肌肉记忆，
         那练的就不是单词了。

     不用「完全随机」的原因：
       862 个词里随机抽 6 个，抽到熟词的概率极高，练一小时全是
       已经会的，纯浪费时间。也不用人脑挑「今天练哪几个」——
       那正是这个游戏要替用户省掉的决策。
     ------------------------------------------------------------ */
  function priorityOf(item) {
    var s = App.store.getSkill(item.w);
    var last = App.store.getLastTime(item.w);
    var days = last ? (Date.now() - last) / 86400000 : 999;
    var base = (App.store.MAX_LEVEL - s) * 10;
    var stale = Math.min(30, days * 1.5);
    var noise = Math.random() * 8;
    return base + stale + noise;
  }

  /* ------------------------------------------------------------
     二、组一局（英中匹配用，其它玩法可以复用）
     ------------------------------------------------------------
     @param {object} pack   词包
     @param {number} n      需要几对（匹配默认 6）
     @param {object} opt    { minSkill, maxSkill, onlyType }
     @returns {Array} 词条数组

     挑选策略分两步：

     第一步：按优先级排序，取前 n*3 个作为候选池。
       取 3 倍是为了给第二步留挑选余地，同时保证随机性
       只在「优先段」内发生 —— 不会从全库乱抽。

     第二步：同子类优先。
       匹配玩法里，如果 6 个中文来自完全不同的子类，
       看一眼就能配对，等于白给。来自同一子类（比如都是
       厨房用具）才有辨析压力。所以：
         - 找出候选池里词最多的那个子类，先拿它 3~4 个
         - 剩下的从池里补，尽量不重复子类
       这是设计里写死的「干扰项同子类优先」。

     边界情况：
       - 包里词数 < n（比如刚开始就剩几个没练）→ 有多少给多少
       - 某个子类只有 1 个词 → 正常补其它子类，不会卡死
     ------------------------------------------------------------ */
  function pickSession(pack, n, opt) {
    opt = opt || {};
    var pool = pack.items.filter(function (it) {
      if (opt.onlyType && it.t !== opt.onlyType) return false;
      if (typeof opt.minSkill === "number" && App.store.getSkill(it.w) < opt.minSkill) return false;
      if (typeof opt.maxSkill === "number" && App.store.getSkill(it.w) > opt.maxSkill) return false;
      return true;
    });

    if (!pool.length) return [];

    // 第一步：算分排序
    var scored = pool.map(function (it) {
      return { it: it, sc: priorityOf(it) };
    });
    scored.sort(function (a, b) {
      return b.sc - a.sc;
    });

    var limit = Math.min(scored.length, Math.max(n * 3, n));
    var cand = scored.slice(0, limit).map(function (x) {
      return x.it;
    });

    // 第二步：同子类优先
    var byCat = {};
    cand.forEach(function (it) {
      var k = it.c || "_";
      (byCat[k] = byCat[k] || []).push(it);
    });

    var bestCat = null,
      bestLen = 0;
    Object.keys(byCat).forEach(function (k) {
      if (byCat[k].length > bestLen) {
        bestLen = byCat[k].length;
        bestCat = k;
      }
    });

    var picked = [];
    var used = {}; // 用英文原词判重，不依赖对象引用

    if (bestCat && bestLen >= 3) {
      var seeds = shuffle(byCat[bestCat].slice()).slice(0, Math.min(4, n));
      seeds.forEach(function (it) {
        if (!used[it.w]) {
          used[it.w] = 1;
          picked.push(it);
        }
      });
    }

    // 补齐：优先不同子类，避免 6 个词里 5 个同子类导致辨识度太低
    var rest = cand.filter(function (it) {
      return !used[it.w];
    });
    shuffle(rest);

    // 第一轮：子类不重复
    for (var i = 0; i < rest.length && picked.length < n; i++) {
      var it = rest[i];
      var dup = false;
      for (var k = 0; k < picked.length; k++) {
        if ((picked[k].c || "_") === (it.c || "_")) {
          dup = true;
          break;
        }
      }
      if (!dup) {
        used[it.w] = 1;
        picked.push(it);
      }
    }
    // 第二轮：还差就直接补，不管子类
    for (var j = 0; j < rest.length && picked.length < n; j++) {
      if (!used[rest[j].w]) {
        used[rest[j].w] = 1;
        picked.push(rest[j]);
      }
    }

    return shuffle(picked).slice(0, n);
  }

  /* ------------------------------------------------------------
     三、取释义做匹配选项
     ------------------------------------------------------------
     中文列直接用这 6 个词自己的释义，不需要额外造干扰项 ——
     匹配玩法里「错误选项」就是别人的答案。
     ------------------------------------------------------------ */
  function labelsOf(items) {
    return items.map(function (it) {
      return { key: it.w, text: it.z };
    });
  }

  App.data = {
    init: init,
    raw: function () {
      return DB;
    },
    LEVELS: LEVELS,
    levelOf: levelOf,
    packsOf: packsOf,
    getPack: getPack,
    pickSession: pickSession,
    labelsOf: labelsOf,
    priorityOf: priorityOf,
    // 工具函数给其它模块用
    shuffle: shuffle,
    randInt: randInt,
  };
})();


/* ===== 30-ui.js ===== */
/* ============================================================
   30-ui.js —— 视图框架、顶栏、主屏、设置页
   ------------------------------------------------------------
   路由：不用 location.hash。
     原因：这个游戏最终是以「添加到主屏幕」的方式全屏运行，
     hash 变化会被 WebKit 记进历史，主屏模式下的侧滑手势
     会一路退出去直接关掉应用。改成自己维护一个 view 变量，
     切换时整块替换 #view 的 innerHTML，不碰浏览器的历史记录。

   渲染：整块 innerHTML 重建，不做 diff。
     原因：一屏最多十几个节点，重建耗时 <1ms。做 diff 要维护
     一套状态对比逻辑，加玩法时容易漏更新，得不偿失。
     代价是「输入框焦点会丢」——所以所有输入都走弹层，
     弹层不在 #view 里，不会被重绘影响。
   ============================================================ */

(function () {
  "use strict";

  var App = (window.App = window.App || {});
  var S = App.store;

  var viewEl, barEl;
  var cur = { name: "home", params: {} }; // 当前视图
  var views = {}; // 视图注册表：name -> { render(params), mount(el, params) }
  var titleOf = {}; // 视图名 -> 顶栏标题

  /* ------------------------------------------------------------
     基础工具
     ------------------------------------------------------------ */

  /** HTML 转义。所有拼进 innerHTML 的动态文本都必须过这一道。 */
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  var toastTimer = null;
  function toast(msg, ms) {
    var old = document.querySelector(".toast");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    if (toastTimer) clearTimeout(toastTimer);

    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);

    toastTimer = setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, ms || 2000);
  }

  /**
   * 弹层。返回 Promise，确认 resolve(true)，取消 resolve(false)。
   * @param {object} o
   *   title    标题
   *   text     正文（支持 \n 换行）
   *   input    有值则显示输入框（默认值）
   *   okText   确认按钮文字
   *   cancelText 取消按钮文字，传 null 表示只有一个按钮
   *   danger   确认按钮用红色
   *   placeholder 输入框占位
   * @returns {Promise<string|boolean>}
   *   有输入框时 resolve 输入内容或 false
   */
  function dialog(o) {
    return new Promise(function (resolve) {
      var mask = document.createElement("div");
      mask.className = "mask";

      var hasInput = o.input !== undefined;
      var cancelText = o.cancelText === undefined ? "取消" : o.cancelText;

      var html =
        '<div class="dialog">' +
        "<h3>" +
        esc(o.title || "") +
        "</h3>" +
        (o.text ? "<p>" + esc(o.text) + "</p>" : "") +
        (hasInput
          ? '<input type="text" value="' +
            esc(o.input || "") +
            '" placeholder="' +
            esc(o.placeholder || "") +
            '">'
          : "") +
        '<div class="d-actions">' +
        (cancelText
          ? '<button class="btn" data-d="0">' + esc(cancelText) + "</button>"
          : "") +
        '<button class="btn ' +
        (o.danger ? "danger" : "primary") +
        '" data-d="1">' +
        esc(o.okText || "确定") +
        "</button>" +
        "</div></div>";

      mask.innerHTML = html;
      document.body.appendChild(mask);

      var input = mask.querySelector("input");

      function close(val) {
        if (mask.parentNode) mask.parentNode.removeChild(mask);
        // 防止 iPad 上关掉弹层后输入框还聚焦着导致页面卡住
        if (input) input.blur();
        resolve(val);
      }

      mask.addEventListener("click", function (e) {
        if (e.target === mask) return close(false); // 点遮罩 = 取消
        var btn = e.target.closest("[data-d]");
        if (!btn) return;
        if (btn.getAttribute("data-d") === "1") {
          close(hasInput ? input.value.trim() : true);
        } else {
          close(false);
        }
      });

      if (input) {
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") close(input.value.trim());
        });
        // 延迟聚焦：iOS 上同步 focus 有时不弹键盘
        setTimeout(function () {
          input.focus();
        }, 60);
      }
    });
  }

  /* ------------------------------------------------------------
     视图切换
     ------------------------------------------------------------ */

  function register(name, def) {
    views[name] = def;
  }

  function setTitles(map) {
    for (var k in map) titleOf[k] = map[k];
  }

  /**
   * 切换视图。
   * @param {string} name
   * @param {object} params
   * @param {boolean} noHistory  预留：将来要支持「返回上一屏」时用
   */
  function go(name, params) {
    var def = views[name];
    if (!def) {
      toast("页面不存在：" + name);
      return;
    }
    // 离开当前视图：给它一个清理机会（匹配玩法要清定时器）
    var prev = views[cur.name];
    if (prev && prev.unmount && cur.name !== name) {
      try {
        prev.unmount();
      } catch (e) {}
    }

    cur = { name: name, params: params || {} };
    render();
  }

  function render() {
    var def = views[cur.name];
    // 每次渲染都新建一个 .view-inner，事件监听绑在它身上。
    // 为什么不用 viewEl.innerHTML 直接重写：
    //   mount 里是 el.addEventListener(...)，如果 el 一直是同一个 #view，
    //   每次渲染就会多叠一个监听器，点一下触发 N 次（答对一题记 N 次分）。
    //   换成每次新建的容器，旧节点连同它的监听器一起被回收。
    var inner = document.createElement("div");
    inner.className = "view-inner";
    inner.innerHTML = def.render(cur.params);

    viewEl.innerHTML = "";
    viewEl.appendChild(inner);
    viewEl.scrollTop = 0;

    renderBar();
    if (def.mount) def.mount(inner, cur.params);
  }

  function renderBar() {
    // 标题可以是字符串，也可以是函数（从 params 里取包名等）
    var t = titleOf[cur.name];
    var title = typeof t === "function" ? t(cur.params) || "背单词" : t || "背单词";
    var u = S.activeUser();
    var canBack = cur.name !== "home" && cur.name !== "pick-user";

    barEl.innerHTML =
      (canBack
        ? '<button class="icon-btn" data-bar="back" aria-label="返回">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
          "</button>"
        : "") +
      '<div class="bar-title">' +
      esc(title) +
      "</div>" +
      '<div class="who" data-bar="who"><i class="dot" style="background:' +
      esc(u.color) +
      '"></i>' +
      esc(u.name) +
      "</div>" +
      '<button class="icon-btn" data-bar="settings" aria-label="设置">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.43.65.79.79H21a2 2 0 1 1 0 4h-.09c-.36.14-.65.43-.79.79z"/></svg>' +
      "</button>";
  }

  function todayLine() {

  function totalWords() {

      n += p.items.length;
    });
    return n;
