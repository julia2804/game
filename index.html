<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover 让页面能伸到刘海/圆角区域，配合 CSS 的 env(safe-area-inset-*) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 以下三条让 iPad「添加到主屏幕」后以全屏应用方式启动，不显示 Safari 地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<!-- 主屏幕图标必须是独立 PNG（单 HTML 内嵌不了），与本页面同目录部署 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- 关掉电话号码自动识别，避免数字被渲染成蓝色链接 -->
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f5f7">
<title>背单词</title>
<style>
/* ============================================================
   背单词 · 样式表
   设计前提：iPad 2019 主屏幕全屏（无地址栏），横屏为主，
             手机竖屏也要能用。浅色，不刺眼。
   所有尺寸用 rem + vmin 混合，避免在 1024x768 和 1194x834
   之间来回切时布局跳。
   ============================================================ */

:root {
  /* 配色：白底、深灰字、一个蓝色主色。不要第二个强调色。 */
  --bg: #f4f5f7;
  --card: #ffffff;
  --line: #e4e7ed;
  --line-strong: #d0d5dd;
  --text: #1d2129;
  --sub: #86909c;
  --brand: #2b6cf6;
  --brand-weak: #eaf1ff;
  --ok: #12a150;
  --ok-weak: #e8f7ee;
  --bad: #e5484d;
  --bad-weak: #fdecec;
  --warn: #d97706;

  /* 圆角与阴影，克制使用 */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 12px rgba(16, 24, 40, 0.04);

  /* 安全区：主屏幕模式下 iPad 底部有 home indicator */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}

* {
  box-sizing: border-box;
  /* 禁止长按选中与双击缩放：iPad 上误触会选中文字，体验很差 */
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  /* 关掉 iOS 的橡皮筋回弹，避免整页跟着滑动 */
  overscroll-behavior: none;
}

body {
  /* 禁止双击缩放（iOS Safari 需要这条） */
  touch-action: manipulation;
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
}

/* ---------- 顶栏 ---------- */

#bar {
  flex: 0 0 auto;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}

.bar-title {
  font-size: 17px;
  font-weight: 600;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 使用者标签：● 甲 —— 点开切换使用者 */
.who {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  background: var(--bg);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.who:active {
  background: var(--line);
}
.who .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
}

.icon-btn {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: none;
  background: transparent;
  border-radius: 8px;
  color: var(--sub);
  cursor: pointer;
}
.icon-btn:active {
  background: var(--bg);
}
.icon-btn svg {
  width: 20px;
  height: 20px;
}

/* ---------- 主体 ---------- */

#view {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
}

/*
  view-inner 用 flex 纵向布局 + min-height:100%：
  页面内容不满一屏时（比如填空的题干很短），
  让底部的键盘区 .kb 靠 margin-top:auto 贴住视口下沿，
  而不是悬在半空。内容超过一屏时 min-height 不起作用，行为不变。
*/
.view-inner {
  max-width: 980px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* ---------- 通用卡片 ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}

.hint {
  color: var(--sub);
  font-size: 13px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--sub);
  letter-spacing: 0.04em;
  margin: 20px 4px 10px;
}

/* ---------- 主屏：等级卡片 ---------- */

.levels {
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr;
}

@media (min-width: 700px) {
  .levels {
    grid-template-columns: repeat(3, 1fr);
  }
}

.level-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: var(--r-lg);
  transition: transform 0.12s, border-color 0.12s;
  font: inherit;
  color: inherit;
}
.level-card:active {
  transform: scale(0.985);
  border-color: var(--brand);
}

.level-card .lv-tag {
  font-size: 12px;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 0.06em;
}
.level-card .lv-name {
  font-size: 20px;
  font-weight: 600;
}
.level-card .lv-desc {
  font-size: 13px;
  color: var(--sub);
  min-height: 38px;
}
.level-card .lv-foot {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 13px;
  color: var(--sub);
}
.level-card .lv-count {
  font-variant-numeric: tabular-nums;
}

/* 进度条 */
.bar {
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--brand);
  transition: width 0.3s;
}

/* ---------- 使用者选择 / 列表 ---------- */

.user-list {
  display: grid;
  gap: 10px;
  grid-template-columns: 1fr;
  margin-top: 4px;
}
@media (min-width: 560px) {
  .user-list {
    grid-template-columns: 1fr 1fr;
  }
}

.user-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--card);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.user-btn:active {
  border-color: var(--brand);
  background: var(--brand-weak);
}
.user-btn .avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  flex: 0 0 auto;
}
.user-btn .uname {
  font-size: 16px;
  font-weight: 600;
}
.user-btn .umeta {
  font-size: 12px;
  color: var(--sub);
}

/* ---------- 包 / 玩法按钮 ---------- */

.pack-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  background: var(--card);
}
.pack-row:last-child {
  border-bottom: none;
}
.pack-row:active {
  background: var(--bg);
}
.pack-row .pr-main {
  flex: 1 1 auto;
  min-width: 0;
}
.pack-row .pr-name {
  font-size: 16px;
  font-weight: 600;
}
.pack-row .pr-desc {
  font-size: 12px;
  color: var(--sub);
  margin-top: 2px;
}
.pack-row .pr-stat {
  font-size: 12px;
  color: var(--sub);
  text-align: right;
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
}
.pack-row .chev {
  color: var(--line-strong);
  font-size: 18px;
  flex: 0 0 auto;
}

.modes {
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr 1fr;
  margin-top: 4px;
}
@media (max-width: 420px) {
  .modes {
    grid-template-columns: 1fr;
  }
}

.mode-btn {
  padding: 18px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--card);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mode-btn:active {
  border-color: var(--brand);
}
.mode-btn[disabled] {
  opacity: 0.45;
  cursor: default;
}
.mode-btn .mb-name {
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-btn .mb-desc {
  font-size: 12px;
  color: var(--sub);
}
.mode-btn .badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg);
  color: var(--sub);
}

/* ---------- 英中匹配 ---------- */

.match-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--sub);
}
.match-head .progress {
  font-variant-numeric: tabular-nums;
}

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (min-width: 760px) {
  .match-grid {
    gap: 14px;
  }
}

.match-col {
  display: grid;
  gap: 10px;
  align-content: start;
}

.tile {
  position: relative;
  min-height: 58px;
  padding: 10px 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font: inherit;
  color: inherit;
  cursor: pointer;
  word-break: break-word;
  transition: border-color 0.12s, background 0.12s, transform 0.12s;
}

/* 英文格：字号稍大，利于识别拼写 */
.tile.en {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
/* 中文格：字号小一点，因为中文信息密度高 */
.tile.zh {
  font-size: 15px;
}

.tile:active {
  transform: scale(0.98);
}

/* 已选中（等待配对） */
.tile.sel {
  border-color: var(--brand);
  background: var(--brand-weak);
}

/* 配对成功：保留在原位，绿色锁定，不消失 */
.tile.done {
  border-color: var(--ok);
  background: var(--ok-weak);
  color: var(--ok);
  cursor: default;
  opacity: 0.75;
}
.tile.done::after {
  content: "";
  position: absolute;
  top: 6px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
}

/* 配错：红色抖动 300ms，然后自动复位 */
.tile.bad {
  border-color: var(--bad);
  background: var(--bad-weak);
  animation: shake 0.3s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* ---------- 结算 ---------- */

.result {
  padding: 28px 20px;
  text-align: center;
}
.result .r-big {
  font-size: 44px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.result .r-label {
  font-size: 13px;
  color: var(--sub);
  margin-top: 4px;
}
.result .r-rows {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 24px 0;
}
.result .r-cell {
  padding: 12px 6px;
  background: var(--bg);
  border-radius: var(--r-sm);
}
.result .r-cell b {
  display: block;
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}
.result .r-cell span {
  font-size: 11px;
  color: var(--sub);
}

/* 答错的词回顾 */
.review {
  text-align: left;
  margin-top: 20px;
}
.review-item {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: 8px;
  font-size: 14px;
  align-items: baseline;
}
.review-item .rw {
  font-weight: 600;
}
.review-item .rz {
  color: var(--sub);
  margin-left: auto;
  text-align: right;
}

/* ---------- 按钮 ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 48px;
  padding: 0 22px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}
.btn:active {
  background: var(--bg);
}
.btn.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}
.btn.primary:active {
  filter: brightness(0.94);
}
.btn.danger {
  color: var(--bad);
  border-color: #f3c9ca;
}
.btn.danger:active {
  background: var(--bad-weak);
}
.btn.block {
  width: 100%;
}
.btn.sm {
  height: 38px;
  padding: 0 14px;
  font-size: 14px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.actions .btn {
  flex: 1 1 0;
}

/* ---------- 设置页 ---------- */

.setting-group {
  margin-bottom: 8px;
}
.setting-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
  cursor: pointer;
}
.setting-row:last-child {
  border-bottom: none;
}
.setting-row .sr-main {
  flex: 1 1 auto;
  min-width: 0;
}
.setting-row .sr-title {
  font-size: 15px;
}
.setting-row .sr-desc {
  font-size: 12px;
  color: var(--sub);
  margin-top: 2px;
  line-height: 1.45;
}
.setting-row .sr-val {
  font-size: 13px;
  color: var(--sub);
  flex: 0 0 auto;
}

.about-note {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.7;
  padding: 4px 4px 0;
}

/* ---------- 弹层（确认框 / 输入框） ---------- */

.mask {
  position: fixed;
  inset: 0;
  background: rgba(16, 24, 40, 0.42);
  display: grid;
  place-items: center;
  padding: 24px;
  z-index: 50;
  animation: fade 0.15s;
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.dialog {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 22px 20px 16px;
  animation: pop 0.16s ease-out;
}
@keyframes pop {
  from { transform: scale(0.94); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.dialog h3 {
  margin: 0 0 8px;
  font-size: 17px;
  font-weight: 600;
}
.dialog p {
  margin: 0 0 16px;
  font-size: 14px;
  color: var(--sub);
  line-height: 1.6;
  white-space: pre-wrap;
}
.dialog input {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-sm);
  font: inherit;
  font-size: 16px; /* 16px 是 iOS 不自动放大的下限 */
  margin-bottom: 16px;
  background: var(--bg);
  -webkit-user-select: text;
  user-select: text;
}
.dialog input:focus {
  outline: none;
  border-color: var(--brand);
  background: var(--card);
}
.dialog .d-actions {
  display: flex;
  gap: 10px;
}
.dialog .d-actions .btn {
  flex: 1 1 0;
}

/* ---------- 轻提示 ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + var(--sab));
  transform: translateX(-50%);
  max-width: 80vw;
  padding: 10px 18px;
  border-radius: 20px;
  background: rgba(29, 33, 41, 0.92);
  color: #fff;
  font-size: 14px;
  z-index: 80;
  animation: rise 0.2s;
}
@keyframes rise {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* 空状态 */
.empty {
  text-align: center;
  color: var(--sub);
  font-size: 14px;
  padding: 48px 20px;
}

/* ============================================================
   以下为填空 / 填字 / 场景选词三种玩法的样式
   ============================================================ */

/* ---------- 题干区（填空、场景选词共用） ---------- */

.q-head {
  padding: 4px 4px 12px;
}
/* 第几题 / 第几步。放在题干上方，让用户知道还要多久 */
.q-idx {
  display: inline-block;
  font-size: 13px;
  color: var(--sub);
  letter-spacing: 0.02em;
}
.q-zh {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.35;
  margin-top: 4px;
}
.q-pos {
  font-size: 13px;
  color: var(--sub);
  margin-top: 2px;
}
.q-card {
  padding: 20px 16px;
}
.q-ex {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  font-size: 14px;
  color: var(--text);
  line-height: 1.65;
}
.q-ex-zh {
  margin-top: 4px;
  font-size: 13px;
  color: var(--sub);
  line-height: 1.6;
}

/* ---------- 填空：字母格 ---------- */

.slots {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
/*
  每个字母一个格子。宽度 30px 是按最长的情况算的：
  L3 有 notwithstanding 这种 15 字母的词，15 × 35px = 525px，
  在 iPad 横屏（可用宽约 900）和手机竖屏（390）都放得下
  （竖屏会换行，flex-wrap 已开）。
*/
.slot {
  width: 30px;
  height: 44px;
  border: 1.5px solid var(--line-strong);
  border-bottom-width: 2.5px;
  border-radius: var(--r-sm);
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 600;
  text-transform: lowercase;
  transition: border-color 0.12s, background 0.12s;
}
/* 已经给出的字母：灰底，明确区分「我填的」和「题目给的」 */
.slot.given {
  background: var(--bg);
  border-color: var(--line);
  color: var(--sub);
  border-bottom-width: 1.5px;
}
/* 光标所在格 */
.slot.on {
  border-color: var(--brand);
  background: var(--brand-weak);
  box-shadow: 0 0 0 3px rgba(43, 108, 246, 0.12);
}
/* 整个词拼对了 */
.slot.good {
  border-color: var(--ok);
  background: var(--ok-weak);
  color: var(--ok);
}
.slot-sep {
  width: 12px;
  text-align: center;
  color: var(--sub);
}
.slots.shake {
  animation: shake 0.3s;
}

/* 答错后「照着打一遍」的提示框 */
.redo-box {
  margin-top: 16px;
  padding: 12px;
  border-radius: var(--r-md);
  background: var(--bad-weak);
  text-align: center;
}
.redo-word {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--bad);
}

/* ---------- 自建字母键盘 ---------- */

.kb {
  margin-top: auto; /* 内容不满一屏时把键盘压到视口底部（配合 .view-inner 的 flex） */
  padding: 14px 0 calc(14px + var(--sab));
  /*
    吸底：页面再长，键盘也始终贴在屏幕下沿，手指不用够。
    用 sticky 而不是 fixed，是为了让它跟着文档流走，
    不会盖住结算页的按钮。
  */
  position: sticky;
  bottom: 0;
  background: linear-gradient(to bottom, rgba(244, 245, 247, 0), var(--bg) 18%);
}
.krow {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 6px;
}
.key {
  /*
    高度 52px：iPad 上手指接触面约 40px，52 留足余量。
    宽度用 flex:1 均分，最窄一行（9 键）在 390px 竖屏上也有 38px，
    略小于 44pt，所以竖屏时把 min-width 兜住。
  */
  flex: 1 1 0;
  min-width: 30px;
  max-width: 76px;
  height: 52px;
  border-radius: var(--r-sm);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 0 1px 0 var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: transform 0.08s, background 0.08s;
}
.key:active {
  transform: scale(0.94);
  background: var(--brand-weak);
}
/* 功能键（退格、连字符、空格）稍窄一点的字号 */
.key-fn {
  background: var(--bg);
  font-size: 16px;
}
.key-space {
  flex: 2.2 1 0;
  font-size: 14px;
  font-weight: 400;
  color: var(--sub);
}

/* ---------- 英文填字 ---------- */

.xw-head {
  padding: 4px 4px 10px;
}
.xw-card {
  padding: 10px;
}
/*
  宽屏：网格在左、提示词在右，一屏放下。
  网格限制在 480px：11 列时每格约 41px，仍好点；
  再大就会把整页高度顶出视口（iPad 横屏可用高约 730）。
*/
@media (min-width: 900px) {
  .xw-cols {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .xw-card {
    flex: 0 0 auto;
  }
  .xw-cols .xw {
    /*
      这里必须是 width 而不是 max-width：
      .xw-card 是 flex 子项，宽度收缩到内容宽；
      而 .xw 的列宽是 repeat(n, 1fr)，容器宽度不确定时
      1fr 退化成 min-content，整个网格会塌成一个小方块
      （实测踩过：改用 max-width 后网格缩成 70px 的缩略图）。
    固定 460px：11 列每格约 39px，9 列约 48px，都好点。
    再大 16px 就会把整页顶出视口（iPad 横屏可用高约 730）。
  */
    width: 460px;
  }
  .xw-cols .clues {
    flex: 1 1 auto;
    margin-top: 0;
  }
}
.xw {
  display: grid;
  /* 列数由 JS 写进 style="--n:9"（9~11 之间自适应） */
  grid-template-columns: repeat(var(--n, 9), 1fr);
  gap: 3px;
  max-width: 560px;
  margin: 0 auto;
}
.xw-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--card);
  /*
    字号跟着格子大小走。11×11 时格子只有 ~48px，
    固定 20px 会把字母顶出格子。
  */
  font-size: clamp(13px, 3.6vmin, 22px);
  font-weight: 600;
  text-transform: uppercase;
  transition: background 0.12s, border-color 0.12s;
}
/* 不属于任何词的格子：挖空，不参与输入 */
.xw-cell.blank {
  background: transparent;
  border-color: transparent;
}
/* 左上角的小编号 */
.xw-num {
  position: absolute;
  top: 1px;
  left: 3px;
  font-size: 9px;
  font-style: normal;
  font-weight: 500;
  color: var(--sub);
}
/* 当前选中的整个词 */
.xw-cell.active {
  background: var(--brand-weak);
  border-color: #b9d0fb;
}
/* 光标所在格 */
.xw-cell.cur {
  background: #dbe7fd;
  border-color: var(--brand);
  box-shadow: 0 0 0 2px rgba(43, 108, 246, 0.18);
}
/* 这个词已经判定通过 */
.xw-cell.good {
  background: var(--ok-weak);
  border-color: var(--ok);
  color: var(--ok);
}
/* 这个词填错了（不锁定，可以继续改） */
.xw-cell.bad {
  background: var(--bad-weak);
  border-color: var(--bad);
  color: var(--bad);
}

.clues {
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 700px) {
  /* 窄屏改成上下排，两列会把中文释义挤成两行 */
  .clues {
    grid-template-columns: 1fr;
  }
}
.clue-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--sub);
  margin-bottom: 6px;
}
.clue {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 7px 8px;
  border-radius: var(--r-sm);
  font-size: 14px;
  line-height: 1.45;
  cursor: pointer;
}
.clue.on {
  background: var(--brand-weak);
}
.clue.done {
  color: var(--sub);
  text-decoration: line-through;
}
.c-num {
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--sub);
  min-width: 14px;
}
.c-txt {
  flex: 1 1 auto;
}
/* 「答案」小按钮，点一下直接填出这个词 */
.c-help {
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--brand);
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--brand-weak);
}

/* ---------- 场景选词 ---------- */

.scene-tag {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--brand-weak);
  color: var(--brand);
  font-size: 12px;
}
.scene-sent {
  font-size: 17px;
  line-height: 1.85;
  padding: 4px 2px 14px;
}
/* 句子里被挖掉的那个词 */
.blank-box {
  display: inline-block;
  min-width: 72px;
  border-bottom: 2.5px solid var(--brand);
  vertical-align: baseline;
}

.opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 560px) {
  .opts {
    grid-template-columns: 1fr;
  }
}
.opt {
  min-height: 54px;
  padding: 12px 14px;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--card);
  font-size: 17px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.1s, border-color 0.1s, background 0.1s;
}
.opt:active {
  transform: scale(0.98);
}
.opt.good {
  border-color: var(--ok);
  background: var(--ok-weak);
  color: var(--ok);
}
.opt.bad {
  border-color: var(--bad);
  background: var(--bad-weak);
  color: var(--bad);
}
/* 没选中也没答对的选项：淡化，让视线集中在正确答案上 */
.opt.dim {
  opacity: 0.45;
}

/* 判定后出现的解释区 —— 这个玩法真正的价值所在 */
.why {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}
.why-head {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}
.why-head.ok {
  color: var(--ok);
}
.why-head.no {
  color: var(--bad);
}
.why-body {
  font-size: 14px;
  line-height: 1.75;
}
.why-tip {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.7;
}
.why-zh {
  margin-top: 8px;
  font-size: 13px;
  color: var(--sub);
  line-height: 1.65;
}

</style>
</head>

:"数码配件","t":"word","f":3,"sp":2,"nt":"也作动词：监控"},{"w":"tripod","z":"三脚架","p":"n.","c":"数码配件","t":"word","f":2,"sp":2},{"w":"hill","z":"小山","p":"n.","c":"自然场所","t":"word","f":3,"sp":1,"nt":"与 mountain 对照：hill 更矮"},{"w":"mountain","z":"山","p":"n.","c":"自然场所","t":"word","f":3,"sp":2},{"w":"stream","z":"小溪","p":"n.","c":"自然场所","t":"word","f":3,"sp":2},{"w":"forest","z":"森林","p":"n.","c":"自然场所","t":"word","f":3,"sp":2},{"w":"woods","z":"树林","p":"n.","c":"自然场所","t":"word","f":2,"sp":1,"nt":"常用复数，比 forest 小"},{"w":"cave","z":"山洞","p":"n.","c":"自然场所","t":"word","f":3,"sp":1},{"w":"cliff","z":"悬崖","p":"n.","c":"自然场所","t":"word","f":2,"sp":1},{"w":"valley","z":"山谷","p":"n.","c":"自然场所","t":"word","f":2,"sp":2},{"w":"lake","z":"湖","p":"n.","c":"自然场所","t":"word","f":3,"sp":1},{"w":"river","z":"河","p":"n.","c":"自然场所","t":"word","f":3,"sp":1},{"w":"island","z":"岛","p":"n.","c":"自然场所","t":"word","f":3,"sp":2,"nt":"s 不发音"},{"w":"desert","z":"沙漠","p":"n.","c":"自然场所","t":"word","f":2,"sp":2,"nt":"重音在后；也作动词：抛弃"},{"w":"meadow","z":"草地","p":"n.","c":"自然场所","t":"word","f":2,"sp":2,"nt":"野草地，区别于 lawn"},{"w":"shore","z":"岸边","p":"n.","c":"自然场所","t":"word","f":2,"sp":1}]},{"id":"L2","level":"L2","name":"技术词汇","desc":"读英文技术文档会用到的词","items":[{"w":"deprecate","z":"弃用、标记为将废弃","p":"v.","c":"行为动词","t":"word","e":"This method is deprecated and will be removed in v3.0.","s":"配置说明","tp":"不是「不推荐」，是官方已经决定要删，只是还没删。看到它等于看到倒计时。区别于 discourage（劝阻，但你还能用）。","n":"认读"},{"w":"coerce","z":"强制转换（类型）","p":"v.","c":"行为动词","t":"word","e":"String values are coerced to numbers when the operator is applied.","s":"框架文档","tp":"系统悄悄把一种类型掰成另一种，不报错也不提示。跟 convert 的区别：coerce 是自动发生的，convert 是你显式调用。","n":"认读"},{"w":"propagate","z":"传播、向上冒泡","p":"v.","c":"行为动词","t":"word","e":"Exceptions thrown in the handler are propagated to the caller.","s":"框架文档","tp":"错误沿着调用链往外传，不是被吞掉。反向词是 swallow（吞掉、不往外抛）。读文档时这两个词决定你往哪里排查。","n":"认读"},{"w":"omit","z":"省略、不写","p":"v.","c":"行为动词","t":"word","e":"If omitted, the default timeout of 30 seconds applies.","s":"配置说明","tp":"你没填这个参数。If omitted 后面跟的几乎总是默认值——这类句子是配置表里最该看的一类。","n":"认读"},{"w":"retain","z":"保留、不释放","p":"v.","c":"行为动词","t":"word","e":"The cache retains entries for up to 24 hours.","s":"配置说明","tp":"留着不删。内存相关文档里常跟泄漏一起出现（retain a reference = 引用没释放）。跟 preserve 近义，retain 更强调「继续持有」。","n":"认读"},{"w":"sanitize","z":"清洗（输入）","p":"v.","c":"行为动词","t":"word","e":"All user input is sanitized before being rendered.","s":"安全文档","tp":"把危险字符剥掉再放行。跟 validate 不是一回事：validate 是判断合不合格、不合格就拒绝；sanitize 是动手改干净、然后照样放行。","n":"认读"},{"w":"invoke","z":"调用、触发","p":"v.","c":"行为动词","t":"word","e":"The callback is invoked once per event.","s":"API 文档","tp":"就是「调用」的书面说法，被动语态里高频（is invoked when...）。它和 called 完全等价，别当成什么特殊机制。","n":"认读"},{"w":"defer","z":"推迟、延后执行","p":"v.","c":"行为动词","t":"word","e":"Deferred tasks run only after the current transaction commits.","s":"框架文档","tp":"不是「放弃」，是「往后放」。读到它一定要找「放到什么时候」——文档通常紧跟 after / until 说明时机，这个时机常常就是踩坑点。","n":"认读"},{"w":"reconcile","z":"对账、使两边一致","p":"v.","c":"行为动词","t":"word","e":"The job reconciles local records with the upstream ledger every night.","s":"设计文档","tp":"两边数据对不上，跑个流程让它们重新一致。银行业务文档高频词。日常英语里它意思是「和好」，技术语境里跟感情无关。","n":"使用"},{"w":"augment","z":"增强、在原有基础上扩充","p":"v.","c":"行为动词","t":"word","e":"This flag augments the default behavior rather than replacing it.","s":"配置说明","tp":"加东西，不是换东西。关键是后半句 rather than replacing——遇到 augment 必须看它有没有这个对比，否则你会以为打开了就等于关掉了默认行为。","n":"认读"},{"w":"mitigate","z":"缓解、减轻（负面影响）","p":"v.","c":"行为动词","t":"word","e":"Rate limiting alone cannot mitigate a slow downstream.","s":"设计文档","tp":"减轻，不是解决。跟 alleviate 分工：mitigate 常配 risk / impact / effect，alleviate 常配 burden / pressure / pain。","n":"使用"},{"w":"incur","z":"招致、承担（成本或损失）","p":"v.","c":"行为动词","t":"word","e":"Each retry incurs an additional network round trip.","s":"性能文档","tp":"代价落到做这件事的人头上。文档里高频搭配 incur a cost / incur overhead / incur a penalty，主语几乎总是调用方。","n":"认读"},{"w":"entail","z":"必然涉及、意味着要付出","p":"v.","c":"行为动词","t":"word","e":"Strong consistency entails a coordination cost.","s":"论文","tp":"比 mean 重：不只是「意味着」，是「内在地必然包含这个代价」。权衡讨论里出现，说明作者在提醒你别只看好处。","n":"认读"},{"w":"render","z":"使变成（某种状态）","p":"v.","c":"行为动词","t":"word","e":"A null value renders the entire response invalid.","s":"API 文档","tp":"两个意思靠宾语判断：接形容词是「使变成」（render useless / invalid），接页面是「渲染」。别看到 render 就想到前端。","n":"认读"},{"w":"yield","z":"产生（结果）；让出（控制权）","p":"v.","c":"行为动词","t":"word","e":"The scheduler yields to higher-priority tasks.","s":"框架文档","tp":"三个意思：产生结果、让出 CPU、屈服。yield to 才是「让给」，单独 yield 多是「产生」。读文档时看有没有 to。","n":"认读"},{"w":"obscure","z":"使看不清、掩盖","p":"v.","c":"行为动词","t":"word","e":"Aggressive caching can obscure stale reads.","s":"设计文档","tp":"动词是「掩盖真实情况」，形容词才是「晦涩」。文档用它是警告：这个机制会让你看不到真正的问题。","n":"认读"},{"w":"hinder","z":"阻碍、拖慢","p":"v.","c":"行为动词","t":"word","e":"Excessive logging hinders throughput.","s":"性能文档","tp":"拖慢，但还能做。跟 prevent 区别：prevent 是彻底做不到，hinder 是能做但费劲。","n":"认读"},{"w":"impede","z":"妨碍、阻滞（进程）","p":"v.","c":"行为动词","t":"word","e":"The lock impedes progress under contention.","s":"论文","tp":"比 hinder 更书面，常配 progress / flow / traffic。读论文时它出现，通常意味着作者在讲某个机制的代价。","n":"认读"},{"w":"alleviate","z":"缓解（负担、压力）","p":"v.","c":"行为动词","t":"word","e":"Batching alleviates write pressure on the primary.","s":"设计文档","tp":"配的是「负担类」名词。跟 mitigate 的分工见 mitigate 那条，两个词在文档里经常挨着出现，别当成同义词糊过去。","n":"认读"},{"w":"circumvent","z":"绕过（规则、限制）","p":"v.","c":"行为动词","t":"word","e":"Clients can circumvent the limit by rotating keys.","s":"安全文档","tp":"不走正门，找漏洞绕过去。中性偏贬。安全文档里出现，说明这是个已被识别的绕过手法。","n":"认读"},{"w":"deteriorate","z":"恶化、变差（逐渐）","p":"v.","c":"行为动词","t":"word","e":"Latency deteriorates as the queue grows.","s":"运维文档","tp":"不及物，主语通常是性能、状态、健康度。强调「逐渐」变坏，不是突然崩。","n":"认读"},{"w":"proliferate","z":"迅速增多、泛滥","p":"v.","c":"行为动词","t":"word","e":"Unbounded retries proliferate failed requests.","s":"设计文档","tp":"贬义的「越来越多」，常描述问题自我复制。看到它在讲重试、告警、副本，基本就是在讲雪崩。","n":"认读"},{"w":"supersede","z":"取代（旧版本、旧标准）","p":"v.","c":"行为动词","t":"word","e":"This API supersedes the legacy endpoint.","s":"README","tp":"正式版「取代」。句式固定为 X supersedes Y，X 是新的。跟 replace 区别：supersede 含「旧的正式退场」这层意思。","n":"认读"},{"w":"constitute","z":"构成、算作","p":"v.","c":"行为动词","t":"word","e":"Retries constitute a new request.","s":"规范条文","tp":"用来定性：这件事算不算某种行为。规范文档里靠它划边界，读错会导致合规判断错。","n":"认读"},{"w":"designate","z":"指定、标记为","p":"v.","c":"行为动词","t":"word","e":"Fields designated as required must be present.","s":"配置说明","tp":"比 mark 正式，常见 designated as。文档里它后面跟的标签，就是系统认的那个字符串。","n":"认读"},{"w":"stipulate","z":"明文规定（条款）","p":"v.","c":"行为动词","t":"word","e":"The spec stipulates a maximum frame size.","s":"规范条文","tp":"规范专属词，主语通常是 spec / contract / clause。跟 prescribe 分工：stipulate 是「白纸黑字写着」，prescribe 是「要求你照做」。","n":"认读"},{"w":"prescribe","z":"规定（必须怎么做）","p":"v.","c":"行为动词","t":"word","e":"The protocol prescribes the order of these steps.","s":"规范条文","tp":"强制性的「规定做法」。日常英语里是「开药方」，技术语境里跟医疗无关。","n":"认读"},{"w":"mandate","z":"强制要求（自上而下）","p":"v.","c":"行为动词","t":"word","e":"The policy mandates encryption at rest.","s":"安全文档","tp":"主语是政策、法规、标准，不是人。比 require 强硬，等于「没得商量」。","n":"认读"},{"w":"enforce","z":"强制执行、实际去查","p":"v.","c":"行为动词","t":"word","e":"The gateway enforces a per-tenant quota.","s":"API 文档","tp":"跟 stipulate 是一对：stipulate 是写进文档，enforce 是真去拦。文档说「不强制」时，意味着你可以违反但后果自负。","n":"认读"},{"w":"prohibit","z":"禁止","p":"v.","c":"行为动词","t":"word","e":"The parser prohibits duplicate keys.","s":"规范条文","tp":"规则层面不允许。跟 prevent 区别：prohibit 是「不许」，prevent 是「挡住了、做不到」。","n":"认读"},{"w":"restrict","z":"限制（范围）","p":"v.","c":"行为动词","t":"word","e":"Access is restricted to internal networks.","s":"安全文档","tp":"收窄可用范围，常配 to。跟 limit 区别：restrict 偏「限定谁能用」，limit 偏「限定多少」。","n":"认读"},{"w":"exempt","z":"豁免、不适用","p":"v.","c":"行为动词","t":"word","e":"Health checks are exempt from rate limiting.","s":"API 文档","tp":"常配 from。读到它等于读到「这一类不走上面那条规则」——排查时漏掉豁免项是常见误区。","n":"认读"},{"w":"violate","z":"违反（规则、约束）","p":"v.","c":"行为动词","t":"word","e":"A payload that violates the schema is rejected.","s":"规范条文","tp":"常配 schema / constraint / policy。它后面跟的通常就是校验器要拦的东西。","n":"认读"},{"w":"breach","z":"突破（阈值）；违反（协议）","p":"v.","c":"行为动词","t":"word","e":"The queue breaches its threshold at 10k messages.","s":"运维文档","tp":"技术语境里多半是「超过上限」，不是「违约」。看到 breach threshold 就是告警要响了。","n":"认读"},{"w":"assume","z":"假设、假定","p":"v.","c":"行为动词","t":"word","e":"We assume that clocks are loosely synchronized.","s":"论文","tp":"文档里九成是「假设」不是「承担」。we assume that 是作者在声明前提——前提不成立，后面整段结论都作废。","n":"使用"},{"w":"presume","z":"推定、先这么认为","p":"v.","c":"行为动词","t":"word","e":"Absent a timeout, the client presumes success.","s":"规范条文","tp":"比 assume 更「没有证据也先这么办」。法律味重，规范里用它是在定默认行为。","n":"认读"},{"w":"imply","z":"暗示、逻辑上意味着","p":"v.","c":"行为动词","t":"word","e":"A 204 response implies there is no body.","s":"规范条文","tp":"跟 infer 方向相反：作者 imply（写出来让你推），读者 infer（你推出来）。文档里它是「结论已经在句子里了」。","n":"认读"},{"w":"infer","z":"推断（从证据出发）","p":"v.","c":"行为动词","t":"word","e":"Do not infer ordering from arrival time.","s":"设计文档","tp":"你根据线索自己推。这句话本身就是典型警告：别把「先到」当成「先发生」。","n":"认读"},{"w":"denote","z":"表示、指代（符号）","p":"v.","c":"行为动词","t":"word","e":"The prefix denotes the environment.","s":"规范条文","tp":"符号代表什么。数学和规范味重，读到它是在定义记号，跳过会看不懂后面的公式或表格。","n":"认读"},{"w":"attribute","z":"把 A 归因于 B","p":"v.","c":"行为动词","t":"word","e":"Latency is often attributed to the database.","s":"运维文档","tp":"方向别搞反：attribute A to B 是把 A 算到 B 头上。被动式 is attributed to 在复盘报告里极高频。","n":"使用"},{"w":"arise","z":"产生、出现（问题）","p":"v.","c":"行为动词","t":"word","e":"Errors arise when the schema drifts.","s":"设计文档","tp":"不及物，主语是问题。arise from 才是「源于」。跟 rise 不同：rise 是数值上升。","n":"认读"},{"w":"ensue","z":"随后发生（作为结果）","p":"v.","c":"行为动词","t":"word","e":"If the leader is unreachable, a re-election ensues.","s":"论文","tp":"正式书面的「接下来就有了」。句式常是 if X, Y ensues，Y 通常是作者想强调的后果。","n":"认读"},{"w":"precede","z":"先于、在……之前发生","p":"v.","c":"行为动词","t":"word","e":"Validation must precede persistence.","s":"规范条文","tp":"动词版的 prior to。读到它要注意「这两步有先后，不能换」。","n":"认读"},{"w":"succeed","z":"接替、继任","p":"v.","c":"行为动词","t":"word","e":"Version 3 succeeds version 2.","s":"README","tp":"这里不是「成功」，是「接……的班」。这是文档里最容易被读错的一个动词，看到 succeed 后面直接跟名词就要警觉。","n":"认读"},{"w":"marshal","z":"编排（对象转成可传输格式）","p":"v.","c":"行为动词","t":"word","e":"The framework marshals the struct into JSON.","s":"框架文档","tp":"把内存里的对象按格式排好、准备传出去。跟 serialize 近义，marshal 更强调「按既定格式摆位」。Java、Go 文档高频。","n":"认读"},{"w":"coincide","z":"同时发生、时间重合","p":"v.","c":"行为动词","t":"word","e":"The spike coincides with the deployment window.","s":"运维文档","tp":"两件事撞在同一时间。复盘时用它只说明时间重合，**不说明因果**——这点常被读成「就是它导致的」。","n":"认读"},{"w":"correlate","z":"相关（统计意义上）","p":"v.","c":"行为动词","t":"word","e":"Latency correlates with payload size.","s":"论文","tp":"只是同向变化，不是因果。论文里作者用 correlate 而不是 cause，就是在刻意留余地。","n":"认读"},{"w":"converge","z":"趋于一致、收敛","p":"v.","c":"行为动词","t":"word","e":"Replicas converge within a few seconds.","s":"设计文档","tp":"分布式语境里指各副本最终走到同一个值。跟 agree 不同：converge 强调过程，且不保证多快。","n":"认读"},{"w":"diverge","z":"分叉、偏离","p":"v.","c":"行为动词","t":"word","e":"The two branches diverge after the fork.","s":"设计文档","tp":"跟 converge 成对。数据、分支、实现都能用，核心是「本来一样，后来不一样了」。","n":"认读"},{"w":"oscillate","z":"反复震荡（在两点间来回）","p":"v.","c":"行为动词","t":"word","e":"The autoscaler oscillates between 2 and 4 pods.","s":"运维文档","tp":"有规律地来回。描述自动扩缩容抽风时几乎必用这个词，看到它就知道参数设得太敏感。","n":"认读"},{"w":"fluctuate","z":"波动（无规律起伏）","p":"v.","c":"行为动词","t":"word","e":"Throughput fluctuates with traffic.","s":"性能文档","tp":"跟 oscillate 区别：fluctuate 是没规律的上下起伏，oscillate 是有节奏地来回。","n":"认读"},{"w":"saturate","z":"饱和、打满","p":"v.","c":"行为动词","t":"word","e":"The connection pool saturates under load.","s":"性能文档","tp":"资源被占满，再加就没用了。常配 pool / link / CPU / bandwidth。","n":"认读"},{"w":"exhaust","z":"耗尽（资源）","p":"v.","c":"行为动词","t":"word","e":"Retries exhaust the connection pool.","s":"性能文档","tp":"用光到没有。跟 deplete 近义，exhaust 更彻底，常暗示「已经出事了」。","n":"认读"},{"w":"deplete","z":"消耗、使减少（储备）","p":"v.","c":"行为动词","t":"word","e":"Long-running jobs deplete the thread pool.","s":"运维文档","tp":"常配 pool / budget / quota / reserve。比 exhaust 温和，可以是逐渐的。","n":"认读"},{"w":"accumulate","z":"累积、堆积","p":"v.","c":"行为动词","t":"word","e":"Unacknowledged messages accumulate in the queue.","s":"设计文档","tp":"多指「没被消费掉的东西越堆越多」。看到它要顺手找「谁在消费，为什么跟不上」。","n":"认读"},{"w":"allocate","z":"分配（内存、资源）","p":"v.","c":"行为动词","t":"word","e":"The runtime allocates a buffer per request.","s":"性能文档","tp":"划拨资源。跟 assign 区别：allocate 给的是资源，assign 给的是任务或人。","n":"认读"},{"w":"reclaim","z":"回收（已不用的资源）","p":"v.","c":"行为动词","t":"word","e":"The GC reclaims unreachable objects.","s":"框架文档","tp":"GC 语境的标准词。跟 free 区别：reclaim 强调「系统自己发现没用了，主动收回」。","n":"认读"},{"w":"evict","z":"逐出（缓存条目）","p":"v.","c":"行为动词","t":"word","e":"The cache evicts the least recently used entry.","s":"配置说明","tp":"空间不够被赶走，不是主动删。跟 delete 区别：evict 是策略行为，你会因此丢数据但不该意外。","n":"认读"},{"w":"purge","z":"彻底清除（批量、定期）","p":"v.","c":"行为动词","t":"word","e":"Expired rows are purged nightly.","s":"运维文档","tp":"比 delete 强硬，通常不可恢复。看到它要确认「有没有备份，能不能反悔」。","n":"认读"},{"w":"flush","z":"刷盘、把缓冲区写出去","p":"v.","c":"行为动词","t":"word","e":"The writer flushes buffered data to disk.","s":"框架文档","tp":"不是「冲洗」，是把还在内存里的东西真正落下去。跟 commit 区别：flush 只保证写出去了，不保证事务成立。","n":"使用"},{"w":"persist","z":"持久化、存到不丢的地方","p":"v.","c":"行为动词","t":"word","e":"The session is persisted to a backing store.","s":"设计文档","tp":"关键是「进程重启后还在」。跟 save 区别：persist 强调的是这个保证，不是动作本身。","n":"认读"},{"w":"replay","z":"重放（把历史消息再跑一遍）","p":"v.","c":"行为动词","t":"word","e":"The consumer replays messages from the offset.","s":"设计文档","tp":"用于恢复和补数据。读文档时要看「重放会不会重复处理」——这正是幂等要解决的问题。","n":"认读"},{"w":"truncate","z":"截断（超长部分直接砍掉）","p":"v.","c":"行为动词","t":"word","e":"Values longer than the limit are truncated.","s":"API 文档","tp":"砍掉且通常不报错。这是静默数据丢失的常见来源，看到 truncate 要确认有没有告警。","n":"认读"},{"w":"resume","z":"恢复、从暂停处继续","p":"v.","c":"行为动词","t":"word","e":"The job resumes from the last checkpoint.","s":"框架文档","tp":"接着干。跟 recover 区别：resume 是从断点继续，recover 是修复损坏后再继续。","n":"认读"},{"w":"abort","z":"中止（异常中断）","p":"v.","c":"行为动词","t":"word","e":"The transaction aborts on a constraint violation.","s":"框架文档","tp":"因为出错而中断。跟 cancel 区别：cancel 是主动不干了，abort 是被迫停。","n":"认读"},{"w":"suspend","z":"挂起（暂停但保留状态）","p":"v.","c":"行为动词","t":"word","e":"The thread is suspended until the lock is free.","s":"框架文档","tp":"暂停之后还能恢复。跟 stop 区别：suspend 是可逆的，状态还在。","n":"认读"},{"w":"terminate","z":"终止（彻底结束）","p":"v.","c":"行为动词","t":"word","e":"The process terminates after three failed probes.","s":"运维文档","tp":"不再恢复。跟 abort 区别：terminate 可以是正常收尾也可以是强杀，abort 一定带异常色彩。","n":"认读"},{"w":"escalate","z":"升级（把问题往上转）","p":"v.","c":"行为动词","t":"word","e":"Unresolved alerts escalate to the on-call engineer.","s":"运维文档","tp":"告警和工单语境里是「往上转交」，不是「加剧」。同一个词在论文里才可能是「使恶化」。","n":"认读"},{"w":"dispatch","z":"派发（把请求分给处理者）","p":"v.","c":"行为动词","t":"word","e":"The router dispatches the request to a shard.","s":"框架文档","tp":"分发动作。跟 delegate 区别：dispatch 分发任务，delegate 转移责任。","n":"认读"},{"w":"delegate","z":"委托（把职责转给别人）","p":"v.","c":"行为动词","t":"word","e":"The proxy delegates authentication to the gateway.","s":"框架文档","tp":"把「该谁负责」这件事转出去。读到它要顺着找「最终是谁干的」。","n":"认读"},{"w":"arbitrate","z":"仲裁（多方冲突时定一个）","p":"v.","c":"行为动词","t":"word","e":"The leader arbitrates conflicting writes.","s":"设计文档","tp":"主节点语境。核心含义是「有冲突时由我裁决」，所以仲裁者必须唯一。","n":"认读"},{"w":"prune","z":"修剪、裁掉多余的","p":"v.","c":"行为动词","t":"word","e":"Old snapshots are pruned on a schedule.","s":"运维文档","tp":"按规则砍掉不要的。跟 purge 区别：prune 是按策略裁，purge 是清干净。","n":"认读"},{"w":"throttle","z":"限速（主动压低速率）","p":"v.","c":"行为动词","t":"word","e":"The client throttles outbound calls to 50 per second.","s":"配置说明","tp":"主动把速度压下来。跟 rate limiting 分工：rate limiting 是规则，throttle 是执行这个规则的动作。","n":"认读"},{"w":"cap","z":"设上限（封顶）","p":"v.","c":"行为动词","t":"word","e":"The batch size is capped at 1000.","s":"配置说明","tp":"比 limit 形象：到顶就不再加了。常配 at，后面跟具体数值。","n":"认读"},{"w":"degrade","z":"降级、变差","p":"v.","c":"行为动词","t":"word","e":"Throughput degrades gracefully as nodes drop.","s":"设计文档","tp":"性能或功能往下掉。degrade gracefully 是固定说法，意思是「掉得可控、不崩」。","n":"认读"},{"w":"enhance","z":"增强、提升","p":"v.","c":"行为动词","t":"word","e":"Compression enhances throughput at the cost of CPU.","s":"README","tp":"比 improve 正式，常配 performance / throughput / security。看到它要顺手找 at the cost of。","n":"认读"},{"w":"extend","z":"扩展（在原有基础上加）","p":"v.","c":"行为动词","t":"word","e":"Plugins extend the base behavior.","s":"框架文档","tp":"加长、加功能，原样保留。跟 augment 近义，extend 更偏「加范围」，augment 更偏「加能力」。","n":"认读"},{"w":"supplement","z":"补充（不替代）","p":"v.","c":"行为动词","t":"word","e":"Logs supplement, but do not replace, metrics.","s":"设计文档","tp":"这句话的关键是 but do not replace。看到 supplement 一定要找有没有这个否定，否则你会以为二选一。","n":"认读"},{"w":"constrain","z":"约束、限制（范围）","p":"v.","c":"行为动词","t":"word","e":"The budget constrains how often we retry.","s":"论文","tp":"比 restrict 书面，常用于设计权衡：「什么约束了什么」。读论文时它标记着方案的边界条件。","n":"认读"},{"w":"leverage","z":"借助（已有资源撬动效果）","p":"v.","c":"行为动词","t":"word","e":"The design leverages an existing index.","s":"设计文档","tp":"不是简单的「使用」，暗含「用它换来更大收益」。被滥用到近乎空话，但读的时候要知道作者在强调「复用了现成的东西」。","n":"使用"},{"w":"negligible","z":"可忽略的、小到不用管","p":"adj.","c":"状态与程度","t":"word","e":"The overhead is negligible for payloads under 1 MB.","s":"性能文档","tp":"小到不用管。但它通常是有条件的——后面跟一个适用范围，超了就不成立。这是文档里最容易被当成「永远没事」的词。","n":"认读"},{"w":"pronounced","z":"明显的、显著的","p":"adj.","c":"状态与程度","t":"word","e":"The difference becomes pronounced under high contention.","s":"性能文档","tp":"不是「发音的」，是「明显的」。跟 negligible 刚好是一对反义词，两个都用来描述性能差异的大小。","n":"认读"},{"w":"granular","z":"细粒度的","p":"adj.","c":"状态与程度","t":"word","e":"Permissions can be granted at a more granular level.","s":"权限文档","tp":"颗粒度细，能管到更小的单位。反义是 coarse-grained（粗粒度、整块管）。权限、锁、缓存文档里反复出现。","n":"认读"},{"w":"stale","z":"过期的、不是最新的","p":"adj.","c":"状态与程度","t":"word","e":"Reads may return stale data during failover.","s":"一致性文档","tp":"数据还在，只是旧了，不是「错误数据」。这个区别直接决定你要不要报警——stale 往往是设计上允许的。","n":"认读"},{"w":"implicit","z":"隐式的、系统自动做的","p":"adj.","c":"状态与程度","t":"word","e":"An implicit transaction is started if none exists.","s":"框架文档","tp":"你没写，系统替你做了。跟 explicit（显式）成对。文档里说 implicit 的地方，往往就是「为什么多了一步」的答案。","n":"认读"},{"w":"volatile","z":"易失的；随时可能被改的","p":"adj.","c":"状态与程度","t":"word","e":"Values stored in this field are volatile and lost on restart.","s":"配置说明","tp":"两个含义必须靠上下文分：存储层面是「重启就没」，并发层面是「随时可能被别的线程改」。存储、缓存文档里基本是前者。","n":"认读"},{"w":"exhaustive","z":"穷尽的、一个不漏的","p":"adj.","c":"状态与程度","t":"word","e":"This is not an exhaustive list of supported formats.","s":"README","tp":"全列出来了、没有遗漏。文档里最常见反而是否定式 not exhaustive——意思是「还有别的，别拿这份当全集」。看到它就别拿这份清单去写死校验。","n":"认读"},{"w":"explicit","z":"显式的、你亲手写出来的","p":"adj.","c":"状态与程度","t":"word","e":"The transaction boundary must be made explicit.","s":"框架文档","tp":"跟 implicit 成对。文档里说 must be made explicit 的地方，等于说「默认那套靠不住，你得自己写清楚」。","n":"认读"},{"w":"redundant","z":"多余的、可以去掉的","p":"adj.","c":"状态与程度","t":"word","e":"The second check is redundant and will be removed.","s":"设计文档","tp":"代码和校验里说 redundant 是贬义：白做了、可以删。别跟「冗余备份」混淆——那是刻意做的容错。","n":"认读"},{"w":"deterministic","z":"确定性的（同输入必同输出）","p":"adj.","c":"状态与程度","t":"word","e":"Iteration order is not deterministic across runs.","s":"框架文档","tp":"给定相同输入必然得相同结果。文档说不保证 deterministic，就是在说「别指望顺序固定」，你的代码不能依赖它。","n":"认读"},{"w":"nondeterministic","z":"不确定的（每次可能不同）","p":"adj.","c":"状态与程度","t":"word","e":"Results are nondeterministic under concurrency.","s":"设计文档","tp":"跟 random 不同：nondeterministic 是「没规定」，可能来自调度、哈希顺序、线程竞争，不代表真的随机。","n":"认读"},{"w":"atomic","z":"原子的（要么全做要么全不做）","p":"adj.","c":"状态与程度","t":"word","e":"The operation is atomic: it either fully applies or not at all.","s":"规范条文","tp":"不是「很小」。技术里指不可分割：中间态对别人不可见，失败就整体回滚。","n":"认读"},{"w":"consistent","z":"一致的（读到的符合预期）","p":"adj.","c":"状态与程度","t":"word","e":"Reads are consistent within a single partition.","s":"一致性文档","tp":"单独出现很含糊，一定要看它跟谁比、在什么范围内。consistent within a partition 就说明跨分区不保证。","n":"使用"},{"w":"eventual","z":"最终的（迟早会，但没承诺多久）","p":"adj.","c":"状态与程度","t":"word","e":"The index is eventually consistent with the source table.","s":"设计文档","tp":"重点在「最终」没有时间承诺：可能几毫秒，也可能几分钟。最常被读成「很快就好」。","n":"使用"},{"w":"transient","z":"瞬时的、一闪而过的","p":"adj.","c":"状态与程度","t":"word","e":"Transient failures are retried automatically.","s":"框架文档","tp":"故障分类的标准词：transient failure 重试就行，persistent failure 重试没用。分清这两个能省掉一半无效重试。","n":"使用"},{"w":"persistent","z":"持久的、一直存在的","p":"adj.","c":"状态与程度","t":"word","e":"Persistent connections reduce handshake overhead.","s":"框架文档","tp":"两个用法：连接和存储是「长期保持」，失败是「一直不消失」。跟 transient 成对，正好卡住两个方向。","n":"认读"},{"w":"immutable","z":"不可变的（创建后不能改）","p":"adj.","c":"状态与程度","t":"word","e":"Once written, the record is immutable.","s":"设计文档","tp":"只能新建、不能修改。并发和函数式语境的核心词，读到它意味着「更新 = 写一条新的」。","n":"认读"},{"w":"mutable","z":"可变的（能改）","p":"adj.","c":"状态与程度","t":"word","e":"The config object is mutable at runtime.","s":"框架文档","tp":"跟 immutable 成对。共享可变状态是并发问题的根源，文档强调 mutable 时通常在提醒你注意同步。","n":"认读"},{"w":"sequential","z":"顺序的、一个接一个","p":"adj.","c":"状态与程度","t":"word","e":"IDs are assigned sequentially.","s":"API 文档","tp":"讲的是次序。跟 synchronous 不是一回事：sequential 管先后，synchronous 管要不要等。","n":"认读"},{"w":"concurrent","z":"并发的（同时推进）","p":"adj.","c":"状态与程度","t":"word","e":"Concurrent writes to the same key are serialized.","s":"设计文档","tp":"同时推进，不一定是同时执行。跟 parallel 区别：concurrent 是「看起来同时在处理」，parallel 是「真的同时跑」。","n":"使用"},{"w":"synchronous","z":"同步的（调用方要等结果）","p":"adj.","c":"状态与程度","t":"word","e":"The call is synchronous and blocks until completion.","s":"API 文档","tp":"中文「同步」有两个意思会打架：这里是「等结果」，不是「数据同步」。看到它先想「谁在等谁」。","n":"认读"},{"w":"asynchronous","z":"异步的（先返回，结果later）","p":"adj.","c":"状态与程度","t":"word","e":"Events are delivered asynchronously.","s":"框架文档","tp":"不等，先应一声，结果之后再来。跟 synchronous 成对，读到它要找「结果从哪回来」。","n":"认读"},{"w":"upstream","z":"上游的（向我发请求的一方）","p":"adj.","c":"状态与程度","t":"word","e":"The upstream service returns 502s.","s":"运维文档","tp":"方向极易搞反：upstream 是「请求的来源」，也就是我的调用方。判断方法：顺着数据流往回流的方向。","n":"使用"},{"w":"downstream","z":"下游的（我调用的那一方）","p":"adj.","c":"状态与程度","t":"word","e":"A slow downstream stalls the whole pipeline.","s":"运维文档","tp":"跟 upstream 成对。记住一句就够：upstream 是找我要东西的，downstream 是我找它要东西的。","n":"使用"},{"w":"idle","z":"空闲的（没在干活）","p":"adj.","c":"状态与程度","t":"word","e":"Idle connections are closed after 60 seconds.","s":"配置说明","tp":"闲着。idle timeout 是「闲太久就断开」，跟 max lifetime（活太久就断开）是两种完全不同的机制。","n":"认读"},{"w":"degraded","z":"降级的（还能用但打折扣）","p":"adj.","c":"状态与程度","t":"word","e":"The cluster is in a degraded state.","s":"运维文档","tp":"跟 down 区别很大：degraded 是没死，只是不行了。告警分级里这两个词决定你半夜起不起床。","n":"认读"},{"w":"resilient","z":"有韧性的（能扛住部分故障）","p":"adj.","c":"状态与程度","t":"word","e":"The pipeline is resilient to single-node failure.","s":"设计文档","tp":"强调「坏了还能活」。跟 robust 区别：resilient 偏组件挂了仍能撑，robust 偏输入再烂也不出错。","n":"认读"},{"w":"robust","z":"健壮的、不容易崩","p":"adj.","c":"状态与程度","t":"word","e":"The parser is robust against malformed input.","s":"框架文档","tp":"常配 against，后面跟它扛得住的东西。文档说 robust 时，等于承诺「这种输入不会让它挂」。","n":"认读"},{"w":"brittle","z":"脆的、一碰就坏","p":"adj.","c":"状态与程度","t":"word","e":"The test is brittle: it breaks on any formatting change.","s":"README","tp":"架构和测试讨论里的批评词。说某个设计 brittle，是在说它依赖了太多偶然成立的前提。","n":"认读"},{"w":"coarse-grained","z":"粗粒度的（整块处理）","p":"adj.","c":"状态与程度","t":"word","e":"Coarse-grained locks reduce overhead but hurt concurrency.","s":"设计文档","tp":"跟 fine-grained / granular 成对。锁、权限、服务划分都用这一对词，读到就要找 but 后面的代价。","n":"认读"},{"w":"lossy","z":"有损的（压缩后不可还原）","p":"adj.","c":"状态与程度","t":"word","e":"Compression is lossy and cannot be reversed.","s":"设计文档","tp":"跟 lossless 成对。日志、指标、链路追踪文档里出现，意味着精度被牺牲过了。","n":"认读"},{"w":"backwards-compatible","z":"向后兼容的（旧用法还能用）","p":"adj.","c":"状态与程度","t":"word","e":"The change is backwards-compatible.","s":"README","tp":"方向别搞反：是「新版本兼容老客户端」，不是「老版本能读新数据」。升级决策全靠这个词。","n":"使用"},{"w":"marginal","z":"边际的、很有限的","p":"adj.","c":"状态与程度","t":"word","e":"The gain is marginal below 1k requests.","s":"性能文档","tp":"比 negligible 大一点，但仍不足以改变决策。看到它等于看到「这条路走不通，别投入了」。","n":"认读"},{"w":"substantial","z":"可观的、相当大的","p":"adj.","c":"状态与程度","t":"word","e":"Batching yields a substantial reduction in overhead.","s":"性能文档","tp":"跟 negligible 正好相反。**但它是定性词，没有数字**——看到 substantial 要去别处找具体指标。","n":"认读"},{"w":"excessive","z":"过度的（超过合理量）","p":"adj.","c":"状态与程度","t":"word","e":"Excessive retries amplify the outage.","s":"设计文档","tp":"用来解释「本来是小故障，怎么就雪崩了」。读到它通常意味着某个参数设大了。","n":"认读"},{"w":"sufficient","z":"足够的","p":"adj.","c":"状态与程度","t":"word","e":"A single replica is sufficient for this workload.","s":"设计文档","tp":"跟 enough 同义但更书面，规范文档高频。注意它常常隐含条件（for this workload），条件一变就不够了。","n":"认读"},{"w":"mandatory","z":"强制的、必填的","p":"adj.","c":"状态与程度","t":"word","e":"The header is mandatory for all requests.","s":"API 文档","tp":"跟 optional 成对。API 文档里这一对词直接决定你传不传、传错了会不会 400。","n":"认读"},{"w":"optional","z":"可选的","p":"adj.","c":"状态与程度","t":"word","e":"The field is optional and defaults to null.","s":"API 文档","tp":"可以不传。看到它要顺手找默认值，因为「不传」和「传空」在很多系统里行为不同。","n":"认读"},{"w":"pending","z":"待处理的、悬而未决的","p":"adj.","c":"状态与程度","t":"word","e":"Pending writes are flushed on shutdown.","s":"设计文档","tp":"状态机里的标准状态：已经收了但还没办完。读到它要想「什么时候会办完，办不完会怎样」。","n":"认读"},{"w":"imminent","z":"即将发生的（多指坏事）","p":"adj.","c":"状态与程度","t":"word","e":"The alert fires when disk exhaustion is imminent.","s":"运维文档","tp":"马上要出事。告警阈值描述专用，语气是「现在动手还来得及」。","n":"认读"},{"w":"whereas","z":"而、然而（对比两件事）","p":"conj.","c":"逻辑连接","t":"word","e":"Reads are served from replicas, whereas writes must go to the primary.","s":"设计文档","tp":"连接两个相反的事实，重点在后半句。读长句时它是最干净的切分点——看到它就把句子劈成两半，一半一半读。","n":"认读"},{"w":"thereby","z":"从而、由此（带来某个结果）","p":"adv.","c":"逻辑连接","t":"word","e":"Requests are batched, thereby reducing round trips.","s":"设计文档","tp":"引出结果，不是原因。前面是做法，后面是它顺手带来的好处。跟 therefore 的区别：therefore 接推论，thereby 接「附带产生的效果」。","n":"认读"},{"w":"albeit","z":"尽管、虽然（书面）","p":"conj.","c":"逻辑连接","t":"word","e":"This works, albeit with higher latency.","s":"论文","tp":"等于 although，但后面只能接短语、不能接完整句子。作者用它是在承认一个缺点又不想把句子拉长——所以它后面跟的往往就是坑，别跳过。","n":"认读"},{"w":"provided that","z":"前提是、只要……就成立","p":"conj. phrase","c":"逻辑连接","t":"phrase","e":"Retries are safe provided that the operation is idempotent.","s":"规范条文","tp":"限定条件，不是让步。前面的结论只在后面成立时才算数。看到它等于看到免责声明，忽略它就会把有条件的结论当成无条件的经验。","n":"认读"},{"w":"unless otherwise","z":"除非另有（规定）","p":"phrase","c":"逻辑连接","t":"phrase","e":"Unless otherwise specified, all endpoints require authentication.","s":"API 文档","tp":"文档里最高频的开场白之一，作用是「以下规则默认全部生效」。反过来推：既然有默认，就说明上面或下面还写着特例。","n":"认读"},{"w":"as opposed to","z":"而不是、相对于","p":"phrase","c":"逻辑连接","t":"phrase","e":"This is a soft limit as opposed to a hard cap.","s":"设计文档","tp":"明确划界限，后半句是「它不是什么」。技术文档里专门用来区分两个容易混的机制，最适合整组抄进笔记。","n":"认读"},{"w":"accordingly","z":"相应地、因此需要","p":"adv.","c":"逻辑连接","t":"word","e":"The limit was lowered; accordingly, batch sizes must be reduced.","s":"规范条文","tp":"因为上面变了，所以下面要跟着变。它标志着一个「由此产生的义务」，读到它要回头找「因为什么」。","n":"认读"},{"w":"hence","z":"由此、因此（所以就有了）","p":"adv.","c":"逻辑连接","t":"word","e":"The cache is per-process; hence the inconsistency across workers.","s":"设计文档","tp":"常直接接名词短语，不接完整句子（hence the name / hence the delay）。跟 therefore 区别：therefore 是「推导出」，hence 更像「所以就有了」。","n":"认读"},{"w":"thus","z":"这样一来、从而","p":"adv.","c":"逻辑连接","t":"word","e":"The leader steps down, thus allowing a new election.","s":"设计文档","tp":"强调「这么做，结果如此」，语气比 therefore 轻。常出现在 thus allowing / thus making 这类分词结构前。","n":"认读"},{"w":"therefore","z":"因此（严格的逻辑推论）","p":"adv.","c":"逻辑连接","t":"word","e":"The lock is not reentrant; therefore nested calls deadlock.","s":"规范条文","tp":"三个「因此」里它最硬：前提成立，结论必然成立。作者用它是在做推理，不是在陈述后果。","n":"使用"},{"w":"consequently","z":"结果、因此（强调后果）","p":"adv.","c":"逻辑连接","t":"word","e":"The queue filled up; consequently, producers were blocked.","s":"运维文档","tp":"强调后果，而且通常是不好的后果。语气比 therefore 重，多出现在故障描述里。","n":"认读"},{"w":"conversely","z":"反过来（关系对调也成立）","p":"adv.","c":"逻辑连接","t":"word","e":"Reads scale horizontally; conversely, writes do not.","s":"设计文档","tp":"不是「相反」，是「换个方向看同样成立」。读到它要把前面句子的主宾对调再理解一遍。","n":"认读"},{"w":"likewise","z":"同样地、同理","p":"adv.","c":"逻辑连接","t":"word","e":"The same applies to writes; likewise, deletes must be logged.","s":"规范条文","tp":"把前面的结论平移到另一个对象上。看到它就不必重读细节，但要确认「平移的前提是不是也成立」。","n":"认读"},{"w":"namely","z":"即、也就是","p":"adv.","c":"逻辑连接","t":"word","e":"Only one component, namely the coordinator, holds the lock.","s":"设计文档","tp":"后面是对前面的具体化，不是补充新信息。等于 i.e.，但更自然。","n":"认读"},{"w":"notwithstanding","z":"尽管（有这件事，结论不变）","p":"prep.","c":"逻辑连接","t":"word","e":"Notwithstanding the retry, the request eventually failed.","s":"论文","tp":"书面到有点老派，规范里仍常见。可放句首也可放句尾（the retry notwithstanding）。核心是「让步但结论不改」。","n":"认读"},{"w":"nonetheless","z":"尽管如此（仍然）","p":"adv.","c":"逻辑连接","t":"word","e":"The API is deprecated; nonetheless, it remains widely used.","s":"README","tp":"跟 nevertheless 几乎同义，nonetheless 更常出现在「承认事实，但事实不影响结论」的句式里。","n":"认读"},{"w":"nevertheless","z":"然而、不过","p":"adv.","c":"逻辑连接","t":"word","e":"The overhead is small; nevertheless, it compounds under load.","s":"设计文档","tp":"比 however 正式。用法是「前面说的对，但我要补一条相反的」——所以它后面往往才是作者真正想说的。","n":"认读"},{"w":"moreover","z":"而且（补充更重要的一条）","p":"adv.","c":"逻辑连接","t":"word","e":"The call is synchronous; moreover, it has no timeout.","s":"设计文档","tp":"递进，加的是「更严重的一条」。跟 furthermore 区别：moreover 加重，furthermore 只是还有。","n":"认读"},{"w":"furthermore","z":"此外（还有一条）","p":"adv.","c":"逻辑连接","t":"word","e":"Furthermore, the cache is not invalidated on update.","s":"设计文档","tp":"继续堆论据，不强调更强。作者用它是在列清单，跳过它可能漏掉一个并列的坑。","n":"认读"},{"w":"in turn","z":"反过来、进而（连锁反应）","p":"phrase","c":"逻辑连接","t":"phrase","e":"Each retry doubles the load, which in turn triggers more retries.","s":"设计文档","tp":"描述 A 导致 B、B 又导致 C 的链条。看到它说明这里有正反馈，也就是雪崩的结构。","n":"使用"},{"w":"rather than","z":"而不是（选择关系）","p":"phrase","c":"逻辑连接","t":"phrase","e":"Fail fast rather than retry indefinitely.","s":"设计文档","tp":"前后结构要对等，说的是两种做法的取舍。跟 instead of 区别：rather than 更书面，且前后常接动词原形。","n":"使用"},{"w":"given that","z":"鉴于、考虑到（当作前提）","p":"phrase","c":"逻辑连接","t":"phrase","e":"Given that clocks drift, timestamps cannot order events.","s":"论文","tp":"跟 provided that 区别：given that 是「已知事实」，provided that 是「必须满足的条件」。前者接受现实，后者设定门槛。","n":"认读"},{"w":"in the event of","z":"万一发生（低概率但严重）","p":"phrase","c":"逻辑连接","t":"phrase","e":"In the event of a split brain, writes are rejected.","s":"设计文档","tp":"后面接名词，不接句子。语气是「大概率不会，但真发生了按这个来」。","n":"认读"},{"w":"otherwise","z":"否则（不这么做就出问题）","p":"adv.","c":"逻辑连接","t":"word","e":"Set a timeout; otherwise the call may hang forever.","s":"API 文档","tp":"它后面跟的通常是恶果，是文档里最该抄下来的一句。看到 otherwise 就把后半句当警告读。","n":"使用"},{"w":"by contrast","z":"相比之下（两个方案对比）","p":"phrase","c":"逻辑连接","t":"phrase","e":"By contrast, a message queue decouples producers from consumers.","s":"论文","tp":"跟 on the contrary 区别很大：by contrast 是「两者不同」，on the contrary 是「你说反了」。中文都译「相反」但用法不通用。","n":"认读"},{"w":"be subject to","z":"受……约束；可能遭受","p":"phrase","c":"固定搭配","t":"phrase","e":"All requests are subject to rate limiting.","s":"API 文档","tp":"两个含义要分清：一是「受规则约束」（被限流），二是「可能发生」（subject to change = 随时会变）。技术文档里九成是前者。看到它就等于看到这里有个上限。","n":"使用"},{"w":"comply with","z":"符合、遵守（外部规范）","p":"phrase","c":"固定搭配","t":"phrase","e":"The client must comply with the HTTP/2 framing rules.","s":"规范条文","tp":"遵守别人定的标准。三兄弟分清：comply with 是遵守条文；conform to 是符合既定规格（偏形状、格式）；adhere to 是坚持遵守，语气最强最书面。","n":"使用"},{"w":"in accordance with","z":"按照、依据","p":"phrase","c":"固定搭配","t":"phrase","e":"Logs are rotated in accordance with the retention policy.","s":"运维文档","tp":"「依据某个东西来做」。含义上等于 according to，但更正式，合规和法律文本里几乎只用这个。别以为它暗示了额外机制。","n":"认读"},{"w":"prior to","z":"在……之前","p":"phrase","c":"固定搭配","t":"phrase","e":"Validate the payload prior to writing to storage.","s":"设计文档","tp":"就是 before 的书面版。用它是为了强调顺序先后，读到它要注意「这两步不能换顺序」。","n":"使用"},{"w":"conform to","z":"符合（既定规格、格式）","p":"phrase","c":"固定搭配","t":"phrase","e":"The payload must conform to the schema.","s":"规范条文","tp":"长成规定该有的样子。跟 comply with 分工：conform to 讲形状格式，comply with 讲遵守条文。","n":"认读"},{"w":"adhere to","z":"坚持遵守（语气最强）","p":"phrase","c":"固定搭配","t":"phrase","e":"All services adhere to the same naming convention.","s":"规范条文","tp":"三个「遵守」里它最书面、语气最重，含「持续主动照做」的意思。日常英语里是「粘住」，技术语境跟粘性无关。","n":"认读"},{"w":"with respect to","z":"关于、就……而言","p":"phrase","c":"固定搭配","t":"phrase","e":"With respect to latency, the two designs are equivalent.","s":"论文","tp":"切换话题用，不引入新信息。等于 regarding。读到它就说明作者要开始分维度讲了。","n":"认读"},{"w":"with regard to","z":"关于","p":"phrase","c":"固定搭配","t":"phrase","e":"No changes were made with regard to the public API.","s":"README","tp":"跟 with respect to 几乎同义。注意是 regard 不是 regards——加 s 是「问候」，文档里写错的人不少。","n":"认读"},{"w":"in terms of","z":"就……这个维度而言","p":"phrase","c":"固定搭配","t":"phrase","e":"In terms of memory, the trade-off is unfavorable.","s":"论文","tp":"限定比较维度。读到它要知道「这句话只在这个维度成立」，换个维度结论可能相反。","n":"使用"},{"w":"in the context of","z":"在……的语境、前提下","p":"phrase","c":"固定搭配","t":"phrase","e":"In the context of a retry, the timestamp is stale.","s":"设计文档","tp":"相当于「这句话只在这个场景里成立」。文档用它收窄适用范围，别读成普适结论。","n":"认读"},{"w":"at the expense of","z":"以……为代价","p":"phrase","c":"固定搭配","t":"phrase","e":"Throughput improved at the expense of latency.","s":"性能文档","tp":"权衡讨论的核心句：前半是得到的，后半是失去的。中文文档常译「牺牲」，读的时候一定要把损失那半看清。","n":"使用"},{"w":"in favor of","z":"选择 A 而放弃 B","p":"phrase","c":"固定搭配","t":"phrase","e":"The team dropped the cache in favor of a read replica.","s":"设计文档","tp":"**方向极易搞反**：in favor of 后面跟的是「新选的」，前面是被放弃的。drop X in favor of Y = 放弃 X 选 Y。","n":"使用"},{"w":"in light of","z":"鉴于、根据（新信息）","p":"phrase","c":"固定搭配","t":"phrase","e":"In light of the incident, the limit was lowered.","s":"运维文档","tp":"后面接名词，意思是「因为出现了这个情况，所以调整」。跟 given that 近义，但更常用于复盘和通知。","n":"认读"},{"w":"by means of","z":"通过……手段","p":"phrase","c":"固定搭配","t":"phrase","e":"Authentication is performed by means of a signed token.","s":"规范条文","tp":"说明实现手段，书面。跟 by 的区别只是更正式，没有额外含义，别过度解读。","n":"认读"},{"w":"in conjunction with","z":"与……配合使用","p":"phrase","c":"固定搭配","t":"phrase","e":"The index is used in conjunction with the partition key.","s":"设计文档","tp":"不是「代替」，是两个一起用才有效。读到它要确认「单独用行不行」。","n":"认读"},{"w":"along with","z":"连同、和……一起","p":"phrase","c":"固定搭配","t":"phrase","e":"The migration runs along with the schema check.","s":"运维文档","tp":"比 and 更强调「附带一起」。有时暗示主次：前面是主要的，along with 后面是捎带的。","n":"认读"},{"w":"in addition to","z":"除……之外还有（叠加）","p":"phrase","c":"固定搭配","t":"phrase","e":"In addition to retries, the client applies a backoff.","s":"设计文档","tp":"是「加上」，不是「除了不要」。跟 except for 完全相反，这两个短语混了会读反整句。","n":"认读"},{"w":"regardless of","z":"不管（条件不影响结果）","p":"phrase","c":"固定搭配","t":"phrase","e":"The job runs regardless of the previous result.","s":"设计文档","tp":"无条件执行。读到它意味着「你不用判断，反正都会跑」。","n":"认读"},{"w":"irrespective of","z":"不论（同 regardless of，更书面）","p":"phrase","c":"固定搭配","t":"phrase","e":"The limit applies irrespective of the client type.","s":"规范条文","tp":"跟 regardless of 同义，规范文档里更常见。看到它说明规则没有例外。","n":"认读"},{"w":"prone to","z":"易于发生（坏事）","p":"phrase","c":"固定搭配","t":"phrase","e":"The design is prone to thundering herds.","s":"设计文档","tp":"主语是「容易出问题的那个东西」。跟 likely to 区别：prone to 一定带贬义，说的都是毛病。","n":"认读"},{"w":"susceptible to","z":"易受……影响","p":"phrase","c":"固定搭配","t":"phrase","e":"The cache is susceptible to stampedes.","s":"设计文档","tp":"比 prone to 更强调「外部因素能影响到它」。常用来提示某个机制在特定压力下会失效。","n":"认读"},{"w":"vulnerable to","z":"易受攻击（安全语境）","p":"phrase","c":"固定搭配","t":"phrase","e":"The endpoint is vulnerable to replay attacks.","s":"安全文档","tp":"三个「易」里只有它专指安全漏洞。看到 vulnerable to 就该去查有没有 CVE。","n":"认读"},{"w":"attributable to","z":"可归因于","p":"phrase","c":"固定搭配","t":"phrase","e":"The spike is attributable to a single tenant.","s":"运维文档","tp":"被动式，主语是结果，后面是原因。跟 attribute A to B 是同一个词的两个方向，读的时候先找「谁归给谁」。","n":"认读"},{"w":"due to","z":"由于","p":"phrase","c":"固定搭配","t":"phrase","e":"The timeout was due to a slow DNS lookup.","s":"运维文档","tp":"严格语法上 due to 修饰名词、owing to 修饰动词，但实际文档里早已混用，不必纠结。","n":"使用"},{"w":"in response to","z":"响应、作为对……的反应","p":"phrase","c":"固定搭配","t":"phrase","e":"The circuit opens in response to consecutive failures.","s":"设计文档","tp":"描述触发关系：后面是原因，前面是动作。读到它就把句子倒过来读。","n":"认读"},{"w":"on the grounds that","z":"基于……理由（判定时用）","p":"phrase","c":"固定搭配","t":"phrase","e":"The request was rejected on the grounds that the token expired.","s":"规范条文","tp":"法律味重，后面必须跟完整句子。多出现在拒绝、驳回、判定的语境里。","n":"认读"},{"w":"account for","z":"解释（原因）；占（比例）","p":"phrase","c":"固定搭配","t":"phrase","e":"Retries account for 40% of total traffic.","s":"运维文档","tp":"两个意思靠宾语判断：account for the difference 是「解释」，account for 40% 是「占比」。看到数字就是占比。","n":"使用"},{"w":"rule out","z":"排除（可能性）","p":"phrase","c":"固定搭配","t":"phrase","e":"This does not rule out a network partition.","s":"设计文档","tp":"文档里高频的是否定式 does not rule out = 不能排除。看到它说明作者在留余地，别读成「已经确认没问题」。","n":"使用"},{"w":"fall back to","z":"回退到（兜底方案）","p":"phrase","c":"固定搭配","t":"phrase","e":"If the cache misses, the client falls back to the database.","s":"设计文档","tp":"改走另一条路。跟 failover 区别：fall back 是换方案，failover 是换机器。","n":"使用"},{"w":"trade off","z":"权衡（牺牲一个换另一个）","p":"phrase","c":"固定搭配","t":"phrase","e":"You trade off consistency for availability.","s":"论文","tp":"动词分开写 trade off，名词连字符写 trade-off。读到它就要找「换来了什么、代价是什么」。","n":"使用"},{"w":"give rise to","z":"引起、导致（较正式）","p":"phrase","c":"固定搭配","t":"phrase","e":"Unbounded queues give rise to memory pressure.","s":"设计文档","tp":"主语通常是机制或设计，不是人。跟 cause 同义但更书面，论文里常见。","n":"认读"},{"w":"stem from","z":"源于（追溯根因）","p":"phrase","c":"固定搭配","t":"phrase","e":"Most timeouts stem from a single slow dependency.","s":"运维文档","tp":"顺着往下挖根因。跟 arise from 近义，stem from 更强调「根子在这里」。","n":"使用"},{"w":"phase out","z":"逐步淘汰（分阶段停用）","p":"phrase","c":"固定搭配","t":"phrase","e":"The v1 endpoint is being phased out.","s":"README","tp":"跟 deprecate 分工：deprecate 是「宣布要废」，phase out 是「真的在撤」。看到它说明还有过渡期，但期限已定。","n":"认读"},{"w":"opt for","z":"选择（在方案之间）","p":"phrase","c":"固定搭配","t":"phrase","e":"Opt for idempotent writes when retries are expected.","s":"设计文档","tp":"比 choose 正式，常出现在建议句里。跟 opt out 完全相反：一个是选进来，一个是退出。","n":"认读"},{"w":"factor in","z":"把……考虑进去","p":"phrase","c":"固定搭配","t":"phrase","e":"Factor in the cost of cross-region replication.","s":"设计文档","tp":"跟 consider 区别：factor in 强调「算进公式或预算里」，是可量化的。","n":"认读"},{"w":"idempotent","z":"幂等的（重复执行不改变状态）","p":"adj.","c":"必知术语","t":"word","e":"PUT is idempotent; repeating the same request yields the same state.","s":"规范条文","tp":"关键不是「返回相同结果」，是「重复执行不改变系统状态」。这是被误解最多的一个词。GET/PUT/DELETE 幂等、POST 通常不幂等——它直接决定重试安不安全。","n":"使用"},{"w":"backpressure","z":"背压（下游反过来让上游减速）","p":"n.","c":"必知术语","t":"word","e":"The consumer applies backpressure when its buffer fills up.","s":"框架文档","tp":"不是「压力大」，是一种主动的自保机制：下游处理不过来，反过来通知上游慢点发。跟 throttling 的区别：backpressure 是下游喊停，throttling 是上游自己限速。","n":"使用"},{"w":"throughput","z":"吞吐量（单位时间处理多少）","p":"n.","c":"必知术语","t":"word","e":"Throughput plateaus once the pool is saturated.","s":"性能文档","tp":"跟 latency 是跷跷板：并发推高了吞吐，延迟也跟着上去。**别把吞吐当「速度」**，它算的是量不是快慢。","n":"使用"},{"w":"latency","z":"延迟（单次请求耗时）","p":"n.","c":"必知术语","t":"word","e":"P99 latency degrades under sustained load.","s":"性能文档","tp":"跟 throughput 不是一回事：延迟低不代表吞吐高。文档里的 P95 / P99 是延迟分位数，不是平均值。","n":"使用"},{"w":"eventual consistency","z":"最终一致性","p":"n.","c":"必知术语","t":"phrase","e":"The index provides eventual consistency, not linearizability.","s":"设计文档","tp":"关键在「最终」没有时间承诺：可能几毫秒，也可能几分钟。**不是「很快一致」**。它换来的是可用性和分区容忍。","n":"使用"},{"w":"quorum","z":"法定人数、多数派","p":"n.","c":"必知术语","t":"word","e":"A write is acknowledged once a quorum responds.","s":"设计文档","tp":"通常指超过半数，但可以配置。**不等于「全部」**——正因为不需要全部，它才能容忍少数节点宕机。","n":"认读"},{"w":"sharding","z":"分片（按键把数据切开）","p":"n.","c":"必知术语","t":"word","e":"Sharding splits the table by tenant ID.","s":"设计文档","tp":"跟 partition 区别：partition 是逻辑切分，shard 通常指切开后分布在不同机器上。分片键选错是后期最难改的设计债。","n":"认读"},{"w":"failover","z":"故障转移（自动切到备份）","p":"n.","c":"必知术语","t":"word","e":"Failover to the standby takes about 30 seconds.","s":"运维文档","tp":"换机器干活。跟 fallback 区别：failover 是换节点，fallback 是换方案。跟 recovery 区别：failover 是切换，recovery 是修好再用。","n":"认读"},{"w":"circuit breaker","z":"熔断器（连续失败就断开）","p":"n.","c":"必知术语","t":"phrase","e":"The circuit breaker opens after five consecutive failures.","s":"设计文档","tp":"跟限流区别：熔断是「对方不行了，我先停手」，限流是「我自己要控制量」。三个状态：关闭、打开、半开。","n":"认读"},{"w":"rate limiting","z":"限流（限制单位时间请求数）","p":"n.","c":"必知术语","t":"phrase","e":"Rate limiting is applied per API key.","s":"API 文档","tp":"规则本身。跟 throttling 区别：rate limiting 是规则，throttling 是执行这个规则的动作。跟熔断区别见 circuit breaker 那条。","n":"使用"},{"w":"deadlock","z":"死锁（互相等，谁都不动）","p":"n.","c":"必知术语","t":"word","e":"Two transactions deadlock on the same row.","s":"设计文档","tp":"完全静止。跟 livelock 区别：活锁是一直在动但没进展。跟 starvation 区别：饥饿是有人一直抢不到。","n":"认读"},{"w":"race condition","z":"竞态（结果取决于执行顺序）","p":"n.","c":"必知术语","t":"phrase","e":"A race condition appears when the flag is read without a lock.","s":"设计文档","tp":"难复现、看运气。跟 data race 区别：data race 是「同时读写同一内存」这个具体问题，race condition 更广，指「顺序影响结果」。","n":"认读"},{"w":"schema","z":"结构定义（数据长什么样的约定）","p":"n.","c":"必知术语","t":"word","e":"The schema must be migrated before the deploy.","s":"设计文档","tp":"**不是「数据库」**，是表结构、消息格式、校验规则的总称。同一个词在数据库、Avro、JSON Schema 里各有所指。","n":"使用"},{"w":"payload","z":"有效载荷（报文里真正的内容）","p":"n.","c":"必知术语","t":"word","e":"The payload exceeds the 1 MB limit.","s":"API 文档","tp":"不含头的那部分数据。跟 body 区别：payload 更强调「有用的内容」，body 只是「正文部分」。限流和计费常按 payload 大小算。","n":"认读"},{"w":"graceful degradation","z":"优雅降级（部分功能挂了整体还能用）","p":"n.","c":"必知术语","t":"phrase","e":"Graceful degradation keeps search available when ranking fails.","s":"设计文档","tp":"跟 failover 区别：降级是「少做点事但别死」，转移是「换个人干」。关键词是 graceful——掉了但不难看。","n":"认读"},{"w":"arguably","z":"可以说、有理由认为","p":"adv.","c":"模糊限制语","t":"word","e":"This is arguably the most important change in the release.","s":"发布说明","tp":"不是「有争议地」。它的意思是「有充分理由这么讲」，作者在给判断加一层保护——不说这就是事实，但倾向于这么认为。看到它，等于作者承认还有别的答案站得住。","n":"认读"},{"w":"presumably","z":"据推测、按理说","p":"adv.","c":"模糊限制语","t":"word","e":"Presumably the cache is warmed before the first request.","s":"设计文档","tp":"作者在猜，而且没验证。出现这个词，往往意味着文档在这一环有推断缺口——你该去核对代码，而不是把它当成已知条件往下读。","n":"认读"},{"w":"seemingly","z":"表面上、看起来","p":"adv.","c":"模糊限制语","t":"word","e":"A seemingly harmless retry can double the write load.","s":"故障分析","tp":"「看起来」无害，实际不是。这个词几乎总在铺垫一个反转，后半句一定跟着 but 或实际后果。漏掉它，会把一条警告读成一句描述。","n":"认读"},{"w":"substantially","z":"大幅地、实质上","p":"adv.","c":"模糊限制语","t":"word","e":"Latency improves substantially once the index is rebuilt.","s":"性能文档","tp":"幅度大，但没给数字。跟 slightly、marginally 是同一条轴的两端。文档里用 substantially 又不给具体值，多半是没法保证——只能承诺「会好很多」。","n":"认读"},{"w":"virtually","z":"几乎、实际上","p":"adv.","c":"模糊限制语","t":"word","e":"Virtually all requests hit the cache after warm-up.","s":"性能文档","tp":"「几乎全部」，不是「全部」。留了那一点例外，而例外往往就是出问题的地方。别读成 100%。","n":"认读"},{"w":"roughly","z":"大约、粗略地","p":"adv.","c":"模糊限制语","t":"word","e":"The job takes roughly 20 minutes on a cold start.","s":"运维手册","tp":"口头估的数，不承诺。跟 approximately 意思接近，差别在底气：roughly 是估的，approximately 通常背后有测算。","n":"认读"},{"w":"approximately","z":"约、近似","p":"adv.","c":"模糊限制语","t":"word","e":"Each shard holds approximately 50 GB of data.","s":"容量规划","tp":"比 roughly 正式，一般有测算依据。做容量估算时用得上这个区别：看到 approximately 说明作者算过，看到 roughly 说明作者在估。","n":"认读"},{"w":"potentially","z":"可能、有潜在风险","p":"adv.","c":"模糊限制语","t":"word","e":"This flag can potentially cause data loss.","s":"配置说明","tp":"风险提示的固定开头。它不保证一定发生，但列出来的都是真出过事的情况。文档里出现，就该按「会发生」来防。","n":"认读"},{"w":"viable","z":"站得住的、能长期运转的","p":"adj.","c":"评估判断","t":"word","e":"Sharding is viable only after the write volume exceeds a single node.","s":"架构评审","tp":"问的是「这东西能不能活下去」——成本、运维、长期维护撑不撑得住。跟 feasible 的区别：feasible 是「做不做得到」，viable 是「做出来值不值得一直养着」。","n":"认读"},{"w":"feasible","z":"做得到的、技术上可行","p":"adj.","c":"评估判断","t":"word","e":"Incremental migration is feasible without downtime.","s":"迁移方案","tp":"问的是「技术上有没有这条路」。不谈成本和收益，只谈能不能做成。评审里说 feasible，通常意味着「能做，但要不要做另说」。","n":"认读"},{"w":"adequate","z":"够用的、刚够","p":"adj.","c":"评估判断","t":"word","e":"In-memory caching is adequate for the current traffic.","s":"容量评估","tp":"刚好够，不带余量。这是偏保守的评价——说 adequate 等于说「现在行，再涨就不行了」。千万别读成「好」。","n":"认读"},{"w":"obsolete","z":"已淘汰的、没人再用的","p":"adj.","c":"评估判断","t":"word","e":"The v1 API is obsolete and will be removed.","s":"版本公告","tp":"事实上已经过时，新代码不该再用。跟 deprecated 的区别：deprecated 是官方还留着、只是标了弃用；obsolete 是已经没人维护、该消失了。","n":"认读"},{"w":"deprecated","z":"已弃用的、还能用但不建议","p":"adj.","c":"评估判断","t":"word","e":"This method is deprecated; use the async variant instead.","s":"接口文档","tp":"还能跑，官方给了替代方案，但没删。看到它意味着「现在不改也行，下一个大版本会消失」。这跟 obsolete 不是一回事，混了会错判升级的紧迫性。","n":"认读"},{"w":"trivial","z":"微不足道的、不费力的","p":"adj.","c":"评估判断","t":"word","e":"The change looks trivial but touches the auth path.","s":"代码评审","tp":"两层意思看语境：说工作量是「改起来轻松」，说影响是「几乎没影响」。文档里 trivial 后面跟 but，基本就是在提醒你别被表象骗了。","n":"认读"},{"w":"paramount","z":"首要的、高于其他一切","p":"adj.","c":"评估判断","t":"word","e":"Data integrity is paramount during migration.","s":"迁移方案","tp":"比 important 高一级，隐含「别的都得让步」。写在方案里等于给了你一条裁决依据——性能和完整性打架的时候，完整性赢。","n":"认读"},{"w":"premature","z":"为时过早的","p":"adj.","c":"评估判断","t":"word","e":"Optimizing before profiling is premature.","s":"性能指南","tp":"不是「早」，是「时机不对、做了也白做」。常用来否掉一个提议，而且否的是时机，不是方案本身。","n":"认读"},{"w":"spike","z":"陡增、尖峰","p":"n.","c":"趋势走势","t":"word","e":"Latency spikes during the nightly batch job.","s":"监控文档","tp":"短时间冲高又落回来，形状是尖的。也作动词。跟 surge 的区别：spike 是尖峰、很快回落；surge 是持续一段的激增。报警里的 spike 多是瞬时压力，不是容量问题。","n":"认读"},{"w":"surge","z":"激增、持续上涨","p":"n.","c":"趋势走势","t":"word","e":"Traffic surges after the campaign goes live.","s":"大促预案","tp":"涨得快，而且会维持一段。也作动词。跟 spike 相反——surge 是要做容量准备的信号，spike 往往扛过去就行。","n":"认读"},{"w":"plateau","z":"进入平台期、趋于平稳","p":"n.","c":"趋势走势","t":"word","e":"Throughput plateaus around 8k requests per second.","s":"压测报告","tp":"涨到某个点就不涨了，曲线变平。也作动词。压测里看到 plateau，基本就是找到瓶颈了——再加压也不会更快。","n":"认读"},{"w":"taper","z":"逐渐减小、逐步收窄","p":"v.","c":"趋势走势","t":"word","e":"Errors taper off once the retry budget is tuned.","s":"故障复盘","tp":"慢慢变小，不是一下归零。跟 plateau 的区别：taper 是往下走的过程，plateau 是停住不动。常跟 off 连用。","n":"认读"},{"w":"dwindle","z":"逐渐萎缩、越来越少","p":"v.","c":"趋势走势","t":"word","e":"The queue dwindles to zero within a minute.","s":"队列文档","tp":"持续变少直到见底，带「慢慢耗尽」的意味。描述积压消化、连接释放时常用。","n":"认读"},{"w":"uptick","z":"小幅回升","p":"n.","c":"趋势走势","t":"word","e":"A slight uptick in errors followed the deploy.","s":"发布复盘","tp":"小幅上升。跟 spike 比幅度小得多，语气也轻——通常暗示「值得关注，但不用紧张」。发布后看到 uptick，先查是不是新版本引起的。","n":"认读"},{"w":"downturn","z":"下行、转为下降","p":"n.","c":"趋势走势","t":"word","e":"The metric shows a sharp downturn after the config change.","s":"数据看板","tp":"是从涨转跌的那个转折，不是单纯「低」。说 downturn 意味着之前是好的、现在变差了。","n":"认读"},{"w":"decline","z":"下降、走低","p":"v.","c":"趋势走势","t":"word","e":"Cache hit rate declines as the key space grows.","s":"缓存文档","tp":"中性词，单纯往下走，不带好坏判断。比 downturn 平，更适合描述长期趋势。","n":"认读"},{"w":"stabilize","z":"趋于稳定、稳定下来","p":"v.","c":"趋势走势","t":"word","e":"Latency stabilizes after the warm-up period.","s":"性能文档","tp":"波动收窄到可接受范围，不是「一动不动」。系统刚启动抖动过去、进入平稳段，就是这个状态。","n":"认读"},{"w":"roll out","z":"逐步发布、铺开","p":"phr.","c":"固定搭配","t":"phrase","e":"The feature will be rolled out to 10% of traffic first.","s":"运维文档","tp":"分阶段推给用户，不是一次性全上。跟 release 区别：release 是发版，roll out 是发到用户手里。","n":"使用"},{"w":"roll back","z":"回滚（退回上一版本）","p":"phr.","c":"固定搭配","t":"phrase","e":"Roll back to the previous version if the error rate exceeds 1%.","s":"运维文档","tp":"部署层面的退版。跟 revert 区别：roll back 是整包退回去，revert 是代码里撤销某个提交。","n":"使用"},{"w":"carry out","z":"执行（任务、计划）","p":"phr.","c":"固定搭配","t":"phrase","e":"The migration is carried out in three stages.","s":"运维文档","tp":"执行。比 do 正式，常配 migration / test / upgrade。被动式 is carried out 在规范里高频。","n":"认读"},{"w":"spin up","z":"快速启动（实例、环境）","p":"phr.","c":"固定搭配","t":"phrase","e":"Spin up a temporary cluster for the load test.","s":"运维文档","tp":"临时起一个，含「快、用完就拆」的意味。反向是 tear down。","n":"使用"},{"w":"tear down","z":"拆除（环境、资源）","p":"phr.","c":"固定搭配","t":"phrase","e":"The environment is torn down after the test.","s":"运维文档","tp":"跟 spin up 成对。过去式是 torn down，不是 teared。","n":"认读"},{"w":"opt in","z":"选择加入（默认不启用）","p":"phr.","c":"固定搭配","t":"phrase","e":"Tenants must opt in to the new billing model.","s":"配置说明","tp":"默认关闭、主动开启。跟 opt out 方向相反，这一对读错会导致该开的功能没开。","n":"使用"},{"w":"opt out","z":"选择退出（默认启用）","p":"phr.","c":"固定搭配","t":"phrase","e":"Users can opt out of telemetry at any time.","s":"配置说明","tp":"默认开启、主动关闭。合规文档里靠它判断「默认收集数据是否合法」。","n":"使用"},{"w":"break down","z":"分解（按维度拆）；出故障","p":"phr.","c":"固定搭配","t":"phrase","e":"Break the metric down by endpoint.","s":"运维文档","tp":"两个意思：拆解分析（break down by），或机器坏了（the link broke down）。靠宾语判断。","n":"认读"},{"w":"scale up","z":"纵向扩容（加配置）","p":"phr.","c":"固定搭配","t":"phrase","e":"Scale up the instance before scaling out.","s":"运维文档","tp":"给单机加 CPU 和内存。跟 scale out 区别：up 是变大，out 是变多。","n":"使用"},{"w":"scale out","z":"横向扩容（加机器）","p":"phr.","c":"固定搭配","t":"phrase","e":"Scale out by adding two more replicas.","s":"运维文档","tp":"加机器。上限比 scale up 高，但要求服务无状态。","n":"使用"},{"w":"narrow down","z":"缩小范围（逐步排除）","p":"phr.","c":"固定搭配","t":"phrase","e":"Narrow down the failing case by bisecting the config.","s":"运维文档","tp":"逐步收窄。排查故障时最常做的动作，比 find 更强调过程。","n":"认读"},{"w":"weed out","z":"剔除（不合格的）","p":"phr.","c":"固定搭配","t":"phrase","e":"The check weeds out malformed records.","s":"设计文档","tp":"把坏的挑出去。比 filter 更强调「清理掉坏的」这层贬义。","n":"认读"},{"w":"figure out","z":"搞清楚、弄明白","p":"phr.","c":"固定搭配","t":"phrase","e":"Figure out which node holds the lease.","s":"设计文档","tp":"口语化，但 README 和 issue 里极常见。等于 work out。","n":"认读"},{"w":"come up with","z":"想出（方案、办法）","p":"phr.","c":"固定搭配","t":"phrase","e":"They came up with a sharding scheme.","s":"设计文档","tp":"提出、想到。跟 come across 完全不同——那是「偶然遇到」。","n":"认读"},{"w":"look into","z":"调查（问题）","p":"phr.","c":"固定搭配","t":"phrase","e":"We are looking into the latency regression.","s":"运维文档","tp":"issue 里的标准说法：正在查，还没结论。跟 look up 区别：那是「查资料」。","n":"使用"},{"w":"run into","z":"遇到（问题、麻烦）","p":"phr.","c":"固定搭配","t":"phrase","e":"You may run into a deadlock if the lock order differs.","s":"文档","tp":"碰上。跟 run out of 区别：那是「用完了」。两个短语只差一个词，意思差很远。","n":"认读"},{"w":"end up","z":"最终变成、最后落到","p":"phr.","c":"固定搭配","t":"phrase","e":"The request ends up in the dead-letter queue.","s":"设计文档","tp":"强调最终状态，常暗示「不是预期的结果」。追链路时很有用。","n":"认读"},{"w":"turn out","z":"结果是（往往出乎意料）","p":"phr.","c":"固定搭配","t":"phrase","e":"The bottleneck turned out to be DNS.","s":"运维文档","tp":"复盘常用：本以为在 A，结果是 B。跟 end up 区别：turn out 一定含「意外」。","n":"认读"},{"w":"back off","z":"退避（重试间隔拉长）","p":"phr.","c":"固定搭配","t":"phrase","e":"The client backs off exponentially after each failure.","s":"设计文档","tp":"重试之间越等越久，exponential backoff 就是这个。跟 give up 区别：back off 还在试，只是慢下来。","n":"使用"},{"w":"hold off","z":"推迟、暂缓","p":"phr.","c":"固定搭配","t":"phrase","e":"Hold off on the upgrade until the fix ships.","s":"运维文档","tp":"先别做。比 delay 口语，常配 on + 名词。","n":"认读"},{"w":"lay out","z":"布局；铺开说明","p":"phr.","c":"固定搭配","t":"phrase","e":"The doc lays out the migration steps.","s":"文档","tp":"两个用法：界面布局，或把步骤条理化讲清楚。","n":"认读"},{"w":"map out","z":"规划（路径、步骤）","p":"phr.","c":"固定搭配","t":"phrase","e":"Map out the cutover plan before the freeze.","s":"运维文档","tp":"把路线排出来。比 plan 更强调「可视化地铺开」。","n":"认读"},{"w":"shut down","z":"关闭（服务、系统）","p":"phr.","c":"固定搭配","t":"phrase","e":"The node shuts down gracefully within 30 seconds.","s":"运维文档","tp":"正常关闭流程。跟 shut off 区别：shut down 是软件流程，shut off 是断电源。","n":"认读"},{"w":"kick off","z":"启动（流程、事件）","p":"phr.","c":"固定搭配","t":"phrase","e":"The pipeline kicks off on every merge.","s":"文档","tp":"开跑。比 start 口语，CI/CD 文档里极常见。","n":"认读"},{"w":"wrap up","z":"收尾、结束","p":"phr.","c":"固定搭配","t":"phrase","e":"Wrap up the session before releasing the lock.","s":"设计文档","tp":"把没做完的做完再结束。比 finish 多一层「收拾干净」。","n":"认读"},{"w":"bring up","z":"启动（服务）；提出（话题）","p":"phr.","c":"固定搭配","t":"phrase","e":"Bring up a standby node before draining the primary.","s":"运维文档","tp":"两个意思：把服务起起来，或把问题提出来。靠宾语判断。","n":"认读"},{"w":"go through","z":"过一遍（流程）；经历","p":"phr.","c":"固定搭配","t":"phrase","e":"Every request goes through the same auth chain.","s":"设计文档","tp":"描述链路时高频：请求要「走完」这几步。跟 pass through 近义。","n":"认读"},{"w":"sort out","z":"解决（麻烦事）","p":"phr.","c":"固定搭配","t":"phrase","e":"We sorted out the version conflict.","s":"文档","tp":"把乱的理顺。跟 figure out 区别：figure out 是想明白，sort out 是处理掉。","n":"认读"},{"w":"work out","z":"算出；解决；行得通","p":"phr.","c":"固定搭配","t":"phrase","e":"Work out the expected QPS before sizing the pool.","s":"设计文档","tp":"三个意思靠上下文。技术文档里多是「算出来」。","n":"认读"},{"w":"put up with","z":"忍受","p":"phr.","c":"固定搭配","t":"phrase","e":"Users should not have to put up with 2s latency.","s":"设计文档","tp":"容忍。写设计文档论证必要性时常用，语气比 tolerate 更口语、更有情绪。","n":"认读"}]},{"id":"L3-C","level":"L3","name":"协作与沟通","desc":"需求、会议、邮件、测试沟通","items":[{"w":"requirement","z":"需求","c":"需求沟通","t":"word","sc":"需求评审","e":"The business team raised a new ____ for real-time settlement, which was not in the original plan.","ez":"业务方提了一个实时结算的新需求，不在原计划里。","d":["demand","request","specification"],"df":"requirement 是「必须满足的条件」；request 是「有人提出要你做」这个动作；demand 带强制或市场需求的意味；specification 是把 requirement 写成文档后的产物。","tp":"需求是「系统必须满足什么」，可以验收。request 只是「有人提了」，还没被接受。很多争执源于把 request 当成了 requirement。","n":"认读"},{"w":"stakeholder","z":"干系人 / 相关方","c":"需求沟通","t":"word","sc":"需求评审","e":"We need all ____ to agree on the scope before the design review.","ez":"设计评审之前，要让所有相关方对范围达成一致。","d":["shareholder","sponsor","participant"],"df":"stakeholder 泛指受影响或能影响这件事的人，包括业务、风控、运维；shareholder 只指持股人；sponsor 是出钱拍板的那个；participant 只是参加了会议。","tp":"判断标准只有一条：这件事成或不成，他会不会有意见。会，就是 stakeholder。跟股权、职级无关。","n":"认读"},{"w":"scope","z":"范围","c":"需求沟通","t":"word","sc":"需求评审","e":"Let us freeze the ____ before we estimate the effort; otherwise the estimate is meaningless.","ez":"先把范围定下来再估工作量，否则估出来的数没有意义。","d":["range","extent","boundary"],"df":"scope 在项目语境里特指「这次做哪些、不做哪些」的清单；range 是数值或种类的跨度；extent 是程度；boundary 是边界线。","tp":"scope 不是「多大」，是「包含哪些」。所以定 scope 是把条目列出来，不是画个圈。","n":"认读"},{"w":"out of scope","z":"不在范围内","c":"需求沟通","t":"phrase","sc":"需求评审","e":"Single sign-on is ____ for phase one; it will be considered in the next funding cycle.","ez":"单点登录不在一期范围内，下个预算周期再考虑。","d":["out of range","off the table","out of bounds"],"df":"out of scope 是「这次不做，以后可能做」；off the table 是「不谈了，没有商量余地」；out of range 是数值越界；out of bounds 是越界或禁止访问。","tp":"out of scope 不等于永远不做。看到它就别往本期需求里加，加了就叫 scope creep。","n":"使用"},{"w":"scope creep","z":"范围蔓延","c":"需求沟通","t":"word","sc":"需求评审","e":"Adding just one more field every week is classic ____.","ez":"每周都多要一个字段，这是典型的范围蔓延。","d":["scope change","feature bloat","gold plating"],"df":"scope creep 是一点点加、没人正式批准；scope change 是走了变更流程的正规变更；feature bloat 是功能越堆越多导致臃肿；gold plating 是开发自己加的、对方没要求的功能。","tp":"判断标准只有一条：有没有走变更流程。没走就是 creep。它的特点是每次都很小，加起来才致命。","n":"认读"},{"w":"acceptance criteria","z":"验收标准","c":"需求沟通","t":"phrase","sc":"需求评审","e":"The ticket is not done until it meets every ____ listed in the description.","ez":"描述里列的每一条验收标准都满足了，这个工单才算完成。","d":["definition of done","test case","success criteria"],"df":"acceptance criteria 是针对某一个需求「怎样算做完」；definition of done 是团队所有任务共用的底线；test case 是验证手段；success criteria 偏项目级的成功指标。","tp":"验收标准是「对方拿什么验收你」。写不清楚，最后一定扯皮，而且扯皮时你没有依据。","n":"使用"},{"w":"sign-off","z":"签字确认 / 正式批准","c":"需求沟通","t":"word","sc":"正式邮件","e":"We cannot go live without the risk team's ____.","ez":"没有风控团队的正式批准，我们不能上线。","d":["approval","confirmation","consent"],"df":"sign-off 是正式、留痕、有责任人的批准，通常书面；approval 泛指同意；confirmation 只是确认信息收到；consent 多用于个人信息或医疗场景的「同意」。","tp":"sign-off 的关键不是「同意」，是「留痕」。口头答应不叫 sign-off，出事时拿不出来。","n":"使用"},{"w":"clarify","z":"澄清","c":"需求沟通","t":"word","sc":"需求评审","e":"Could you ____ whether the cutoff time is 23:00 or 00:00?","ez":"能否澄清一下截止时间是 23 点还是 0 点？","d":["explain","confirm","specify"],"df":"clarify 是把模糊的变清楚；explain 是把不懂的讲明白；confirm 是「我理解是这样，对吗」；specify 是从没说到说定。","tp":"clarify 的前提是「这话有歧义」，不是「我没听懂」。所以提 clarify 是专业动作，不是能力问题。","n":"使用"},{"w":"ambiguity","z":"歧义 / 表述不清","c":"需求沟通","t":"word","sc":"需求评审","e":"The ____ in «process the request within one day» is whether one day means calendar day or business day.","ez":"「一天内处理完请求」这句话的歧义在于，一天是自然日还是工作日。","d":["uncertainty","vagueness","confusion"],"df":"ambiguity 是同一句话能有两种解释；vagueness 是说得太笼统、没有具体值；uncertainty 是不知道结果；confusion 是人的状态。","tp":"ambiguity 能定位到具体那句话。发现它要当场问，不要自己挑一个解释往下做，做错责任在你。","n":"认读"},{"w":"assumption","z":"假设 / 假定","c":"需求沟通","t":"word","sc":"需求评审","e":"Our estimate is based on the ____ that the upstream service already de-duplicates records.","ez":"我们的估时基于一个假设：上游服务已经做了去重。","d":["premise","hypothesis","prerequisite"],"df":"assumption 是当作成立但没验证的前提，必须写出来；premise 是论证的出发点，通常已被接受；hypothesis 是待验证的猜想；prerequisite 是必须先具备的条件。","tp":"assumption 一定要写进文档。不写，将来它不成立时责任在你；写了，就是共同决策。","n":"使用"},{"w":"constraint","z":"约束 / 限制条件","c":"需求沟通","
